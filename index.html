    const PlatformConnectionBanner = ({ platform, icon: Icon, color, title, isConnected, accounts, selectedId, onConnect, onDisconnect, onSelect }) => {
      if (!isConnected) return (
        <div className="flex items-center justify-between bg-gradient-to-r from-gray-50 to-white border border-gray-200 rounded-2xl p-4 mb-4 shadow-sm">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{backgroundColor:color+'18',border:`1.5px solid ${color}35`}}><Icon size={20} style={{color}}/></div>
            <div>
              <p className="font-bold text-gray-900 text-sm">{title}</p>
              <p className="text-xs text-gray-400 mt-0.5">Conecte sua conta para ver métricas reais desta plataforma</p>
            </div>
          </div>
          <button onClick={onConnect}
            className="px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition hover:opacity-90 shadow-sm"
            style={{backgroundColor:color, color:'#fff'}}>
            <Link size={14}/> Conectar
          </button>
        </div>
      );
      return (
        <div className="flex items-center justify-between bg-emerald-50 border border-emerald-200 rounded-2xl p-4 mb-4 shadow-sm">
          <div className="flex items-center gap-3">
            <div className="w-11 h-11 rounded-xl flex items-center justify-center bg-emerald-100"><Icon size={20} className="text-emerald-600"/></div>
            <div>
              <div className="flex items-center gap-2 mb-1">
                <p className="font-bold text-gray-900 text-sm">{title}</p>
                <span className="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-700 bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded-full"><CheckCircle2 size={9}/> Conectado</span>
              </div>
              <select value={selectedId||''} onChange={e=>onSelect(e.target.value)}
                className="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white text-gray-700 font-semibold outline-none focus:border-gray-400 shadow-sm">
                {accounts.map(a=><option key={a.id} value={a.id}>{a.name}{a.currency ? ` (${a.currency})` : a.account ? ` — ${a.account}` : ''}</option>)}
              </select>
            </div>
          </div>
          <button onClick={onDisconnect}
            className="px-3 py-2 rounded-xl border border-red-200 bg-white text-red-500 text-xs font-bold flex items-center gap-1.5 hover:bg-red-50 transition shadow-sm">
            <Unlink size={12}/> Desconectar
          </button>
        </div>
      );
    };

    const ClientTrafficTab = ({ primaryColor }) => {
      const [subTab, setSubTab] = useState('overview');
      const [showModal, setShowModal] = useState(null);
      const [realData, setRealData] = useState({ meta: null, ga4: null });
      const [loadingReal, setLoadingReal] = useState(false);
      const { isConnected, getSelectedAccount, getAccounts, connectPlatform, disconnectPlatform, selectAccount, getSeed, loadingStatus, reload } = usePlatformConnections();
      const toast = useToast();

      const PLATFORMS = {
        meta: { title:'Meta Ads',           icon:Target,   color:'#1877F2' },
        gads: { title:'Google Ads',         icon:Globe,    color:'#4285F4' },
        ga4:  { title:'Google Analytics 4', icon:Activity, color:'#E37400' },
      };
      const CLIENT_TRAFFIC_SUBS = [
        {id:'overview',   label:'Visão Geral',  icon:LayoutDashboard},
        {id:'meta',       label:'Meta Ads',     icon:Target},
        {id:'gads',       label:'Google Ads',   icon:Globe},
        {id:'ga4',        label:'GA4',          icon:Activity},
        {id:'criativos',  label:'Criativos',    icon:Star},
        {id:'estrategia', label:'Estratégia',   icon:MapPin},
      ];
      const PLAT_TABS = { meta:'meta', gads:'gads', ga4:'ga4' };
      const currentPlat = PLAT_TABS[subTab] || null;

      // Fetch dados reais quando troca de aba ou quando status muda
      useEffect(() => {
        if (!currentPlat) return;
        if (currentPlat === 'meta' && isConnected('meta')) {
          const acctId = getSelectedAccount('meta');
          if (!acctId) return;
          setLoadingReal(true);
          const end = new Date(); const start = new Date(); start.setDate(start.getDate() - 29);
          const fmt = d => d.toISOString().slice(0,10);
          api(`/traffic/meta/insights?account_id=${acctId}&since=${fmt(start)}&until=${fmt(end)}`)
            .then(d => setRealData(prev => ({ ...prev, meta: d })))
            .catch(e => toast(e.message, 'error'))
            .finally(() => setLoadingReal(false));
        }
        if (currentPlat === 'ga4' && isConnected('ga4')) {
          const propId = getSelectedAccount('ga4');
          if (!propId) return;
          setLoadingReal(true);
          api(`/traffic/ga4/metrics?property_id=${propId}`)
            .then(d => setRealData(prev => ({ ...prev, ga4: d })))
            .catch(e => toast(e.message, 'error'))
            .finally(() => setLoadingReal(false));
        }
      }, [subTab, isConnected('meta'), isConnected('ga4'), getSelectedAccount('meta'), getSelectedAccount('ga4')]);

      // Detecta retorno OAuth e mostra toast
      useEffect(() => {
        const p = new URLSearchParams(window.location.search);
        if (p.get('traffic_meta') === 'ok') toast('Meta Ads conectado com sucesso!', 'success');
        if (p.get('traffic_meta') === 'error') toast('Erro ao conectar Meta Ads', 'error');
        if (p.get('traffic_google') === 'ok') toast('Google Analytics conectado!', 'success');
        if (p.get('traffic_google') === 'error') toast('Erro ao conectar Google', 'error');
      }, []);

      const handleConnect = (plat) => {
        const oauthPlat = plat === 'ga4' ? 'google' : plat;
        setShowModal({ platform: plat, oauthPlatform: oauthPlat });
      };

      const handleDisconnect = async (plat) => {
        await disconnectPlatform(plat);
        setRealData(prev => ({ ...prev, [plat]: null }));
        toast('Conta desconectada', 'success');
      };

      return (
        <div className="space-y-4 animate-in fade-in duration-300">
          {showModal && PLATFORMS[showModal.platform] && (
            <ConnectPlatformModal
              platform={showModal.platform}
              title={PLATFORMS[showModal.platform].title}
              icon={PLATFORMS[showModal.platform].icon}
              color={PLATFORMS[showModal.platform].color}
              onConfirm={() => { setShowModal(null); connectPlatform(showModal.oauthPlatform); }}
              onClose={() => setShowModal(null)}
            />
          )}
          <div className="flex gap-1 flex-wrap bg-white border border-gray-200 rounded-2xl p-1.5 shadow-sm">
            {CLIENT_TRAFFIC_SUBS.map(t => {
              const Icon = t.icon, plat = PLAT_TABS[t.id], conn = plat ? isConnected(plat) : false;
              return (
                <button key={t.id} onClick={() => setSubTab(t.id)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all relative ${subTab===t.id?'text-black shadow-sm':'text-gray-500 hover:text-gray-800'}`}
                  style={subTab===t.id?{backgroundColor:primaryColor}:{}}>
                  <Icon size={12}/> {t.label}
                  {plat && conn && <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 absolute -top-0.5 -right-0.5"/>}
                </button>
              );
            })}
          </div>

          {/* Banner de conexão por plataforma */}
          {currentPlat && PLATFORMS[currentPlat] && (
            <PlatformConnectionBanner
              platform={currentPlat}
              icon={PLATFORMS[currentPlat].icon}
              color={PLATFORMS[currentPlat].color}
              title={PLATFORMS[currentPlat].title}
              isConnected={isConnected(currentPlat)}
              accounts={getAccounts(currentPlat)}
              selectedId={getSelectedAccount(currentPlat)}
              onConnect={() => handleConnect(currentPlat)}
              onDisconnect={() => handleDisconnect(currentPlat)}
              onSelect={id => selectAccount(currentPlat, id)}
            />
          )}

          {/* Indicador de dados reais */}
          {loadingReal && (
            <div className="flex items-center gap-2 text-xs text-gray-500 bg-blue-50 border border-blue-100 px-4 py-2.5 rounded-xl">
              <Loader2 size={13} className="animate-spin text-blue-500"/> Carregando dados reais da plataforma...
            </div>
          )}
          {currentPlat && realData[currentPlat === 'gads' ? 'ga4' : currentPlat] && !loadingReal && (
            <div className="flex items-center gap-2 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-4 py-2.5 rounded-xl">
              <CheckCircle2 size={13}/> Exibindo dados reais da sua conta
            </div>
          )}

          <AdminTrafficTab
            primaryColor={primaryColor}
            activeTab={subTab}
            accountSeed={getSeed()}
            realData={realData}
            zeroWhenEmpty={true}
          />
        </div>
      );
    };

    /* =========================================================
       OVERVIEW TAB
       ========================================================= */
    const OverviewTab = ({ agent, primaryColor, borderLight }) => {
      const [stats, setStats] = useState(null);
      const [loading, setLoading] = useState(true);
      const [tab, setTab] = useState('resumo');
      const [dateRange, setDateRange] = useState({ label: 'Últimos 30 dias', preset: '30d' });
      const [showDatePicker, setShowDatePicker] = useState(false);
      const [pickerMonthC, setPickerMonthC] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [pickStartC, setPickStartC] = useState(null);
      const [pickEndC, setPickEndC] = useState(null);
      const toast = useToast();

      const [kpiOverrides, setKpiOverrides] = useState(() => {
        try { return JSON.parse(localStorage.getItem(`pixt_kpi_agent_${agent.slug}`) || '{}'); } catch { return {}; }
      });
      const [editKPIItem, setEditKPIItem] = useState(null);
      const periodKey = dateRange.label;
      const saveKPIOverride = (key, val) => {
        const upd = { ...kpiOverrides, [key]: val };
        setKpiOverrides(upd);
        localStorage.setItem(`pixt_kpi_agent_${agent.slug}`, JSON.stringify(upd));
        setEditKPIItem(null);
      };
      const clearKPIOverride = (key) => {
        const upd = { ...kpiOverrides }; delete upd[key];
        setKpiOverrides(upd);
        localStorage.setItem(`pixt_kpi_agent_${agent.slug}`, JSON.stringify(upd));
        setEditKPIItem(null);
      };

      const applyPresetC = (preset) => {
        const labels = { '7d':'Últimos 7 dias', '14d':'Últimos 14 dias', '30d':'Últimos 30 dias', '90d':'Últimos 90 dias' };
        setDateRange({ label: labels[preset] || preset, preset });
        setPickStartC(null); setPickEndC(null); setShowDatePicker(false);
      };
      const fmtDPC = d => d ? `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}` : '--';
      const calDaysC = (() => {
        const yr = pickerMonthC.getFullYear(), mo = pickerMonthC.getMonth();
        const first = new Date(yr, mo, 1), last = new Date(yr, mo+1, 0);
        const days = [];
        for (let i=0; i<first.getDay(); i++) days.push(null);
        for (let d=1; d<=last.getDate(); d++) days.push(new Date(yr, mo, d));
        return days;
      })();
      const handlePickDayC = (day) => {
        if (!day) return;
        const d = new Date(day); d.setHours(0,0,0,0);
        if (!pickStartC || (pickStartC && pickEndC)) { setPickStartC(d); setPickEndC(null); }
        else if (d < pickStartC) { setPickEndC(pickStartC); setPickStartC(d); }
        else { setPickEndC(d); }
      };
      const isDayInC = (d) => { if(!d||!pickStartC) return false; const t=d.getTime(); if(pickEndC) return t>=pickStartC.getTime()&&t<=pickEndC.getTime(); return t===pickStartC.getTime(); };
      const isDayStartC = (d) => d && pickStartC && d.getTime()===pickStartC.getTime();
      const isDayEndC   = (d) => d && pickEndC   && d.getTime()===pickEndC.getTime();
      const applyCustomRangeC = () => {
        if (!pickStartC||!pickEndC) return;
        const diff = Math.round((pickEndC.getTime()-pickStartC.getTime())/86400000)+1;
        setDateRange({ label:`${fmtDPC(pickStartC)} → ${fmtDPC(pickEndC)} (${diff}d)`, preset:'custom' });
        setShowDatePicker(false);
      };

      useEffect(() => {
        let mounted = true;
        setLoading(true);
        api(`/stats/${agent.slug}`).then(d => { if (mounted) setStats(d); }).catch(e => toast(e.message, 'error')).finally(() => mounted && setLoading(false));
        return () => { mounted = false; };
      }, [agent.slug]);

      if (loading) return <Loading />;
      if (!stats) return <Empty msg="Sem estatísticas" />;

      const fmtN = v => Number(v||0).toLocaleString('pt-BR');
      const fmtC = v => `R$ ${Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
      const fmtP = v => `${Number(v||0).toFixed(1)}%`;

      const _interactions = stats.cards.interactions||0;
      const _conversations = stats.cards.conversations||0;
      const _activeLeads   = stats.cards.activeLeads||0;
      const _events        = stats.cards.events||0;
      const _conversion    = parseFloat(stats.extras.conversionRate)||0;
      const _ticket        = parseFloat(String(stats.extras.avgTicket).replace(/[^0-9.]/g,''))||0;
      const kpis = (() => {
        if (agent.slug === 'leadflow') return [
          { title:'Leads Captados',       val:_activeLeads,   prev:_activeLeads*0.85,   fmt:'n', icon:UserPlus,      color:'#3b82f6' },
          { title:'Follow-ups Feitos',    val:_interactions,  prev:_interactions*0.88,  fmt:'n', icon:Send,          color:'#8b5cf6' },
          { title:'Em Qualificação',      val:_conversations, prev:_conversations*0.84, fmt:'n', icon:Activity,      color:'#10b981' },
          { title:'Eventos de CRM',       val:_events,        prev:_events*0.87,        fmt:'n', icon:Calendar,      color:'#f59e0b' },
          { title:'Taxa de Qualificação', val:_conversion,    prev:_conversion*0.9,     fmt:'p', icon:TrendingUp,    color:'#c6f432', hl:true },
          { title:'Ticket Médio',         val:_ticket,        prev:_ticket*0.91,        fmt:'c', icon:DollarSign,    color:'#ec4899', hl:true },
        ];
        if (agent.slug === 'booker') return [
          { title:'Reuniões Agendadas',   val:_events,        prev:_events*0.85,        fmt:'n', icon:Calendar,      color:'#3b82f6' },
          { title:'Confirmações',         val:_conversations, prev:_conversations*0.87, fmt:'n', icon:CheckCircle2,  color:'#10b981' },
          { title:'Contatos Ativos',      val:_activeLeads,   prev:_activeLeads*0.91,   fmt:'n', icon:Users,         color:'#8b5cf6' },
          { title:'Interações Totais',    val:_interactions,  prev:_interactions*0.88,  fmt:'n', icon:Activity,      color:'#f59e0b' },
          { title:'Taxa de Confirmação',  val:_conversion,    prev:_conversion*0.9,     fmt:'p', icon:TrendingUp,    color:'#c6f432', hl:true },
          { title:'Receita Gerada',       val:_ticket,        prev:_ticket*0.91,        fmt:'c', icon:DollarSign,    color:'#ec4899', hl:true },
        ];
        if (agent.slug === 'pixt-bdr') return [
          { title:'Leads Extraídos',      val:_activeLeads,   prev:_activeLeads*0.82,   fmt:'n', icon:MapPin,        color:'#3b82f6' },
          { title:'Mensagens Enviadas',   val:_interactions,  prev:_interactions*0.88,  fmt:'n', icon:Send,          color:'#8b5cf6' },
          { title:'Respostas Recebidas',  val:_conversations, prev:_conversations*0.84, fmt:'n', icon:MessageSquare, color:'#10b981' },
          { title:'Prospecções Ativas',   val:_events,        prev:_events*0.87,        fmt:'n', icon:Target,        color:'#f59e0b' },
          { title:'Taxa de Resposta',     val:_conversion,    prev:_conversion*0.9,     fmt:'p', icon:TrendingUp,    color:'#c6f432', hl:true },
          { title:'Custo por Lead',       val:_ticket,        prev:_ticket*0.91,        fmt:'c', icon:DollarSign,    color:'#ec4899', hl:true },
        ];
        return [
          { title:'Interações',           val:_interactions,  prev:_interactions*0.88,  fmt:'n', icon:MessageSquare, color:'#3b82f6' },
          { title:'Conversas Ativas',     val:_conversations, prev:_conversations*0.84, fmt:'n', icon:Activity,      color:'#8b5cf6' },
          { title:'Em Atendimento',       val:_activeLeads,   prev:_activeLeads*0.91,   fmt:'n', icon:Users,         color:'#10b981' },
          { title:'Eventos',              val:_events,        prev:_events*0.87,        fmt:'n', icon:Calendar,      color:'#f59e0b' },
          { title:'Taxa de Conversão',    val:_conversion,    prev:_conversion*0.9,     fmt:'p', icon:TrendingUp,    color:'#c6f432', hl:true },
          { title:'Ticket Médio',         val:_ticket,        prev:_ticket*0.91,        fmt:'c', icon:DollarSign,    color:'#ec4899', hl:true },
        ];
      })();

      const DAY_LABELS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
      const buildWeekC = (base, seed) => {
        const c = seededChart(base, seed+'c', 7);
        const p = seededChart(base*0.87, seed+'p', 7);
        return DAY_LABELS.map((day,i) => ({ day, current:c[i]||0, previous:p[i]||0 }));
      };
      const weekConvs   = buildWeekC(stats.cards.conversations/4||8,   'cc');
      const weekLeadsC  = buildWeekC(stats.cards.activeLeads/4||5,     'lc');
      const weekEvents  = buildWeekC(stats.cards.events/4||12,         'ec');
      const weekInter   = buildWeekC(stats.cards.interactions/4||40,   'ic');

      const buildDailyC = (base, seed, pts=28) => {
        const vals = seededChart(base, seed, pts);
        return vals.map((v,i) => {
          const d = new Date(); d.setDate(d.getDate()-(pts-1-i));
          return { day:`${d.getDate()}/${d.getMonth()+1}`, value:v };
        });
      };
      const dConvs  = buildDailyC(stats.cards.conversations/28||4, 'dcc');
      const dLeadsC = buildDailyC(stats.cards.activeLeads/28||2,   'dlc');
      const dEvents = buildDailyC(stats.cards.events/28||8,        'dec');
      const dInter  = buildDailyC(stats.cards.interactions/28||15, 'dic');

      return (
        <div className="space-y-5 animate-in fade-in duration-300">
          {/* Date picker */}
          <div className="flex items-center gap-3 mb-4 relative">
            <div className="relative">
              <button onClick={() => setShowDatePicker(v => !v)}
                className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 hover:border-gray-300 shadow-sm transition-all">
                <Calendar size={14} className="text-gray-400"/>
                {dateRange.label}
                <ChevronDown size={12} className="text-gray-400"/>
              </button>
              {showDatePicker && (
                <div className="absolute top-full left-0 mt-2 z-30 bg-white rounded-2xl shadow-2xl border border-gray-100 p-4 w-72">
                  <div className="flex gap-1.5 mb-3 flex-wrap">
                    {['7d','14d','30d','90d'].map(p=>(
                      <button key={p} onClick={()=>applyPresetC(p)}
                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${dateRange.preset===p?'text-black':'text-gray-500 bg-gray-100 hover:bg-gray-200'}`}
                        style={dateRange.preset===p?{backgroundColor:primaryColor}:{}}>
                        {({'7d':'7 dias','14d':'14 dias','30d':'30 dias','90d':'90 dias'})[p]}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center justify-between mb-2">
                    <button onClick={()=>setPickerMonthC(m=>{const n=new Date(m);n.setMonth(n.getMonth()-1);return n;})} className="p-1 rounded hover:bg-gray-100 text-gray-500">‹</button>
                    <span className="text-xs font-bold text-gray-700">{pickerMonthC.toLocaleString('pt-BR',{month:'long',year:'numeric'})}</span>
                    <button onClick={()=>setPickerMonthC(m=>{const n=new Date(m);n.setMonth(n.getMonth()+1);return n;})} className="p-1 rounded hover:bg-gray-100 text-gray-500">›</button>
                  </div>
                  <div className="grid grid-cols-7 gap-0.5 text-center">
                    {['D','S','T','Q','Q','S','S'].map((d,i)=><p key={i} className="text-[9px] font-bold text-gray-400 py-1">{d}</p>)}
                    {calDaysC.map((day,i)=>{const inR=isDayInC(day),isS=isDayStartC(day),isE=isDayEndC(day);return(
                      <button key={i} onClick={()=>handlePickDayC(day)} disabled={!day}
                        className={`text-[11px] py-1.5 rounded-lg transition-all font-medium ${!day?'opacity-0 pointer-events-none':''}${(isS||isE)?'text-black font-bold shadow-sm':inR?'text-gray-800':'text-gray-600 hover:bg-gray-100'}`}
                        style={(isS||isE)?{backgroundColor:primaryColor}:inR?{backgroundColor:primaryColor+'44'}:{}}>
                        {day?day.getDate():''}
                      </button>
                    );})}
                  </div>
                  {pickStartC&&pickEndC&&(
                    <button onClick={applyCustomRangeC} className="mt-3 w-full py-2 rounded-xl font-bold text-xs text-black" style={{backgroundColor:primaryColor}}>
                      Aplicar: {fmtDPC(pickStartC)} → {fmtDPC(pickEndC)}
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
          {/* Tab switcher */}
          <div className="inline-flex rounded-xl border border-gray-200 p-1 bg-white gap-1">
            {[{id:'resumo',label:'Resumo'},{id:'diario',label:'Visão Diária'}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${tab===t.id?'shadow-sm text-black':'text-gray-500 hover:text-gray-900 hover:bg-gray-50'}`}
                style={tab===t.id?{backgroundColor:primaryColor}:{}}>
                {t.label}
              </button>
            ))}
          </div>

          {tab==='resumo' && (
            <>
              <DraggableKPIGrid storageKey={`client-overview-${agent.slug}`} items={kpis} cols="grid-cols-2 lg:grid-cols-3" renderItem={(k)=>{
                const oKey = `${periodKey}__${k.title}`;
                const ov = kpiOverrides[oKey];
                const displayVal = ov !== undefined ? Number(ov) : k.val;
                const change = k.prev&&k.prev!==0 ? ((displayVal-k.prev)/Math.abs(k.prev))*100 : 0;
                const isUp   = change>0;
                const neutral = Math.abs(change)<0.05;
                const fmted  = k.fmt==='c' ? fmtC(displayVal) : k.fmt==='p' ? fmtP(displayVal) : fmtN(displayVal);
                return (
                  <div className="relative bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow group">
                    {ov!==undefined&&<div className="absolute top-2 left-2 w-2 h-2 rounded-full bg-amber-400" title="Valor manual"/>}
                    <button onClick={e=>{e.stopPropagation();setEditKPIItem(k);}}
                      className="absolute top-2 right-2 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all z-10"
                      title="Configurar valor manualmente">
                      <Edit3 size={11}/>
                    </button>
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{backgroundColor:k.color}}>
                        <k.icon size={14} className="text-white"/>
                      </div>
                      <p className="text-xs font-semibold text-gray-600 leading-tight">{k.title}</p>
                    </div>
                    <p className="text-2xl font-black text-gray-900 leading-none mb-1.5">{fmted}</p>
                    {neutral ? (
                      <p className="text-[11px] text-gray-400">Sem variação</p>
                    ) : (
                      <div className={`inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-md ${isUp?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-600'}`}>
                        {isUp?'▲':'▼'} {Math.abs(change).toFixed(1)}%
                      </div>
                    )}
                  </div>
                );
              }}/>
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-0.5">Comparativo — Semana Atual vs. Semana Anterior</h3>
                <p className="text-xs text-gray-400 mb-4">Segunda a domingo · linha sólida = semana atual · linha tracejada = semana anterior</p>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {(()=>{
                    if(agent.slug==='leadflow') return [
                      { label:'Leads Captados',    data:weekLeadsC, color:primaryColor,  fmtr:fmtN },
                      { label:'Follow-ups Feitos', data:weekInter,  color:'#3b82f6',     fmtr:fmtN },
                      { label:'Em Qualificação',   data:weekConvs,  color:'#8b5cf6',     fmtr:fmtN },
                      { label:'Eventos de CRM',    data:weekEvents, color:'#f59e0b',     fmtr:fmtN },
                    ];
                    if(agent.slug==='booker') return [
                      { label:'Reuniões Agendadas',data:weekEvents, color:'#3b82f6',     fmtr:fmtN },
                      { label:'Confirmações',      data:weekConvs,  color:'#10b981',     fmtr:fmtN },
                      { label:'Contatos Ativos',   data:weekLeadsC, color:primaryColor,  fmtr:fmtN },
                      { label:'Interações',        data:weekInter,  color:'#f59e0b',     fmtr:fmtN },
                    ];
                    if(agent.slug==='pixt-bdr') return [
                      { label:'Leads Extraídos',   data:weekLeadsC, color:'#3b82f6',     fmtr:fmtN },
                      { label:'Msgs Enviadas',     data:weekInter,  color:'#8b5cf6',     fmtr:fmtN },
                      { label:'Respostas',         data:weekConvs,  color:'#10b981',     fmtr:fmtN },
                      { label:'Prospecções Ativas',data:weekEvents, color:'#f59e0b',     fmtr:fmtN },
                    ];
                    return [
                      { label:'Conversas Ativas',  data:weekConvs,  color:'#8b5cf6',     fmtr:fmtN },
                      { label:'Leads Ativos',      data:weekLeadsC, color:primaryColor,  fmtr:fmtN },
                      { label:'Eventos',           data:weekEvents, color:'#f59e0b',     fmtr:fmtN },
                      { label:'Interações',        data:weekInter,  color:'#3b82f6',     fmtr:fmtN },
                    ];
                  })().map(({label,data,color,fmtr})=>(
                    <div key={label} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">{label}</p>
                      <WeekChart data={data} label={label} color={color} formatter={fmtr}/>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}
          {tab==='diario' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              {(()=>{
                if(agent.slug==='leadflow') return [
                  { label:'Leads Captados por Dia',    data:dLeadsC, color:primaryColor, Cmp:DailyLine },
                  { label:'Follow-ups Feitos por Dia', data:dInter,  color:'#3b82f6',    Cmp:DailyBar  },
                  { label:'Em Qualificação por Dia',   data:dConvs,  color:'#8b5cf6',    Cmp:DailyLine },
                  { label:'Eventos de CRM por Dia',    data:dEvents, color:'#f59e0b',    Cmp:DailyBar  },
                ];
                if(agent.slug==='booker') return [
                  { label:'Reuniões Agendadas por Dia',data:dEvents, color:'#3b82f6',    Cmp:DailyBar  },
                  { label:'Confirmações por Dia',      data:dConvs,  color:'#10b981',    Cmp:DailyLine },
                  { label:'Contatos Ativos por Dia',   data:dLeadsC, color:primaryColor, Cmp:DailyLine },
                  { label:'Interações por Dia',        data:dInter,  color:'#f59e0b',    Cmp:DailyBar  },
                ];
                if(agent.slug==='pixt-bdr') return [
                  { label:'Leads Extraídos por Dia',   data:dLeadsC, color:'#3b82f6',    Cmp:DailyLine },
                  { label:'Mensagens Enviadas por Dia',data:dInter,  color:'#8b5cf6',    Cmp:DailyBar  },
                  { label:'Respostas por Dia',         data:dConvs,  color:'#10b981',    Cmp:DailyLine },
                  { label:'Prospecções Ativas por Dia',data:dEvents, color:'#f59e0b',    Cmp:DailyBar  },
                ];
                return [
                  { label:'Conversas por Dia',         data:dConvs,  color:'#8b5cf6',    Cmp:DailyBar  },
                  { label:'Leads Ativos por Dia',      data:dLeadsC, color:primaryColor, Cmp:DailyLine },
                  { label:'Eventos por Dia',           data:dEvents, color:'#f59e0b',    Cmp:DailyBar  },
                  { label:'Interações por Dia',        data:dInter,  color:'#3b82f6',    Cmp:DailyLine },
                ];
              })().map(({label,data,color,Cmp})=>(
                <div key={label} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                  <p className="text-sm font-bold text-gray-900 mb-3">{label}</p>
                  <Cmp data={data} color={color} label={label} formatter={fmtN}/>
                </div>
              ))}
            </div>
          )}
          {editKPIItem && (
            <KPIManualModal
              kpi={editKPIItem}
              period={periodKey}
              overrides={kpiOverrides}
              onSave={val => saveKPIOverride(`${periodKey}__${editKPIItem.title}`, val)}
              onClear={() => clearKPIOverride(`${periodKey}__${editKPIItem.title}`)}
              onClose={() => setEditKPIItem(null)}
              primaryColor={primaryColor}
            />
          )}
        </div>
      );
    };

    /* =========================================================
       PIPELINE TAB (Kanban + Funil · múltiplas pipelines)
       ========================================================= */
    const PipelineTab = ({ agentSlug, primaryColor }) => {
      const pc = primaryColor || '#c6f432';
      const [leads, setLeads] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showNew, setShowNew] = useState(false);
      const [showStageConfig, setShowStageConfig] = useState(false);
      const [editLead, setEditLead] = useState(null);
      const [draggedId, setDraggedId] = useState(null);
      const [dragOverStage, setDragOverStage] = useState(null);
      const [selectedLead, setSelectedLead] = useState(null);
      const [openColorStage, setOpenColorStage] = useState(null);
      const [view, setView] = useState('kanban');
      const [showNewPipeline, setShowNewPipeline] = useState(false);
      const [newPipelineName, setNewPipelineName] = useState('');
      const colorPickerRefs = useRef({});

      const toast = useToast();
      const { pipelines, activePipelineId, setActivePipelineId, savePipelines, createPipeline, deletePipeline } = usePipelines(agentSlug);
      const activePipeline = pipelines.find(p => p.id === activePipelineId) || pipelines[0];
      const stages = activePipeline?.stages || DEFAULT_STAGES;
      const saveStages = useCallback(async (ns) => {
        await savePipelines(pipelines.map(p => p.id === (activePipeline?.id) ? { ...p, stages: ns } : p));
      }, [pipelines, activePipeline, savePipelines]);
      const updStage = (id, patch) => saveStages(stages.map(s => s.id === id ? {...s, ...patch} : s));

      const handleCreatePipeline = async () => {
        if (!newPipelineName.trim()) return;
        await createPipeline(newPipelineName, pipelines);
        setNewPipelineName(''); setShowNewPipeline(false);
        toast('Pipeline criada!', 'success');
      };
      const handleDeletePipeline = async (id) => {
        if (pipelines.length <= 1) { toast('Deve existir ao menos uma pipeline', 'error'); return; }
        if (!confirm('Excluir esta pipeline?')) return;
        await deletePipeline(id, pipelines, activePipelineId);
      };

      // ── Calendar date filter ──
      const [showPipeCal, setShowPipeCal] = useState(false);
      const [pipeCalMonth, setPipeCalMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [pipeFrom, setPipeFrom] = useState(null);
      const [pipeTo, setPipeTo] = useState(null);
      const pipeCalRef = useRef(null);

      useEffect(() => {
        const h = (e) => { if (pipeCalRef.current && !pipeCalRef.current.contains(e.target)) setShowPipeCal(false); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);

      const fmtPD = d => d ? d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'}) : '--';
      const pipeDays = (() => {
        const yr = pipeCalMonth.getFullYear(), mo = pipeCalMonth.getMonth();
        const first = new Date(yr, mo, 1), last = new Date(yr, mo+1, 0);
        const days = [];
        for (let i = 0; i < first.getDay(); i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) days.push(new Date(yr, mo, d));
        return days;
      })();
      const handlePipeDay = (day) => {
        if (!day) return;
        if (!pipeFrom || (pipeFrom && pipeTo)) { setPipeFrom(day); setPipeTo(null); }
        else { if (day < pipeFrom) { setPipeTo(pipeFrom); setPipeFrom(day); } else { setPipeTo(day); } setShowPipeCal(false); }
      };
      const isDayInRange = (day) => {
        if (!day || !pipeFrom) return false;
        if (!pipeTo) return day.toDateString() === pipeFrom.toDateString();
        return day >= pipeFrom && day <= pipeTo;
      };
      const clearPipeCal = () => { setPipeFrom(null); setPipeTo(null); };

      const filterLeadsByDate = (list) => {
        if (!pipeFrom) return list;
        return list.filter(l => {
          const d = l.created_at ? new Date(l.created_at) : null;
          if (!d) return true;
          const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          if (!pipeTo) return day.toDateString() === pipeFrom.toDateString();
          return day >= pipeFrom && day <= pipeTo;
        });
      };

      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api(`/leads?agent=${agentSlug}`); setLeads(d.leads); }
        catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agentSlug, toast]);

      useEffect(() => { load(); }, [load]);

      useEffect(() => {
        const handler = (e) => {
          const open = Object.entries(colorPickerRefs.current).find(([id]) => id === openColorStage);
          if (open && !open[1]?.contains(e.target)) setOpenColorStage(null);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [openColorStage]);

      const pipelineContainerRef = useRef(null);

      const onDragStart = (id) => setDraggedId(id);
      const onDragEnd = () => { setDraggedId(null); setDragOverStage(null); };
      const onDragOver = (e, stageId) => { e.preventDefault(); setDragOverStage(stageId); };

      const handleContainerDragOver = useCallback((e) => {
        if (!pipelineContainerRef.current) return;
        const rect = pipelineContainerRef.current.getBoundingClientRect();
        const ZONE = 110;
        const SPEED = 12;
        if (e.clientX < rect.left + ZONE) pipelineContainerRef.current.scrollLeft -= SPEED;
        else if (e.clientX > rect.right - ZONE) pipelineContainerRef.current.scrollLeft += SPEED;
      }, []);
      const onDrop = async (e, stageId) => {
        e.preventDefault();
        const id = draggedId;
        setDraggedId(null); setDragOverStage(null);
        if (!id) return;
        const lead = leads.find(l => l.id === id);
        if (!lead || lead.stage === stageId) return;
        setLeads(ls => ls.map(l => l.id === id ? { ...l, stage: stageId } : l));
        try {
          await api(`/leads/${id}`, { method: 'PATCH', body: JSON.stringify({ stage: stageId }) });
          toast(`Lead movido para "${stages.find(s => s.id === stageId)?.title || stageId}"`, 'success');
        } catch (e2) {
          toast(e2.message, 'error');
          load();
        }
      };

      const moveLeadDirect = async (id, stageId) => {
        const lead = leads.find(l => l.id === id);
        if (!lead || lead.stage === stageId) return;
        setLeads(ls => ls.map(l => l.id === id ? { ...l, stage: stageId } : l));
        try {
          await api(`/leads/${id}`, { method: 'PATCH', body: JSON.stringify({ stage: stageId }) });
          toast(`Lead movido para "${stages.find(s => s.id === stageId)?.title || stageId}"`, 'success');
        } catch (e2) { toast(e2.message, 'error'); load(); }
      };

      const removeLead = async (id) => {
        if (!confirm('Excluir este lead?')) return;
        try {
          await api(`/leads/${id}`, { method: 'DELETE' });
          setLeads(ls => ls.filter(l => l.id !== id));
          toast('Lead removido', 'success');
        } catch (e) { toast(e.message, 'error'); }
      };

      const createLead = async (data) => {
        try {
          const r = await api('/leads', { method: 'POST', body: JSON.stringify({ ...data, agent_slug: agentSlug }) });
          setLeads(ls => [...ls, r.lead]);
          toast('Lead criado', 'success');
          setShowNew(false);
        } catch (e) { toast(e.message, 'error'); }
      };

      const updateLead = async (id, data) => {
        try {
          const r = await api(`/leads/${id}`, { method: 'PATCH', body: JSON.stringify(data) });
          setLeads(ls => ls.map(l => l.id === id ? r.lead : l));
          toast('Lead atualizado', 'success');
          setEditLead(null);
        } catch (e) { toast(e.message, 'error'); }
      };

      if (loading) return <Loading />;

      const displayLeads = filterLeadsByDate(leads);
      const totalLeads = displayLeads.length || 1;
      const byStage = {};
      stages.forEach(s => { byStage[s.id] = []; });
      displayLeads.forEach(l => {
        const key = stages.find(s => s.id === l.stage) ? l.stage : stages[0]?.id;
        if (key) byStage[key] = [...(byStage[key] || []), l];
      });

      return (
        <div className="animate-in fade-in duration-500 flex flex-col gap-3" style={{minHeight:'calc(100vh - 220px)'}}>

          {/* Pipeline selector */}
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm px-4 py-3 shrink-0">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[10px] font-black text-gray-400 uppercase tracking-wider mr-1">Pipeline:</span>
              {pipelines.map(p => (
                <div key={p.id} className="flex items-center gap-1">
                  <button onClick={() => setActivePipelineId(p.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${activePipelineId===p.id?'text-black border-transparent shadow-sm':'border-gray-200 text-gray-600 bg-white hover:bg-gray-50'}`}
                    style={activePipelineId===p.id?{backgroundColor:pc}:{}}>
                    {p.name}
                  </button>
                  {pipelines.length > 1 && activePipelineId !== p.id && (
                    <button onClick={() => handleDeletePipeline(p.id)} className="text-gray-300 hover:text-red-400 transition-colors p-0.5 rounded"><X size={11}/></button>
                  )}
                </div>
              ))}
              {showNewPipeline ? (
                <div className="flex items-center gap-1.5">
                  <input autoFocus value={newPipelineName} onChange={e=>setNewPipelineName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')handleCreatePipeline();if(e.key==='Escape')setShowNewPipeline(false);}}
                    className="border border-gray-200 rounded-xl px-3 py-1.5 text-xs font-bold outline-none focus:border-blue-400 w-36" placeholder="Nome da pipeline"/>
                  <button onClick={handleCreatePipeline} className="px-2.5 py-1.5 rounded-xl text-xs font-bold text-black" style={{backgroundColor:pc}}>Criar</button>
                  <button onClick={()=>setShowNewPipeline(false)} className="text-gray-400 hover:text-gray-600 p-1 rounded"><X size={13}/></button>
                </div>
              ) : (
                <button onClick={()=>setShowNewPipeline(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-dashed border-gray-300 text-xs font-bold text-gray-500 hover:border-gray-400 hover:text-gray-700 transition-all">
                  <Plus size={12}/> Nova Pipeline
                </button>
              )}
            </div>
          </div>

          {/* Toolbar */}
          <div className="flex justify-between items-center shrink-0 flex-wrap gap-2">
            <div className="flex items-center gap-2">
              <div className="flex gap-1 bg-white border border-gray-200 rounded-xl p-1">
                {[{id:'kanban',label:'Kanban',Icon:KanbanSquare},{id:'funnel',label:'Funil',Icon:TrendingUp}].map(v=>(
                  <button key={v.id} onClick={()=>setView(v.id)}
                    className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${view===v.id?'bg-gray-900 text-white shadow':'text-gray-500 hover:bg-gray-50'}`}>
                    <v.Icon size={13}/> {v.label}
                  </button>
                ))}
              </div>
              <p className="text-sm text-gray-500 font-medium">{displayLeads.length} leads</p>
            </div>
            <div className="flex items-center gap-2 shrink-0">
              {/* Calendar date filter */}
              <div className="relative" ref={pipeCalRef}>
                <button onClick={() => setShowPipeCal(v => !v)}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-xl border text-sm font-bold transition-all ${pipeFrom ? 'border-gray-700 bg-gray-900 text-white' : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'}`}>
                  <Calendar size={14}/>
                  {pipeFrom ? `${fmtPD(pipeFrom)} → ${fmtPD(pipeTo || pipeFrom)}` : 'Período'}
                  {pipeFrom && <span onClick={e=>{e.stopPropagation();clearPipeCal();}} className="ml-1 opacity-70 hover:opacity-100"><X size={12}/></span>}
                </button>
                {showPipeCal && (
                  <div className="absolute top-full right-0 mt-1 z-30 bg-white rounded-2xl shadow-2xl border border-gray-100 p-4 w-72" onClick={e=>e.stopPropagation()}>
                    <div className="flex items-center justify-between mb-3">
                      <button onClick={() => setPipeCalMonth(m => { const d=new Date(m); d.setMonth(d.getMonth()-1); d.setDate(1); return d; })}
                        className="p-1 rounded-lg hover:bg-gray-100 text-gray-500"><ChevronLeft size={16}/></button>
                      <span className="text-sm font-bold text-gray-800 capitalize">
                        {pipeCalMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
                      </span>
                      <button onClick={() => setPipeCalMonth(m => { const d=new Date(m); d.setMonth(d.getMonth()+1); d.setDate(1); return d; })}
                        className="p-1 rounded-lg hover:bg-gray-100 text-gray-500"><ChevronRight size={16}/></button>
                    </div>
                    <div className="grid grid-cols-7 gap-0.5 mb-1">
                      {['D','S','T','Q','Q','S','S'].map((d,i)=>(<div key={i} className="text-center text-[10px] font-black text-gray-400 uppercase py-1">{d}</div>))}
                    </div>
                    <div className="grid grid-cols-7 gap-0.5">
                      {pipeDays.map((day,i) => (
                        <button key={i} onClick={() => handlePipeDay(day)} disabled={!day}
                          className={`w-full aspect-square rounded-lg text-xs font-bold transition-all flex items-center justify-center
                            ${!day ? 'opacity-0 pointer-events-none' : ''}
                            ${day && isDayInRange(day) ? 'bg-gray-900 text-white' : ''}
                            ${day && !isDayInRange(day) ? 'hover:bg-gray-100 text-gray-700' : ''}`}>
                          {day ? day.getDate() : ''}
                        </button>
                      ))}
                    </div>
                    {pipeFrom && (
                      <button onClick={clearPipeCal} className="mt-3 w-full text-xs font-bold text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1.5 py-1.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition">
                        <X size={11}/> Limpar período
                      </button>
                    )}
                  </div>
                )}
              </div>
              <button onClick={() => setShowStageConfig(true)} className="px-3 py-2 rounded-xl border border-gray-200 bg-white font-bold text-sm flex items-center gap-2 hover:bg-gray-50 transition">
                <Settings size={14}/> Etapas
              </button>
              <button onClick={() => setShowNew(true)} className="px-4 py-2 rounded-xl font-bold text-sm text-black flex items-center gap-2 hover:opacity-90 transition" style={{backgroundColor:pc}}>
                <Plus size={16}/> Novo Lead
              </button>
            </div>
          </div>

          {/* Kanban view */}
          {view === 'kanban' && <div ref={pipelineContainerRef} onDragOver={handleContainerDragOver} className="flex gap-4 overflow-x-auto pb-4 flex-1">
            {stages.map((stage) => {
              const items = byStage[stage.id] || [];
              const cc = STAGE_COLORS[stage.color] || STAGE_COLORS.gray;
              return (
                <div key={stage.id}
                  onDragOver={(e) => onDragOver(e, stage.id)}
                  onDragLeave={() => setDragOverStage(null)}
                  onDrop={(e) => onDrop(e, stage.id)}
                  className={`flex-none w-72 rounded-2xl border flex flex-col overflow-hidden shrink-0 transition-all ${cc} ${dragOverStage === stage.id ? 'drop-target' : ''}`}
                  style={{minHeight:'520px', maxHeight:'calc(100vh - 200px)'}}>
                  <div className="shrink-0 relative" ref={el => colorPickerRefs.current[stage.id] = el}>
                    <div className="p-4 flex items-center justify-between" style={{backgroundColor: STAGE_HEADER_BG[stage.color] || '#6b7280'}}>
                      <div>
                        <h3 className="font-bold text-white text-sm">{stage.title}</h3>
                        {stage.sub && <p className="text-[10px] text-white/70 font-medium">{stage.sub}</p>}
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="text-xs font-bold px-2 py-0.5 rounded bg-white/20 text-white">{items.length}</span>
                        <button onClick={e=>{e.stopPropagation();setOpenColorStage(openColorStage===stage.id?null:stage.id);}}
                          className="p-1 rounded hover:bg-white/20 transition-colors text-white/80 hover:text-white">
                          <ChevronDown size={12}/>
                        </button>
                      </div>
                    </div>
                    {openColorStage===stage.id&&(
                      <div className="absolute top-full left-0 z-20 bg-white rounded-xl shadow-xl border border-gray-100 p-3 mt-1">
                        <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2">Cor da etapa</p>
                        <div className="flex flex-wrap gap-1.5">
                          {Object.entries(STAGE_HEADER_BG).map(([c,hex])=>(
                            <button key={c} onClick={()=>{updStage(stage.id,{color:c});setOpenColorStage(null);}}
                              className={`w-5 h-5 rounded-full border-2 transition-all ${stage.color===c?'border-gray-700 scale-110':'border-transparent hover:scale-105'}`}
                              style={{backgroundColor:hex}} title={c}/>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                  <div className="p-3 space-y-2.5 overflow-y-auto flex-1">
                    {items.map(l => (
                      <FlatPipelineCard
                        key={l.id}
                        lead={l}
                        stages={stages}
                        isDragging={draggedId === l.id}
                        onDragStart={() => onDragStart(l.id)}
                        onDragEnd={onDragEnd}
                        onRemove={() => removeLead(l.id)}
                        onEdit={() => setEditLead(l)}
                        onClickCard={() => setSelectedLead(l)}
                        onMoveToStage={(sid) => moveLeadDirect(l.id, sid)}
                      />
                    ))}
                    {items.length === 0 && (
                      <p className="text-xs text-gray-300 italic text-center py-8 font-medium">Sem leads nesta etapa</p>
                    )}
                  </div>
                </div>
              );
            })}
          </div>}

          {/* Funnel view */}
          {view === 'funnel' && (
            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 flex-1 overflow-y-auto">
              <h3 className="font-black text-gray-900 mb-1">{activePipeline?.name} — Funil de Conv.</h3>
              <p className="text-xs text-gray-400 mb-5">{displayLeads.length} leads no total</p>
              <div className="space-y-3">
                {stages.map((stage, i) => {

    /* =========================================================

       ========================================================= */
    const InboxTab = ({ agent, primaryColor }) => {
      const pc = primaryColor || '#c6f432';
      const [conversations, setConversations] = useState([]);
      const [activeId, setActiveId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [loadingConvs, setLoadingConvs] = useState(true);
      const [loadingMsgs, setLoadingMsgs] = useState(false);
      const [text, setText] = useState('');
      const [search, setSearch] = useState('');
      const [showNew, setShowNew] = useState(false);
      const toast = useToast();
      const messagesContainerRef = useRef(null);

      // ── Date filter ──
      const [showConvCal, setShowConvCal] = useState(false);
      const [convCalMonth, setConvCalMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [convFrom, setConvFrom] = useState(null);
      const [convTo, setConvTo] = useState(null);
      const convCalRef = useRef(null);

      useEffect(() => {
        const h = (e) => { if (convCalRef.current && !convCalRef.current.contains(e.target)) setShowConvCal(false); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);

      const fmtCD = d => d ? d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit'}) : '--';
      const convDays = (() => {
        const yr = convCalMonth.getFullYear(), mo = convCalMonth.getMonth();
        const first = new Date(yr, mo, 1), last = new Date(yr, mo+1, 0);
        const days = [];
        for (let i = 0; i < first.getDay(); i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) days.push(new Date(yr, mo, d));
        return days;
      })();
      const handleConvDay = (day) => {
        if (!day) return;
        if (!convFrom || (convFrom && convTo)) { setConvFrom(day); setConvTo(null); }
        else { if (day < convFrom) { setConvTo(convFrom); setConvFrom(day); } else { setConvTo(day); } setShowConvCal(false); }
      };
      const isConvDayInRange = (day) => {
        if (!day || !convFrom) return false;
        if (!convTo) return day.toDateString() === convFrom.toDateString();
        return day >= convFrom && day <= convTo;
      };
      const clearConvCal = () => { setConvFrom(null); setConvTo(null); };

      const loadConvs = useCallback(async () => {
        setLoadingConvs(true);
        try {
          const d = await api(`/conversations?agent=${agent.slug}`);
          setConversations(d.conversations);
          if (d.conversations.length && !activeId) setActiveId(d.conversations[0].id);
        } catch (e) { toast(e.message, 'error'); }
        finally { setLoadingConvs(false); }
      }, [agent.slug, activeId, toast]);

      useEffect(() => { setActiveId(null); setMessages([]); }, [agent.slug]);
      useEffect(() => { loadConvs(); }, [agent.slug]);

      useEffect(() => {
        if (!activeId) return;
        setLoadingMsgs(true);
        api(`/conversations/${activeId}/messages`)
          .then(d => setMessages(d.messages))
          .catch(e => toast(e.message, 'error'))
          .finally(() => setLoadingMsgs(false));
      }, [activeId]);

      // Polling: novas mensagens a cada 5s na conversa ativa
      useEffect(() => {
        if (!activeId) return;
        const iv = setInterval(async () => {
          try {
            const d = await api(`/conversations/${activeId}/messages`);
            setMessages(prev => d.messages.length !== prev.length ? d.messages : prev);
          } catch {}
        }, 5000);
        return () => clearInterval(iv);
      }, [activeId]);

      // Polling: novas conversas a cada 10s
      useEffect(() => {
        const iv = setInterval(loadConvs, 10000);
        return () => clearInterval(iv);
      }, [loadConvs]);

      useEffect(() => {
        const el = messagesContainerRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [messages]);

      const send = async (e) => {
        e.preventDefault();
        if (!text.trim() || !activeId) return;
        const body = text.trim();
        setText('');
        try {
          const r = await api(`/conversations/${activeId}/send`, { method: 'POST', body: JSON.stringify({ body }) });
          setMessages(m => [...m, r.message]);
          if (r.sent_to_whatsapp) toast('Mensagem enviada ao WhatsApp ✓', 'success');
          loadConvs();
        } catch (e2) { toast(e2.message, 'error'); setText(body); }
      };

      const removeConv = async (id) => {
        if (!confirm('Excluir esta conversa?')) return;
        try {
          await api(`/conversations/${id}`, { method: 'DELETE' });
          setConversations(cs => cs.filter(c => c.id !== id));
          if (activeId === id) { setActiveId(null); setMessages([]); }
          toast('Conversa removida', 'success');
        } catch (e) { toast(e.message, 'error'); }
      };

      const createConv = async (contact_name) => {
        try {
          const r = await api('/conversations', { method: 'POST', body: JSON.stringify({ agent_slug: agent.slug, contact_name, intent: 'interesse', last_message: 'Conversa iniciada' }) });
          setConversations(cs => [r.conversation, ...cs]);
          setActiveId(r.conversation.id);
          setShowNew(false);
        } catch (e) { toast(e.message, 'error'); }
      };

      const filtered = conversations.filter(c => {
        const matchSearch = c.contact_name.toLowerCase().includes(search.toLowerCase()) || (c.last_message||'').toLowerCase().includes(search.toLowerCase());
        if (!matchSearch) return false;
        if (!convFrom) return true;
        const d = c.updated_at ? new Date(c.updated_at) : null;
        if (!d) return true;
        const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        if (!convTo) return day.toDateString() === convFrom.toDateString();
        return day >= convFrom && day <= convTo;
      });
      const active = conversations.find(c => c.id === activeId);

      return (
        <div className="animate-in fade-in duration-500 flex h-[620px] bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 overflow-hidden shadow-sm shrink-0">

              <button onClick={() => setShowNew(true)} className="w-full flex items-center justify-center gap-2 py-2 rounded-lg bg-black text-[#c6f432] text-xs font-bold"><Plus size={14}/> Nova conversa</button>
            </div>
            {convFrom && !loadingConvs && (
              <div className="px-4 py-2 bg-gray-900 flex items-center justify-between shrink-0">
                <span className="text-[10px] font-bold text-white/70">{filtered.length} conversa{filtered.length!==1?'s':''} · {fmtCD(convFrom)}{convTo?' → '+fmtCD(convTo):''}</span>

              </div>

            <div className="overflow-y-auto flex-1">
              {loadingConvs ? <Loading small /> : filtered.length === 0 ? <Empty msg="Nenhuma conversa" /> : filtered.map(c => (
                <div key={c.id} className={`group p-4 border-b border-gray-100 cursor-pointer transition-colors shrink-0 ${activeId === c.id ? 'bg-white border-l-4 border-l-[#c6f432]' : 'hover:bg-gray-100/50'}`} onClick={() => setActiveId(c.id)}>
                  <div className="flex justify-between items-center mb-1 shrink-0">
                    <p className="font-bold text-sm text-gray-900 shrink-0">{c.contact_name}</p>

                      <span className="text-[10px] text-gray-400">{relTime(c.updated_at)}</span>
                      <button onClick={(e) => { e.stopPropagation(); removeConv(c.id); }} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition"><Trash2 size={12} /></button>

          </div>
          <div className="flex-1 flex flex-col h-full overflow-hidden shrink-0">
            <div className="h-16 border-b border-gray-200 bg-white flex items-center justify-between px-6 shrink-0">
              <div><h3 className="font-bold text-gray-900">{active ? active.contact_name : `${agent.name} Mirror`}</h3><p className="text-xs text-green-600 font-medium shrink-0">Espelhando canal de WhatsApp</p></div>
              {active && <div className="flex items-center gap-2 bg-green-100 text-green-700 px-3 py-1.5 rounded-lg border border-green-200 shrink-0"><Target size={14} /><span className="text-xs font-bold uppercase">{active.intent || '—'}</span></div>}
            </div>
            <div ref={messagesContainerRef} className="flex-1 p-6 overflow-y-auto bg-gray-50/50 space-y-4 font-medium text-sm">
              {!active ? <Empty msg="Selecione uma conversa" /> :
                loadingMsgs ? <Loading small /> :
                messages.map(m => (
                  <div key={m.id} className={`flex gap-4 ${m.role !== 'user' ? 'flex-row-reverse' : ''}`}>
                    <div className={`w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-bold ${m.role === 'ai' ? 'bg-[#c6f432] text-black' : m.role === 'human' ? 'bg-blue-500 text-white' : 'bg-gray-300 text-gray-700'}`}>
                      {m.role === 'ai' ? 'IA' : m.role === 'human' ? 'EU' : (active.contact_name||'?').charAt(0)}
                    </div>
                    <div className="flex flex-col max-w-[70%]">
                      <div className={`p-3 rounded-2xl shadow-sm ${m.role === 'ai' ? 'bg-gray-900 text-white' : m.role === 'human' ? 'bg-blue-500 text-white' : 'bg-white border'}`}>{m.body}</div>
                      {(m.role === 'ai' || m.role === 'human') && (
                        <div className={`flex items-center gap-1 mt-0.5 text-[10px] font-medium ${m.role !== 'user' ? 'justify-end' : 'justify-start'}`}>

                            const idx = messages.indexOf(m);

                            const isRecent = idx >= total - 2;

                            if (m.role === 'human') return <span className="text-gray-400">✓✓ Entregue</span>;

                  <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-400 bg-white px-1.5 py-0.5 rounded border border-gray-200">IA continua ativa</span>

                <button type="submit" className="px-4 py-2.5 rounded-xl bg-[#c6f432] text-black font-bold text-sm flex items-center gap-2 shrink-0"><Send size={14}/> Enviar</button>

    const NewConvForm = ({ onClose, onCreate }) => {
      const [name, setName] = useState('');
      return (
        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 border border-gray-200">
          <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">Nova conversa</h3><button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg"><X size={18} /></button></div>
          <form onSubmit={(e) => { e.preventDefault(); if (name.trim()) onCreate(name.trim()); }} className="space-y-3">
            <Field label="Nome do contato" value={name} onChange={setName} required />
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border font-bold text-sm">Cancelar</button>
              <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#c6f432] text-black font-bold text-sm">Criar</button>
            </div>
          </form>
        </div>
      );
    };

    function aiReply(userText, agentName) {
      const t = userText.toLowerCase();
      if (t.includes('preço') || t.includes('valor') || t.includes('caro')) return `Entendi sua preocupação com valores. O ${agentName} costuma ter ROI no primeiro mês. Posso te enviar um case real?`;
      if (t.includes('link') || t.includes('pagar') || t.includes('comprar')) return `Perfeito! Vou gerar o link de pagamento e te envio aqui mesmo em instantes.`;
      if (t.includes('reun') || t.includes('agend') || t.includes('marcar')) return `Tenho disponibilidade hoje às 16h ou amanhã às 10h. Qual prefere?`;
      return `Anotado! O ${agentName} já está processando sua solicitação. Posso te mostrar mais detalhes?`;
    }

    function intentBadge(intent) {
      if (intent === 'compra') return <span className="text-[9px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded flex items-center gap-1"><Target size={10}/> Compra</span>;
      if (intent === 'objecao') return <span className="text-[9px] bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded flex items-center gap-1"><AlertTriangle size={10}/> Objeção</span>;
      if (intent === 'interesse') return <span className="text-[9px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded flex items-center gap-1"><Star size={10}/> Interesse</span>;
      return <span className="text-[9px] bg-gray-100 text-gray-700 font-bold px-2 py-0.5 rounded">—</span>;
    }

    /* =========================================================
       INVOICES TAB
       ========================================================= */
    const InvoicesTab = ({ agent, primaryColor }) => {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showNew, setShowNew] = useState(false);
      const toast = useToast();

      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api(`/invoices?agent=${agent.slug}`); setItems(d.invoices); }
        catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agent.slug, toast]);
      useEffect(() => { load(); }, [load]);

      const togglePaid = async (inv) => {
        const status = inv.status === 'Pago' ? 'Pendente' : 'Pago';
        try {
          const r = await api(`/invoices/${inv.id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
          setItems(it => it.map(i => i.id === inv.id ? r.invoice : i));
        } catch (e) { toast(e.message, 'error'); }
      };

      const remove = async (id) => {
        if (!confirm('Excluir fatura?')) return;
        try { await api(`/invoices/${id}`, { method: 'DELETE' }); setItems(it => it.filter(i => i.id !== id)); }
        catch (e) { toast(e.message, 'error'); }
      };

      const create = async (data) => {
        try {
          const r = await api('/invoices', { method: 'POST', body: JSON.stringify({ ...data, agent_slug: agent.slug }) });
          setItems(it => [r.invoice, ...it]); setShowNew(false);
        } catch (e) { toast(e.message, 'error'); }
      };

      if (loading) return <Loading />;

      return (
        <div className="animate-in fade-in duration-500 bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 shadow-sm overflow-hidden shrink-0">
          <div className="p-6 border-b border-gray-200 flex justify-between items-center shrink-0">
            <h2 className="font-bold text-lg">Histórico de Pagamentos</h2>
            <button onClick={() => setShowNew(true)} className="px-4 py-2 rounded-xl bg-black text-[#c6f432] font-bold text-sm flex items-center gap-2"><Plus size={14}/> Nova fatura</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-left text-sm">
              <thead className="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[11px]"><tr><th className="px-6 py-4">Lead</th><th className="px-6 py-4">Data</th><th className="px-6 py-4">Valor</th><th className="px-6 py-4">Gateway</th><th className="px-6 py-4">Status</th><th className="px-6 py-4">Ações</th></tr></thead>
              <tbody className="divide-y divide-gray-100 font-medium text-gray-700">
                {items.length === 0 ? <tr><td colSpan="6" className="text-center text-gray-400 italic py-8">Sem faturas</td></tr> :
                items.map(inv => (
                  <tr key={inv.id} className="hover:bg-gray-50/50 transition-colors">
                    <td className="px-6 py-4 text-sm font-bold text-gray-900">{inv.lead_name}</td>
                    <td className="px-6 py-4 text-xs text-gray-500">{relTime(inv.created_at)}</td>
                    <td className="px-6 py-4 text-sm font-bold text-gray-900">R$ {(inv.amount||0).toLocaleString('pt-BR')}</td>
                    <td className="px-6 py-4 text-xs text-gray-500 font-medium">{inv.gateway || '—'}</td>
                    <td className="px-6 py-4">
                      <button onClick={() => togglePaid(inv)} className={`inline-flex px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider transition ${inv.status === 'Pago' ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'}`}>{inv.status}</button>
                    </td>
                    <td className="px-6 py-4">
                      <button onClick={() => remove(inv.id)} className="text-red-400 hover:text-red-600"><Trash2 size={14} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {showNew && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
              <NewInvoiceForm onClose={() => setShowNew(false)} onCreate={create} />
            </div>
          )}
        </div>
      );
    };

    const NewInvoiceForm = ({ onClose, onCreate }) => {
      const [form, setForm] = useState({ lead_name:'', amount:0, gateway:'Asaas', status:'Pendente' });
      return (
        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border border-gray-200">
          <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">Nova fatura</h3><button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg"><X size={18} /></button></div>
          <form onSubmit={(e) => { e.preventDefault(); onCreate(form); }} className="space-y-3">
            <Field label="Lead" value={form.lead_name} onChange={v => setForm(f => ({...f, lead_name:v}))} required />
            <Field label="Valor (R$)" type="number" value={form.amount} onChange={v => setForm(f => ({...f, amount: parseFloat(v||0)}))} required />
            <div>
              <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Gateway</label>
              <select value={form.gateway} onChange={e => setForm(f => ({...f, gateway:e.target.value}))} className="w-full px-3 py-2.5 border rounded-lg outline-none">
                <option>Asaas</option><option>Stripe</option><option>Mercado Pago</option><option>Pagar.me</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Status</label>
              <select value={form.status} onChange={e => setForm(f => ({...f, status:e.target.value}))} className="w-full px-3 py-2.5 border rounded-lg outline-none">
                <option>Pendente</option><option>Pago</option><option>Cancelado</option>
              </select>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border font-bold text-sm">Cancelar</button>
              <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#c6f432] text-black font-bold text-sm">Criar</button>
            </div>
          </form>
        </div>
      );

    /* =========================================================
       CALENDAR TAB
       ========================================================= */
    const CalendarTab = ({ agent, primaryColor }) => {
      const [events, setEvents] = useState([]);

      const days = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];

      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api(`/events?agent=${agent.slug}`); setEvents(d.events); }
        catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agent.slug, toast]);
      useEffect(() => { load(); }, [load]);

      const remove = async (id) => {
        try { await api(`/events/${id}`, { method: 'DELETE' }); setEvents(es => es.filter(e => e.id !== id)); }
        catch (e) { toast(e.message, 'error'); }
      };
      const create = async (data) => {
        try { const r = await api('/events', { method: 'POST', body: JSON.stringify({ ...data, agent_slug: agent.slug }) }); setEvents(es => [...es, r.event]); setShowNew(false); }
        catch (e) { toast(e.message, 'error'); }

      if (loading) return <Loading />;

      return (
        <div className="animate-in fade-in duration-500 flex flex-col h-full shrink-0">

             <div className="flex items-center gap-4">
               <div className="p-2.5 bg-[#4285F4]/10 text-[#4285F4] rounded-xl"><Calendar size={24} /></div>
               <div><h3 className="font-bold text-gray-900 text-lg leading-tight">Agenda Conectada: Google Calendar</h3><p className="text-sm text-gray-500 font-medium">Sincronização bidirecional ativa.</p></div>
             </div>

               <span className="text-xs font-bold text-green-700 bg-green-100 px-3 py-1.5 rounded-lg flex items-center gap-1 border border-green-200"><CheckCircle2 size={14}/> Sincronizado</span>

             </div>
          </div>
          <div className="bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 shadow-sm p-6 flex-1 flex flex-col shrink-0 min-h-[500px]">
             <div className="flex justify-between items-center mb-6 border-b pb-4 shrink-0">
               <h2 className="font-bold text-xl flex items-center gap-2">Visão Semanal (Espelho)</h2>
               <div className="flex gap-3">
                 <span className="flex items-center gap-1 px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full"><Bot size={12} /> Booked (IA)</span>
                 <span className="flex items-center gap-1 px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full"><Users size={12} /> Eventos Pessoais</span>
               </div>
             </div>
             <div className="grid grid-cols-5 gap-4 flex-1 overflow-y-auto pr-2">
                {days.map(day => {
                  const dayEvents = events.filter(e => e.day === day).sort((a,b) => (a.time||'').localeCompare(b.time||''));

                    <div key={day} className="flex flex-col gap-3 min-w-[140px]">

                      {dayEvents.map(ev => (

                          <div className="flex justify-between items-start gap-2">
                            <p className={`text-xs font-bold ${ev.source === 'ai' ? 'text-green-800' : 'text-blue-800'}`}>{ev.time} - {ev.title}</p>
                            <button onClick={() => remove(ev.id)} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition"><X size={12} /></button>
                          </div>
                          <p className={`text-[10px] mt-1 ${ev.source === 'ai' ? 'text-green-600' : 'text-blue-600'}`}>{ev.source === 'ai' ? 'Agendado pela IA' : 'Lido da Agenda'}</p>

              <NewEventForm onClose={() => setShowNew(false)} onCreate={create} days={days} />

        </div>
      );

    const NewEventForm = ({ onClose, onCreate, days }) => {
      const [form, setForm] = useState({ title:'', day: days[0], time:'10:00', source:'ai' });
      return (
        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border border-gray-200">
          <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">Novo evento</h3><button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg"><X size={18} /></button></div>
          <form onSubmit={(e) => { e.preventDefault(); onCreate(form); }} className="space-y-3">

              <div>
                <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Dia</label>
