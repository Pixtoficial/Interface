          </div>
          {/* Tab switcher */}
          <div className="inline-flex rounded-xl border border-gray-200 p-1 bg-white gap-1">
            {[{id:'resumo',label:'Resumo'},{id:'diario',label:'Visão Diária'}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${tab===t.id?'shadow-sm text-black':'text-gray-500 hover:text-gray-900 hover:bg-gray-50'}`}
                style={tab===t.id?{backgroundColor:primaryColor}:{}}>
                {t.label}
              </button>
            ))}
          </div>

          {/* ── RESUMO ── */}
          {tab==='resumo' && (
            <>
              {/* 8 KPI cards */}
              <DraggableKPIGrid storageKey="admin-overview" items={kpis} cols="grid-cols-2 lg:grid-cols-4" renderItem={(k)=>{
                const oKey = `${periodKey}__${k.title}`;
                const ov = kpiOverrides[oKey];
                const displayVal = ov !== undefined ? Number(ov) : k.val;
                const change = k.prev&&k.prev!==0 ? ((displayVal-k.prev)/Math.abs(k.prev))*100 : 0;
                const isUp = k.inv ? change<0 : change>0;
                const neutral = Math.abs(change)<0.05;
                const fmted = k.fmt==='c' ? fmtC(displayVal) : k.fmt==='p' ? fmtP(displayVal) : fmtN(displayVal);
                return (
                  <div className={`relative bg-white rounded-2xl border shadow-sm p-5 hover:shadow-md transition-all group ${k.hl?'border-[#c6f432]/50 ring-1 ring-[#c6f432]/20':'border-gray-100'}`}>
                    {ov!==undefined&&<div className="absolute top-2 left-2 w-2 h-2 rounded-full bg-amber-400" title="Valor manual"/>}
                    <button onClick={e=>{e.stopPropagation();setEditKPIItem(k);}}
                      className="absolute top-2 right-2 p-1.5 rounded-lg opacity-0 group-hover:opacity-100 hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all z-10"
                      title="Configurar valor manualmente">
                      <Edit3 size={11}/>
                    </button>
                    <div className="flex items-start justify-between mb-3">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest pr-8 leading-tight">{k.title}</p>
                      <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{backgroundColor:k.color+'1a'}}>
                        <k.icon size={14} style={{color:k.color}}/>
                      </div>
                    </div>
                    <p className="text-[1.6rem] font-black text-gray-900 tracking-tight leading-none mb-2">{fmted}</p>
                    {neutral ? (
                      <p className="text-[11px] text-gray-400">Sem variação</p>
                    ) : (
                      <div className="flex items-center gap-1.5">
                        <span className={`flex items-center gap-0.5 text-[11px] font-bold px-1.5 py-0.5 rounded-md ${isUp?'bg-emerald-500/10 text-emerald-600':'bg-red-500/10 text-red-500'}`}>
                          {isUp ? <TrendingUp size={10}/> : <TrendingDown size={10}/>}
                          {Math.abs(change).toFixed(1)}%
                        </span>
                        <span className="text-[11px] text-gray-400">vs. período anterior</span>
                      </div>
                    )}
                  </div>
                );
              }}/>

              {/* Week comparison charts */}
              <div>
                <h3 className="text-sm font-bold text-gray-700 mb-0.5">Comparativo — Semana Atual vs. Semana Anterior</h3>
                <p className="text-xs text-gray-400 mb-4">Segunda a domingo · linha sólida = semana atual · linha tracejada = semana anterior</p>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {[
                    { label:'Leads',             data:weekLeads,   color:'#8b5cf6', fmtr:fmtN },
                    { label:'Faturamento',        data:weekRevenue, color:primaryColor, fmtr:fmtC },
                    { label:'Conversas IA',       data:weekConvs,   color:'#3b82f6', fmtr:fmtN },
                    { label:'Taxa de Conversão',  data:weekConv,    color:'#10b981', fmtr:fmtP },
                  ].map(({label,data,color,fmtr})=>(
                    <div key={label} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">{label}</p>
                      <WeekChart data={data} label={label} color={color} formatter={fmtr}/>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}

          {/* ── VISÃO DIÁRIA ── */}
          {tab==='diario' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Leads por Dia</p>
                <DailyBar data={dLeads} color="#8b5cf6" label="Leads" formatter={fmtN}/>
              </div>
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Faturamento por Dia</p>
                <DailyBar data={dRevenue} color={primaryColor} label="Receita" formatter={fmtC}/>
              </div>
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Conversas IA por Dia</p>
                <DailyLine data={dConvs} color="#3b82f6" label="Conversas" formatter={fmtN}/>
              </div>
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Taxa de Conversão por Dia</p>
                <DailyLine data={dConvR} color="#10b981" label="Conversão" formatter={fmtP}/>
              </div>
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Leads por Agente</p>
                <DailyBar data={agentData} color="#f59e0b" label="Leads" formatter={fmtN}/>
              </div>
              <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
                <p className="text-sm font-bold text-gray-900 mb-3">Pipeline por Estágio</p>
                <DailyBar data={stageData} color="#ec4899" label="Leads" formatter={fmtN}/>
              </div>
            </div>
          )}
          {editKPIItem && (
            <KPIManualModal
              kpi={editKPIItem}
              period={periodKey}
              overrides={kpiOverrides}
              onSave={val => saveKPIOverride(`${periodKey}__${editKPIItem.title}`, val)}
              onClear={() => clearKPIOverride(`${periodKey}__${editKPIItem.title}`)}
              onClose={() => setEditKPIItem(null)}
              primaryColor={primaryColor}
            />
          )}
        </div>
      );
    };

    /* ---- Pipeline Geral Tab — Multi-Pipeline Kanban + Funil ---- */
    const AdminPipelineTab = ({ primaryColor }) => {
      const [leads, setLeads] = useState([]);
      const [busy, setBusy] = useState(true);
      const [agentFilter, setAgentFilter] = useState('');
      const [view, setView] = useState('kanban');
      const [dragLead, setDragLead] = useState(null);
      const [isOver, setIsOver] = useState(null);
      const [showConfig, setShowConfig] = useState(false);
      const [showNewPipeline, setShowNewPipeline] = useState(false);
      const [newPipelineName, setNewPipelineName] = useState('');
      const [openColorStage, setOpenColorStage] = useState(null);
      const colorPickerRefs = useRef({});
      const [selectedLead, setSelectedLead] = useState(null);
      const toast = useToast();

      /* ── Calendar date filter ── */
      const [showAdminPipeCal, setShowAdminPipeCal] = useState(false);
      const [adminPipeCalMonth, setAdminPipeCalMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [adminPipeFrom, setAdminPipeFrom] = useState(null);
      const [adminPipeTo, setAdminPipeTo] = useState(null);
      const adminPipeCalRef = useRef(null);

      useEffect(() => {
        const h = (e) => { if (adminPipeCalRef.current && !adminPipeCalRef.current.contains(e.target)) setShowAdminPipeCal(false); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);

      const fmtAPD = d => d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '--';
      const adminPipeDays = (() => {
        const yr=adminPipeCalMonth.getFullYear(), mo=adminPipeCalMonth.getMonth();
        const first=new Date(yr,mo,1), last=new Date(yr,mo+1,0);
        const days=[];
        for(let i=0;i<first.getDay();i++) days.push(null);
        for(let d=1;d<=last.getDate();d++) days.push(new Date(yr,mo,d));
        return days;
      })();
      const handleAdminPipeDay = (day) => {
        if(!day) return;
        if(!adminPipeFrom||(adminPipeFrom&&adminPipeTo)){setAdminPipeFrom(day);setAdminPipeTo(null);}
        else{if(day<adminPipeFrom){setAdminPipeTo(adminPipeFrom);setAdminPipeFrom(day);}else{setAdminPipeTo(day);}setShowAdminPipeCal(false);}
      };
      const isAdminDayInRange=(day)=>{
        if(!day||!adminPipeFrom) return false;
        if(!adminPipeTo) return day.toDateString()===adminPipeFrom.toDateString();
        return day>=adminPipeFrom&&day<=adminPipeTo;
      };
      const clearAdminPipeCal=()=>{setAdminPipeFrom(null);setAdminPipeTo(null);};
      const filterAdminLeadsByDate=(list)=>{
        if(!adminPipeFrom) return list;
        return list.filter(l=>{
          const d=l.created_at?new Date(l.created_at):null;
          if(!d) return true;
          const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
          if(!adminPipeTo) return day.toDateString()===adminPipeFrom.toDateString();
          return day>=adminPipeFrom&&day<=adminPipeTo;
        });
      };

      const [pipelines, setPipelines] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pixt_pipelines') || 'null') || [DEFAULT_PIPELINE]; } catch { return [DEFAULT_PIPELINE]; }
      });
      const [activePipelineId, setActivePipelineId] = useState(() => {
        try { return localStorage.getItem('pixt_active_pipeline') || 'default'; } catch { return 'default'; }
      });

      const savePipelines = (next) => { setPipelines(next); localStorage.setItem('pixt_pipelines', JSON.stringify(next)); };
      const activePipeline = pipelines.find(p => p.id === activePipelineId) || pipelines[0];
      const stages = activePipeline?.stages || DEFAULT_STAGES;
      const updStages = (ns) => savePipelines(pipelines.map(p => p.id === activePipeline.id ? {...p, stages: ns} : p));

      useEffect(() => {
        setBusy(true);
        api('/admin/all-leads').then(d=>setLeads(d.leads||[])).catch(e=>toast(e.message,'error')).finally(()=>setBusy(false));
      }, []);

      const agentLabel = { vendas:'Vendas+', leadflow:'Lead Flow', booker:'Booker', 'pixt-bdr':'PIXT BDR', custom:'Custom' };
      const agents = [...new Set(leads.map(l => l.agent_slug))];
      const filtered = agentFilter ? leads.filter(l => l.agent_slug === agentFilter) : leads;
      const dateFiltered = filterAdminLeadsByDate(filtered);
      const totalLeads = dateFiltered.length || 1;

      const byStage = {};
      stages.forEach(s => { byStage[s.id] = []; });
      dateFiltered.forEach(l => {
        const key = stages.find(s => s.id === l.stage) ? l.stage : stages[0]?.id;
        if (key) byStage[key] = [...(byStage[key] || []), l];
      });

      const moveLead = async (leadId, newStage) => {
        const lead = leads.find(l => l.id === leadId);
        if (!lead || lead.stage === newStage) return;
        setLeads(prev => prev.map(l => l.id === leadId ? {...l, stage: newStage} : l));
        try { await api(`/leads/${leadId}`, { method:'PATCH', body:JSON.stringify({ stage: newStage }) }); }
        catch (e) { toast(e.message,'error'); setLeads(prev => prev.map(l => l.id === leadId ? {...l, stage: lead.stage} : l)); }
      };

      const removeLead = async (id) => {
        if (!confirm('Remover lead?')) return;
        setLeads(prev => prev.filter(l => l.id !== id));
        try { await api(`/leads/${id}`, { method:'DELETE' }); } catch (e) { toast(e.message,'error'); }
      };

      const addStage   = () => updStages([...stages, { id:`s_${Date.now()}`, title:'Nova Etapa', sub:'', color:'blue' }]);
      const updStage   = (id, patch) => updStages(stages.map(s => s.id === id ? {...s,...patch} : s));
      const delStage   = (id) => updStages(stages.filter(s => s.id !== id));

      const selectPipeline = (id) => { setActivePipelineId(id); localStorage.setItem('pixt_active_pipeline', id); };
      const createPipeline = () => {
        if (!newPipelineName.trim()) return;
        const np = { id:`p_${Date.now()}`, name:newPipelineName.trim(), stages:[...DEFAULT_STAGES] };
        const next = [...pipelines, np];
        savePipelines(next); selectPipeline(np.id);
        setNewPipelineName(''); setShowNewPipeline(false);
        toast('Pipeline criada!','success');
      };
      const deletePipeline = (id) => {
        if (pipelines.length <= 1) { toast('Deve existir ao menos uma pipeline','error'); return; }
        if (!confirm('Excluir esta pipeline?')) return;
        const next = pipelines.filter(p => p.id !== id);
        savePipelines(next); selectPipeline(next[0].id);
      };

      useEffect(() => {
        const handler = (e) => {
          const open = Object.entries(colorPickerRefs.current).find(([id]) => id === openColorStage);
          if (open && !open[1]?.contains(e.target)) setOpenColorStage(null);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, [openColorStage]);

      if (busy) return <div className="flex items-center justify-center h-64"><Loader2 size={24} className="animate-spin text-gray-400"/></div>;

      return (
        <div className="h-full flex flex-col gap-3">

          {/* ── Pipeline selector ── */}
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm px-4 py-3 shrink-0">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[10px] font-black text-gray-400 uppercase tracking-wider mr-1">Pipeline:</span>
              {pipelines.map(p => (
                <div key={p.id} className="flex items-center gap-1">
                  <button onClick={() => selectPipeline(p.id)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${activePipelineId===p.id?'text-black border-transparent shadow-sm':'border-gray-200 text-gray-600 bg-white hover:bg-gray-50'}`}
                    style={activePipelineId===p.id?{backgroundColor:primaryColor}:{}}>
                    {p.name}
                  </button>
                  {pipelines.length>1 && activePipelineId!==p.id && (
                    <button onClick={()=>deletePipeline(p.id)} className="text-gray-300 hover:text-red-400 transition-colors p-0.5 rounded"><X size={11}/></button>
                  )}
                </div>
              ))}
              {showNewPipeline ? (
                <div className="flex items-center gap-1.5">
                  <input autoFocus value={newPipelineName} onChange={e=>setNewPipelineName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')createPipeline();if(e.key==='Escape')setShowNewPipeline(false);}}
                    className="border border-gray-200 rounded-xl px-3 py-1.5 text-xs font-bold outline-none focus:border-blue-400 w-36" placeholder="Nome da pipeline"/>
                  <button onClick={createPipeline} className="px-2.5 py-1.5 rounded-xl text-xs font-bold text-black" style={{backgroundColor:primaryColor}}>Criar</button>
                  <button onClick={()=>setShowNewPipeline(false)} className="text-gray-400 hover:text-gray-600 p-1 rounded"><X size={13}/></button>
                </div>
              ) : (
                <button onClick={()=>setShowNewPipeline(true)}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-dashed border-gray-300 text-xs font-bold text-gray-500 hover:border-gray-400 hover:text-gray-700 transition-all">
                  <Plus size={12}/> Nova Pipeline
                </button>
              )}
            </div>
          </div>

          {/* ── Toolbar ── */}
          <div className="flex flex-wrap items-center gap-3 shrink-0">
            <div className="flex gap-1 bg-white border border-gray-200 rounded-xl p-1">
              {[{id:'kanban',label:'Kanban',icon:KanbanSquare},{id:'funnel',label:'Funil',icon:TrendingUp}].map(v=>(
                <button key={v.id} onClick={()=>setView(v.id)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${view===v.id?'bg-gray-900 text-white shadow':'text-gray-500 hover:bg-gray-50'}`}>
                  <v.icon size={13}/> {v.label}
                </button>
              ))}
            </div>
            <select value={agentFilter} onChange={e=>setAgentFilter(e.target.value)} className="border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white outline-none">
              <option value="">Todos os agentes</option>
              {agents.map(a=><option key={a} value={a}>{agentLabel[a]||a}</option>)}
            </select>
            {/* Calendar date filter */}
            <div className="relative" ref={adminPipeCalRef}>
              <button onClick={()=>setShowAdminPipeCal(v=>!v)}
                className={`flex items-center gap-1.5 px-3 py-2 rounded-xl border text-sm font-bold transition-all ${adminPipeFrom?'border-gray-700 bg-gray-900 text-white':'border-gray-200 bg-white text-gray-600 hover:bg-gray-50'}`}>
                <Calendar size={13}/>
                {adminPipeFrom?`${fmtAPD(adminPipeFrom)} → ${fmtAPD(adminPipeTo||adminPipeFrom)}`:'Período'}
                {adminPipeFrom&&<span onClick={e=>{e.stopPropagation();clearAdminPipeCal();}} className="ml-1 opacity-70 hover:opacity-100"><X size={11}/></span>}
              </button>
              {showAdminPipeCal&&(
                <div className="absolute top-full left-0 mt-1 z-30 bg-white rounded-2xl shadow-2xl border border-gray-100 p-4 w-72" onClick={e=>e.stopPropagation()}>
                  <div className="flex items-center justify-between mb-3">
                    <button onClick={()=>setAdminPipeCalMonth(m=>{const d=new Date(m);d.setMonth(d.getMonth()-1);d.setDate(1);return d;})} className="p-1 rounded-lg hover:bg-gray-100 text-gray-500"><ChevronLeft size={16}/></button>
                    <span className="text-sm font-bold text-gray-800 capitalize">{adminPipeCalMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span>
                    <button onClick={()=>setAdminPipeCalMonth(m=>{const d=new Date(m);d.setMonth(d.getMonth()+1);d.setDate(1);return d;})} className="p-1 rounded-lg hover:bg-gray-100 text-gray-500"><ChevronRight size={16}/></button>
                  </div>
                  <div className="grid grid-cols-7 gap-0.5 mb-1">
                    {['D','S','T','Q','Q','S','S'].map((d,i)=>(<div key={i} className="text-center text-[10px] font-black text-gray-400 uppercase py-1">{d}</div>))}
                  </div>
                  <div className="grid grid-cols-7 gap-0.5">
                    {adminPipeDays.map((day,i)=>(
                      <button key={i} onClick={()=>handleAdminPipeDay(day)} disabled={!day}
                        className={`w-full aspect-square rounded-lg text-xs font-bold transition-all flex items-center justify-center ${!day?'opacity-0 pointer-events-none':''} ${day&&isAdminDayInRange(day)?'bg-gray-900 text-white':''} ${day&&!isAdminDayInRange(day)?'hover:bg-gray-100 text-gray-700':''}`}>
                        {day?day.getDate():''}
                      </button>
                    ))}
                  </div>
                  {adminPipeFrom&&(
                    <button onClick={clearAdminPipeCal} className="mt-3 w-full text-xs font-bold text-gray-500 hover:text-gray-800 flex items-center justify-center gap-1.5 py-1.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition">
                      <X size={11}/> Limpar período
                    </button>
                  )}
                </div>
              )}
            </div>
            <span className="text-xs text-gray-400 font-medium">{dateFiltered.length} leads</span>
            <span className="text-xs text-gray-400">|</span>
            <span className="text-xs text-gray-400 font-medium">Pipeline: <strong className="text-gray-700">{fmtBRL(dateFiltered.reduce((s,l)=>s+(parseFloat(l.amount)||0),0))}</strong></span>
            <button onClick={()=>setShowConfig(!showConfig)}
              className={`ml-auto flex items-center gap-1.5 px-3 py-2 rounded-xl border text-sm font-bold transition-all ${showConfig?'bg-gray-900 text-white border-gray-900':'border-gray-200 text-gray-600 bg-white hover:bg-gray-50'}`}>
              <Settings size={13}/> Etapas
            </button>
          </div>

          {/* Stage config */}
          {showConfig && (
            <div className="bg-white rounded-2xl border border-gray-200 p-4 shrink-0 animate-in fade-in duration-150">
              <div className="flex items-center justify-between mb-3">
                <p className="font-bold text-sm text-gray-900">Etapas — <span style={{color:primaryColor}}>{activePipeline?.name}</span></p>
                <button onClick={addStage} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-bold text-black" style={{backgroundColor:primaryColor}}>
                  <Plus size={13}/> Adicionar
                </button>
              </div>
              <div className="flex flex-wrap gap-2">
                {stages.map(s=>(
                  <div key={s.id} className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2">
                    <input value={s.title} onChange={e=>updStage(s.id,{title:e.target.value})} className="text-sm font-bold bg-transparent outline-none w-28"/>
                    <div className="flex gap-1 flex-wrap">
                      {['gray','blue','green','yellow','orange','purple','red','teal','pink'].map(c=>(
                        <button key={c} onClick={()=>updStage(s.id,{color:c})} title={c}
                          className={`w-4 h-4 rounded-full border-2 transition-all ${s.color===c?'border-gray-800 scale-110':'border-transparent hover:scale-105'}`}
                          style={{backgroundColor:COLOR_HEX[c]||'#9ca3af'}}/>
                      ))}
                    </div>
                    {stages.length>1&&<button onClick={()=>delStage(s.id)} className="text-red-400 hover:text-red-600"><X size={13}/></button>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Kanban — colunas coloridas */}
          {view==='kanban' && (
            <div className="flex gap-4 overflow-x-auto flex-1 pb-2">
              {stages.map(stage=>{
                const sl=byStage[stage.id]||[];
                const cc=STAGE_COLORS[stage.color]||STAGE_COLORS.gray;
                return (
                  <div key={stage.id}
                    onDragOver={e=>{e.preventDefault();setIsOver(stage.id);}}
                    onDragLeave={()=>setIsOver(null)}
                    onDrop={e=>{e.preventDefault();if(dragLead)moveLead(dragLead,stage.id);setIsOver(null);setDragLead(null);}}
                    className={`flex-none w-72 rounded-2xl border flex flex-col overflow-hidden shrink-0 transition-all ${cc} ${isOver===stage.id?'drop-target':''}`}
                    style={{maxHeight:'calc(100vh - 300px)'}}>
                    <div className="shrink-0 relative" ref={el => colorPickerRefs.current[stage.id] = el}>
                      <div className="p-4 flex justify-between items-center" style={{backgroundColor:STAGE_HEADER_BG[stage.color]||'#6b7280'}}>
                        <div>
                          <h3 className="font-bold text-white text-sm">{stage.title}</h3>
                          {stage.sub&&<p className="text-[10px] text-white/70 font-medium">{stage.sub}</p>}
                        </div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-xs font-bold px-2 py-0.5 rounded bg-white/20 text-white">{sl.length}</span>
                          <button onClick={e=>{e.stopPropagation();setOpenColorStage(openColorStage===stage.id?null:stage.id);}}
                            className="p-1 rounded hover:bg-white/20 transition-colors text-white/80 hover:text-white">
                            <ChevronDown size={12}/>
                          </button>
                        </div>
                      </div>
                      {openColorStage===stage.id&&(
                        <div className="absolute top-full left-0 z-20 bg-white rounded-xl shadow-xl border border-gray-100 p-3 mt-1">
                          <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2">Cor da etapa</p>
                          <div className="flex flex-wrap gap-1.5">
                            {Object.entries(STAGE_HEADER_BG).map(([c,hex])=>(
                              <button key={c} onClick={()=>{updStage(stage.id,{color:c});setOpenColorStage(null);}}
                                className={`w-5 h-5 rounded-full border-2 transition-all ${stage.color===c?'border-gray-700 scale-110':'border-transparent hover:scale-105'}`}
                                style={{backgroundColor:hex}} title={c}/>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                    <div className="p-3 space-y-2.5 overflow-y-auto flex-1">
                      {sl.map(lead=>(
                        <FlatPipelineCard key={lead.id} lead={lead}
                          stages={stages}
                          isDragging={dragLead===lead.id}
                          onDragStart={()=>setDragLead(lead.id)}
                          onDragEnd={()=>setDragLead(null)}
                          onRemove={()=>removeLead(lead.id)}
                          onEdit={()=>{}}
                          onClickCard={()=>setSelectedLead(lead)}
                          onMoveToStage={(sid)=>moveLead(lead.id,sid)}
                        />
                      ))}
                      {sl.length===0&&<div className="text-center text-gray-300 text-xs py-6 font-medium">Arraste um lead aqui</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {selectedLead && <LeadDrawer lead={selectedLead} onClose={()=>setSelectedLead(null)} onDelete={removeLead} primaryColor={primaryColor}/>}

          {/* Funil view */}
          {view==='funnel' && (
            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 flex-1 overflow-y-auto">
              <h3 className="font-black text-gray-900 mb-1">{activePipeline?.name} — Funil de Conversão</h3>
              <p className="text-xs text-gray-400 mb-5">{filtered.length} leads no total</p>
              <div className="space-y-3">
                {stages.map((stage,i)=>{
                  const count=(byStage[stage.id]||[]).length; const pct=Math.round((count/totalLeads)*100);
                  const prev=i>0?(byStage[stages[i-1].id]||[]).length:totalLeads;
                  const conv=prev>0?Math.round((count/prev)*100):0;
                  const dot=COLOR_HEX[stage.color]||'#9ca3af';
                  return (
                    <div key={stage.id} className="flex items-center gap-4">
                      <div className="w-36 shrink-0 flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-full shrink-0" style={{backgroundColor:dot}}/><span className="text-sm font-bold text-gray-700 truncate">{stage.title}</span></div>
                      <div className="flex-1 h-9 bg-gray-100 rounded-xl overflow-hidden">
                        <div className="h-full rounded-xl flex items-center justify-end pr-3 transition-all duration-500" style={{width:`${Math.max(4,pct)}%`,backgroundColor:dot+'cc',minWidth:count>0?'40px':'0'}}>
                          {count>0&&<span className="text-xs font-extrabold text-white">{count}</span>}
                        </div>
                      </div>
                      <div className="w-14 shrink-0 text-right"><span className="text-sm font-extrabold text-gray-900">{pct}%</span></div>
                      {i>0&&<div className="w-20 shrink-0"><span className={`text-xs font-bold px-2 py-0.5 rounded-full ${conv>=50?'bg-green-100 text-green-700':conv>=25?'bg-yellow-100 text-yellow-700':'bg-red-100 text-red-700'}`}>Conv. {conv}%</span></div>}
                    </div>
                  );
                })}
              </div>
              <div className="mt-6 pt-5 border-t border-gray-100 grid grid-cols-3 gap-4 text-center">
                <div><p className="text-2xl font-black text-gray-900">{filtered.length}</p><p className="text-xs text-gray-400 font-medium">Total de Leads</p></div>
                <div><p className="text-2xl font-black" style={{color:primaryColor}}>{(byStage['closed']||byStage['ganho']||[]).length}</p><p className="text-xs text-gray-400 font-medium">Fechados / Ganhos</p></div>
                <div><p className="text-2xl font-black text-red-400">{(byStage['perdido']||[]).length}</p><p className="text-xs text-gray-400 font-medium">Perdidos</p></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* =========================================================
       MIND MAP — MindMapCanvas (Miro-style whiteboard)
       ========================================================= */
    const MM_COLORS = ['#ffffff','#c6f432','#fecaca','#bfdbfe','#fef08a','#e9d5ff','transparent'];
    const MM_BORDER_COLORS = ['#000000','#c6f432','#ef4444','#3b82f6','#eab308','#a855f7','transparent'];

    const mmPort = (el, p) => {
      if (!el) return {x:0,y:0};
      if (p==='T') return {x:el.x+el.w/2, y:el.y};
      if (p==='B') return {x:el.x+el.w/2, y:el.y+el.h};
      if (p==='L') return {x:el.x,        y:el.y+el.h/2};
      if (p==='R') return {x:el.x+el.w,   y:el.y+el.h/2};
      return {x:el.x+el.w/2, y:el.y+el.h/2};
    };

    const mmPath = (x1,y1,p1,x2,y2,p2,sty) => {
      if (sty==='straight') return `M ${x1} ${y1} L ${x2} ${y2}`;
      if (sty==='curved') {
        const w=Math.max(Math.abs(x2-x1)*.5,Math.abs(y2-y1)*.5,40);
        const c=(x,y,p)=>({x:x+(p==='R'?w:p==='L'?-w:0),y:y+(p==='B'?w:p==='T'?-w:0)});
        const a=c(x1,y1,p1),b=c(x2,y2,p2);
        return `M ${x1} ${y1} C ${a.x} ${a.y}, ${b.x} ${b.y}, ${x2} ${y2}`;
      }
      const mg=20;
      const m1x=x1+(p1==='R'?mg:p1==='L'?-mg:0),m1y=y1+(p1==='B'?mg:p1==='T'?-mg:0);
      const m2x=x2+(p2==='R'?mg:p2==='L'?-mg:0),m2y=y2+(p2==='B'?mg:p2==='T'?-mg:0);
      const mx=(m1x+m2x)/2,my=(m1y+m2y)/2;
      const h1=p1==='L'||p1==='R',h2=p2==='L'||p2==='R';
      if (h1&&h2)  return `M ${x1} ${y1} L ${m1x} ${y1} L ${mx} ${y1} L ${mx} ${y2} L ${m2x} ${y2} L ${x2} ${y2}`;
      if (!h1&&!h2) return `M ${x1} ${y1} L ${x1} ${m1y} L ${x1} ${my} L ${x2} ${my} L ${x2} ${m2y} L ${x2} ${y2}`;
      if (h1&&!h2)  return `M ${x1} ${y1} L ${m1x} ${y1} L ${m1x} ${m2y} L ${x2} ${m2y} L ${x2} ${y2}`;
      return `M ${x1} ${y1} L ${x1} ${m1y} L ${m2x} ${m1y} L ${m2x} ${y2} L ${x2} ${y2}`;
    };

    const MindMapCanvas = ({ storageKey, primaryColor: pc0, initialTitle='Estratégia', height='calc(100vh - 200px)', showHeader=true }) => {
      const BRAND = pc0||'#c6f432';
      const ctnRef = useRef(null);
      const rootRef = useRef(null);

      const [cam, setCam] = useState({x:0,y:0,z:1});

      const mkDefault = () => [
        {id:'1',type:'RECT',x:300,y:200,w:220,h:80,text:initialTitle,bg:'#ffffff',border:BRAND,fontSize:18,fontWeight:'bold',textAlign:'center'}
      ];

      const [els, setEls] = useState(()=>{
        try{const s=localStorage.getItem(storageKey+'_els');if(s)return JSON.parse(s);}catch{}
        return mkDefault();
      });
      const [lns, setLns] = useState(()=>{
        try{const s=localStorage.getItem(storageKey+'_lns');if(s)return JSON.parse(s);}catch{}
        return [];
      });

      useEffect(()=>{try{localStorage.setItem(storageKey+'_els',JSON.stringify(els));}catch{}},[els]);
      useEffect(()=>{try{localStorage.setItem(storageKey+'_lns',JSON.stringify(lns));}catch{}},[lns]);

      const [tool, setTool] = useState('SELECT');
      const [lnSty, setLnSty] = useState('stepped');
      const [selId, setSelId] = useState(null);
      const [editId, setEditId] = useState(null);
      const [ctxMenu, setCtxMenu] = useState(null);
      const [act, setAct] = useState({type:'NONE'});

      useEffect(()=>{
        const el=ctnRef.current;
        if(!el) return;
        const h=(e)=>{
          e.preventDefault();
          const r=el.getBoundingClientRect();
          const mx=e.clientX-r.left,my=e.clientY-r.top,d=-e.deltaY*.002;
          setCam(c=>{const z=Math.min(Math.max(.1,c.z+d),3);return{x:mx-(mx-c.x)/c.z*z,y:my-(my-c.y)/c.z*z,z};});
        };
        el.addEventListener('wheel',h,{passive:false});
        return()=>el.removeEventListener('wheel',h);
      },[]);

      const toCvs=(cx,cy)=>{
        const r=ctnRef.current?.getBoundingClientRect()||{left:0,top:0};
        return{x:(cx-r.left-cam.x)/cam.z,y:(cy-r.top-cam.y)/cam.z};
      };

      const onPtrDown=(e)=>{
        if(ctxMenu&&!e.target.closest('.mm-ctx'))setCtxMenu(null);
        if(e.button===2)return;
        if(e.button===1||(e.button===0&&e.shiftKey)){setAct({type:'PAN',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y});return;}
        const tid=e.target.getAttribute('data-mmid')||e.target.closest('[data-mmid]')?.getAttribute('data-mmid');
        const p=toCvs(e.clientX,e.clientY);
        if(editId&&tid!==editId)setEditId(null);
        if(tid){
          setSelId(tid);
          if(tool==='LINE')setAct({type:'LINE',fid:tid,fp:'C',ex:p.x,ey:p.y});
          else if(tool==='SELECT'){const el=els.find(el=>el.id===tid);setAct({type:'DRAG',id:tid,ox:p.x-el.x,oy:p.y-el.y});}
        }else{
          setSelId(null);
          if(tool==='SELECT')setAct({type:'PAN',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y});
          else if(tool!=='LINE'){
            const nid=Date.now().toString();
            let ne={id:nid,type:tool,x:p.x,y:p.y,text:'',fontSize:16,fontWeight:'normal',textAlign:'center'};
            if(tool==='RECT'||tool==='CIRCLE')ne={...ne,w:150,h:80,bg:'#ffffff',border:'#000000'};
            else if(tool==='STICKY')ne={...ne,w:150,h:150,bg:'#fef08a',border:'transparent'};
            else if(tool==='TEXT')ne={...ne,w:200,h:50,bg:'transparent',border:'transparent',text:'Novo Texto'};
            setEls(prev=>[...prev,ne]);setTool('SELECT');setSelId(nid);setEditId(nid);
          }
        }
      };

      const onCtxMenu=(e)=>{
        e.preventDefault();
        if(!e.target.getAttribute('data-mmid')&&!e.target.closest('[data-mmid]')){
          const r=rootRef.current?.getBoundingClientRect()||{left:0,top:0};
          setCtxMenu({x:e.clientX-r.left,y:e.clientY-r.top});
          setSelId(null);
        }
      };

      const onPtrMove=(e)=>{
        if(act.type==='PAN')setCam(c=>({...c,x:act.cx+(e.clientX-act.sx),y:act.cy+(e.clientY-act.sy)}));
        else if(act.type==='DRAG'){const p=toCvs(e.clientX,e.clientY);setEls(prev=>prev.map(el=>el.id===act.id?{...el,x:p.x-act.ox,y:p.y-act.oy}:el));}
        else if(act.type==='LINE'){const p=toCvs(e.clientX,e.clientY);setAct(a=>({...a,ex:p.x,ey:p.y}));}
      };

      const onPtrUp=(e)=>{
        if(act.type==='LINE'){
          const te=document.elementFromPoint(e.clientX,e.clientY);
          const tid=te?.getAttribute('data-mmid')||te?.closest?.('[data-mmid]')?.getAttribute?.('data-mmid');
          if(tid&&tid!==act.fid){
            const tel=els.find(el=>el.id===tid);
            const p=toCvs(e.clientX,e.clientY);
            let bp='T',bd=Infinity;
            ['T','B','L','R'].forEach(pt=>{const c=mmPort(tel,pt);const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;bp=pt;}});
            setLns(prev=>[...prev,{id:Date.now().toString(),from:act.fid,fromPort:act.fp,to:tid,toPort:bp,style:lnSty}]);
          }
          setTool('SELECT');
        }
        setAct({type:'NONE'});
      };

      const quickLine=(e,sid,port)=>{
        e.stopPropagation();
        const p=toCvs(e.clientX,e.clientY);
        setAct({type:'LINE',fid:sid,fp:port,ex:p.x,ey:p.y});
      };

      const addFromCtx=(type)=>{
        if(!ctxMenu)return;
        const p={x:(ctxMenu.x-cam.x)/cam.z,y:(ctxMenu.y-cam.y)/cam.z};
        const nid=Date.now().toString();
        let ne={id:nid,type,x:p.x-75,y:p.y-40,text:'',fontSize:16,fontWeight:'normal',textAlign:'center'};
        if(type==='RECT'||type==='CIRCLE')ne={...ne,w:150,h:80,bg:'#ffffff',border:'#000000'};
        else if(type==='STICKY')ne={...ne,w:150,h:150,bg:'#fef08a',border:'transparent',y:p.y-75};
        else if(type==='TEXT')ne={...ne,w:200,h:50,bg:'transparent',border:'transparent',text:'Novo Texto',x:p.x-100,y:p.y-25};
        setEls(prev=>[...prev,ne]);setCtxMenu(null);setSelId(nid);setEditId(nid);setTool('SELECT');
      };

      const updSty=(id,sty)=>setEls(prev=>prev.map(el=>el.id===id?{...el,...sty}:el));
      const updTxt=(id,txt)=>setEls(prev=>prev.map(el=>el.id===id?{...el,text:txt}:el));
      const del=()=>{if(selId){setEls(prev=>prev.filter(el=>el.id!==selId));setLns(prev=>prev.filter(l=>l.from!==selId&&l.to!==selId));setSelId(null);}};

      useEffect(()=>{
        const h=(e)=>{if((e.key==='Delete'||e.key==='Backspace')&&selId&&!editId)del();};
        window.addEventListener('keydown',h);
        return()=>window.removeEventListener('keydown',h);
      },[selId,editId]);

      const selEl=els.find(el=>el.id===selId);
      const aid=`mma_${storageKey.replace(/\W/g,'_')}`;
      const did=`mmd_${storageKey.replace(/\W/g,'_')}`;

      return (
        <div ref={rootRef} className="relative overflow-hidden bg-[#f4f5f7] select-none" style={{height}} onContextMenu={onCtxMenu}>

          {/* CANVAS */}
          <div ref={ctnRef} className="absolute inset-0 z-0"
            onPointerDown={onPtrDown} onPointerMove={onPtrMove} onPointerUp={onPtrUp}
            style={{
              backgroundImage:'radial-gradient(#cbd5e1 1px, transparent 1px)',
              backgroundSize:`${20*cam.z}px ${20*cam.z}px`,
              backgroundPosition:`${cam.x}px ${cam.y}px`,
              cursor:act.type==='PAN'?'grabbing':tool==='SELECT'?'default':'crosshair'
            }}>
            <div className="absolute origin-top-left" style={{transform:`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`}}>

              {/* SVG Lines */}
              <svg className="absolute inset-0 overflow-visible pointer-events-none" style={{zIndex:0}}>
                <defs>
                  <marker id={aid} markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
                  </marker>
                  <marker id={did} markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0,10 3.5,0 7" fill={BRAND}/>
                  </marker>
                </defs>
                {lns.map(ln=>{
                  const e1=els.find(e=>e.id===ln.from),e2=els.find(e=>e.id===ln.to);
                  if(!e1||!e2)return null;
                  const c1=mmPort(e1,ln.fromPort),c2=mmPort(e2,ln.toPort);
                  return <path key={ln.id} d={mmPath(c1.x,c1.y,ln.fromPort,c2.x,c2.y,ln.toPort,ln.style||'stepped')} fill="none" stroke="#64748b" strokeWidth="2" markerEnd={`url(#${aid})`}/>;
                })}
                {act.type==='LINE'&&(()=>{
                  const src=els.find(e=>e.id===act.fid);if(!src)return null;
                  const sc=mmPort(src,act.fp||'C');
                  const dx=act.ex-sc.x,dy=act.ey-sc.y;
                  const dp=Math.abs(dx)>Math.abs(dy)?(dx>0?'L':'R'):(dy>0?'T':'B');
                  return <path d={mmPath(sc.x,sc.y,act.fp||'C',act.ex,act.ey,dp,lnSty)} fill="none" stroke={BRAND} strokeWidth="3" strokeDasharray="5,5" markerEnd={`url(#${did})`}/>;
                })()}
              </svg>

              {/* Elements */}
              {els.map(el=>{
                const isSel=selId===el.id;
                return (
                  <div key={el.id} data-mmid={el.id}
                    onDoubleClick={()=>setEditId(el.id)}
                    className={`absolute flex items-center justify-center shadow-sm transition-shadow ${isSel?'ring-2 shadow-lg z-10':'hover:ring-1 z-0'}`}
                    style={{left:el.x,top:el.y,width:el.w,height:el.h,backgroundColor:el.bg,border:`2px solid ${el.border}`,
                      borderRadius:el.type==='CIRCLE'?'50%':el.type==='STICKY'?'4px':'8px',
                      boxShadow:el.type==='STICKY'?'2px 4px 8px rgba(0,0,0,.1)':undefined,
                      '--tw-ring-color':BRAND,cursor:'grab'}}>
                    {isSel&&!editId&&(<>
                      <div className="absolute bg-blue-500 border-2 border-white rounded-full cursor-crosshair hover:scale-150 transition-transform"
                        style={{width:12,height:12,top:-6,left:'50%',transform:'translateX(-50%)',zIndex:20}} onPointerDown={e=>quickLine(e,el.id,'T')}/>
                      <div className="absolute bg-blue-500 border-2 border-white rounded-full cursor-crosshair hover:scale-150 transition-transform"
                        style={{width:12,height:12,top:'50%',right:-6,transform:'translateY(-50%)',zIndex:20}} onPointerDown={e=>quickLine(e,el.id,'R')}/>
                      <div className="absolute bg-blue-500 border-2 border-white rounded-full cursor-crosshair hover:scale-150 transition-transform"
                        style={{width:12,height:12,bottom:-6,left:'50%',transform:'translateX(-50%)',zIndex:20}} onPointerDown={e=>quickLine(e,el.id,'B')}/>
                      <div className="absolute bg-blue-500 border-2 border-white rounded-full cursor-crosshair hover:scale-150 transition-transform"
                        style={{width:12,height:12,top:'50%',left:-6,transform:'translateY(-50%)',zIndex:20}} onPointerDown={e=>quickLine(e,el.id,'L')}/>
                    </>)}
                    {editId===el.id?(
                      <textarea autoFocus className="w-full h-full p-2 bg-transparent border-none outline-none resize-none"
                        style={{fontSize:`${el.fontSize||16}px`,color:el.bg==='#000000'?'#fff':'#000',textAlign:el.textAlign||'center',fontWeight:el.fontWeight||'normal',fontStyle:el.fontStyle||'normal'}}
                        value={el.text} onChange={ev=>updTxt(el.id,ev.target.value)} onBlur={()=>setEditId(null)} onPointerDown={ev=>ev.stopPropagation()}/>
                    ):(
                      <div className="w-full h-full p-2 flex whitespace-pre-wrap pointer-events-none overflow-hidden"
                        style={{fontSize:`${el.fontSize||16}px`,color:el.bg==='#000000'?'#fff':'#000',textAlign:el.textAlign||'center',fontWeight:el.fontWeight||'normal',fontStyle:el.fontStyle||'normal',alignItems:'center',
                          justifyContent:el.textAlign==='left'?'flex-start':el.textAlign==='right'?'flex-end':'center'}}>
                        {el.text}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* CONTEXT MENU */}
          {ctxMenu&&(
            <div className="absolute z-[100] bg-white rounded-xl shadow-xl border border-gray-200 p-2 flex flex-col w-48 mm-ctx"
              style={{left:ctxMenu.x,top:ctxMenu.y}}>
              <div className="flex items-center gap-1 text-xs font-bold text-gray-400 uppercase tracking-wider px-2 pt-1 pb-2 border-b border-gray-100">
                <Plus size={13}/> Adicionar
              </div>
              {[['RECT',Square,'Retângulo'],['STICKY',StickyNote,'Post-it'],['CIRCLE',Circle,'Círculo'],['TEXT',Type,'Texto']].map(([t,Ic,lb])=>(
                <button key={t} onClick={()=>addFromCtx(t)} className="flex items-center gap-3 hover:bg-gray-100 p-2 mt-1 rounded-lg text-sm text-gray-700 font-medium transition-colors">
                  <Ic size={15}/>{lb}
                </button>
              ))}
            </div>
          )}

          {/* TOOLBAR */}
          <div className="absolute left-3 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col p-1 gap-0.5 z-50"
            style={{top:showHeader?60:12}}>
            {[{id:'SELECT',Ic:MousePointer2,tip:'Selecionar'},{id:'TEXT',Ic:Type,tip:'Texto'},{id:'STICKY',Ic:StickyNote,tip:'Post-it'},{id:'RECT',Ic:Square,tip:'Retângulo'},{id:'CIRCLE',Ic:Circle,tip:'Círculo'}].map(({id,Ic,tip})=>(
              <button key={id} title={tip} onClick={()=>setTool(id)}
                className={`p-2.5 rounded-lg transition-all flex items-center justify-center ${tool===id?'text-black shadow-inner':'text-gray-500 hover:bg-gray-100 hover:text-gray-800'}`}
                style={{backgroundColor:tool===id?BRAND:'transparent'}}>
                <Ic size={18}/>
              </button>
            ))}
            <div className="w-full h-px bg-gray-100 my-0.5"/>
            <div className="text-[8px] text-center text-gray-400 font-bold tracking-widest py-0.5">LINHAS</div>
            {[
              {v:'straight',tip:'Reta',     svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>},
              {v:'curved',  tip:'Curva',    svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M 4 20 C 12 20,12 4,20 4"/></svg>},
              {v:'stepped', tip:'Quebrada', svg:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M 4 20 L 12 20 L 12 4 L 20 4"/></svg>}
            ].map(({v,tip,svg})=>(
              <button key={v} title={tip} onClick={()=>setLnSty(v)}
                className={`p-2 rounded-lg mx-0.5 transition-all ${lnSty===v?'bg-gray-100 text-black':'text-gray-400 hover:bg-gray-50 hover:text-gray-700'}`}>
                {svg}
              </button>
            ))}
          </div>

          {/* HEADER */}
          {showHeader&&(
            <div className="absolute top-0 left-0 right-0 h-14 px-4 flex items-center gap-3 bg-white/90 backdrop-blur-md border-b border-gray-200 z-40 pointer-events-none">
              <div className="w-7 h-7 rounded-md flex items-center justify-center shadow-sm" style={{backgroundColor:BRAND}}>
                <Square size={14} fill="black" strokeWidth={0}/>
              </div>
              <span className="font-semibold text-gray-800">{initialTitle}</span>
            </div>
          )}

          {/* FORMATTING TOOLBAR */}
          {selEl&&tool==='SELECT'&&(
            <div className="absolute z-50 bg-white rounded-xl shadow-xl border border-gray-200 p-1.5 flex flex-wrap items-center gap-1.5"
              style={{left:selEl.x*cam.z+cam.x+(selEl.w*cam.z)/2,top:Math.max(58,selEl.y*cam.z+cam.y-4),transform:'translate(-50%,-100%)'}}
              onPointerDown={e=>e.stopPropagation()}>
              <div className="flex items-center gap-0.5 pr-1.5 border-r border-gray-200">
                {MM_COLORS.map(c=>(
                  <button key={'bg'+c} title="Fundo" onClick={()=>updSty(selId,{bg:c})}
                    className={`w-5 h-5 rounded-full border border-gray-300 hover:scale-125 transition-transform flex items-center justify-center ${selEl.bg===c?'ring-2 ring-offset-1 ring-gray-600':''}`}
                    style={{backgroundColor:c==='transparent'?'#f8f9fa':c}}>
                    {c==='transparent'&&<span className="text-red-400 text-[10px] leading-none font-bold">╲</span>}
                  </button>
                ))}
              </div>
              <div className="flex items-center gap-0.5 pr-1.5 border-r border-gray-200">
                {MM_BORDER_COLORS.map(c=>(
                  <button key={'bd'+c} title="Borda" onClick={()=>updSty(selId,{border:c})}
                    className={`w-5 h-5 rounded border-2 hover:scale-125 transition-transform flex items-center justify-center ${selEl.border===c?'ring-2 ring-offset-1 ring-gray-600':''}`}
                    style={{backgroundColor:c==='transparent'?'transparent':c,borderColor:c==='transparent'?'#e5e7eb':c}}>
                    {c==='transparent'&&<span className="text-red-400 text-[10px] leading-none font-bold">╲</span>}
                  </button>
                ))}
              </div>
              <div className="flex items-center gap-0.5 pr-1.5 border-r border-gray-200">
                <button onClick={()=>updSty(selId,{fontSize:Math.max(8,(selEl.fontSize||16)-2)})} className="p-1 hover:bg-gray-100 rounded text-gray-600"><Minus size={12}/></button>
                <span className="text-xs w-6 text-center tabular-nums">{selEl.fontSize||16}</span>
                <button onClick={()=>updSty(selId,{fontSize:Math.min(72,(selEl.fontSize||16)+2)})} className="p-1 hover:bg-gray-100 rounded text-gray-600"><Plus size={12}/></button>
              </div>
              <div className="flex items-center gap-0.5 pr-1.5 border-r border-gray-200">
                <button onClick={()=>updSty(selId,{fontWeight:selEl.fontWeight==='bold'?'normal':'bold'})} className={`p-1.5 rounded transition-colors ${selEl.fontWeight==='bold'?'bg-gray-200 text-black':'text-gray-500 hover:bg-gray-100'}`}><Bold size={12}/></button>
                <button onClick={()=>updSty(selId,{fontStyle:selEl.fontStyle==='italic'?'normal':'italic'})} className={`p-1.5 rounded transition-colors ${selEl.fontStyle==='italic'?'bg-gray-200 text-black':'text-gray-500 hover:bg-gray-100'}`}><Italic size={12}/></button>
              </div>
              <div className="flex items-center gap-0.5 pr-1.5 border-r border-gray-200">
                <button onClick={()=>updSty(selId,{textAlign:'left'})} className={`p-1.5 rounded ${selEl.textAlign==='left'?'bg-gray-200 text-black':'text-gray-500 hover:bg-gray-100'}`}><AlignLeft size={12}/></button>
                <button onClick={()=>updSty(selId,{textAlign:'center'})} className={`p-1.5 rounded ${selEl.textAlign!=='left'&&selEl.textAlign!=='right'?'bg-gray-200 text-black':'text-gray-500 hover:bg-gray-100'}`}><AlignCenter size={12}/></button>
                <button onClick={()=>updSty(selId,{textAlign:'right'})} className={`p-1.5 rounded ${selEl.textAlign==='right'?'bg-gray-200 text-black':'text-gray-500 hover:bg-gray-100'}`}><AlignRight size={12}/></button>
              </div>
              <button onClick={del} className="px-2 py-1 text-xs text-red-500 hover:bg-red-50 rounded-lg font-semibold transition-colors">Excluir</button>
            </div>
          )}
        </div>
      );
    };

    /* ---- Traffic & Mídias Tab — routed by activeTab prop ---- */
    const AdminTrafficTab = ({ primaryColor, activeTab, accountSeed = 0, realData = {}, zeroWhenEmpty = false }) => {
      const subTab = activeTab || 'overview';

      // Processa dados reais do Meta Ads
      const processMetaReal = (rawData) => {
        if (!rawData?.insights?.length) return null;
        const rows = rawData.insights;
        const tot = rows.reduce((a, r) => {
          a.spend += parseFloat(r.spend || 0);
          a.impressions += parseInt(r.impressions || 0);
          a.clicks += parseInt(r.clicks || 0);
          const leads = (r.actions || []).find(x => x.action_type === 'lead' || x.action_type === 'leadgen_other')?.value || 0;
          a.leads += parseInt(leads);
          return a;
        }, { spend: 0, impressions: 0, clicks: 0, leads: 0 });
        tot.cpm = tot.impressions > 0 ? (tot.spend / tot.impressions) * 1000 : 0;
        tot.ctr = tot.impressions > 0 ? (tot.clicks / tot.impressions) * 100 : 0;
        tot.cpc = tot.clicks > 0 ? tot.spend / tot.clicks : 0;
        tot.cpa = tot.leads > 0 ? tot.spend / tot.leads : 0;
        return { ...tot, rows };
      };

      // Processa dados reais do GA4
      const processGA4Real = (rawData) => {
        if (!rawData?.rows?.length) return null;
        const mIdx = (rawData.metricHeaders || []).reduce((a, h, i) => { a[h.name] = i; return a; }, {});
        const rows = rawData.rows;
        const tot = rows.reduce((a, r) => {
          const mv = r.metricValues || [];
          a.sessions += parseInt(mv[mIdx.sessions]?.value || 0);
          a.activeUsers += parseInt(mv[mIdx.activeUsers]?.value || 0);
          a.newUsers += parseInt(mv[mIdx.newUsers]?.value || 0);
          a.conversions += parseInt(mv[mIdx.conversions]?.value || 0);
          a.pageViews += parseInt(mv[mIdx.screenPageViews]?.value || 0);
          a.engagementSum += parseFloat(mv[mIdx.engagementRate]?.value || 0);
          return a;
        }, { sessions: 0, activeUsers: 0, newUsers: 0, conversions: 0, pageViews: 0, engagementSum: 0 });
        tot.engagementRate = rows.length > 0 ? (tot.engagementSum / rows.length) * 100 : 0;
        return { ...tot, rows };
      };

      const metaReal = processMetaReal(realData.meta);
      const ga4Real = processGA4Real(realData.ga4);

      // ── Date range state ──────────────────────────────────────
      const [dateRange, setDateRange] = useState(() => {
        const end = new Date(); end.setHours(0,0,0,0);
        const start = new Date(end); start.setDate(start.getDate() - 29);
        return { startDate: start, endDate: end, preset: '30d', label: 'Últimos 30 dias' };
      });
      const [showPicker, setShowPicker] = useState(false);
      const [pickerMonth, setPickerMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [pickStart, setPickStart] = useState(null);
      const [pickEnd,   setPickEnd]   = useState(null);

      // ── Utilities ─────────────────────────────────────────────
      const daysBetween = (a, b) => Math.max(1, Math.round((b.getTime() - a.getTime()) / 86400000));
      const pts      = daysBetween(dateRange.startDate, dateRange.endDate) + 1;
      const rangeKey = `${dateRange.startDate.toISOString().slice(0,10)}_${dateRange.endDate.toISOString().slice(0,10)}`;

      // ── Mock data base — seeded by connected account ──────────
      const acctMult = accountSeed > 0 ? (0.45 + (accountSeed % 70) / 70 * 1.4) : 1;
      const mockEnabled = !zeroWhenEmpty;
      const USER_B = {
        totalSpend:   mockEnabled ? Math.round(68420   * acctMult) : 0,
        leads:        mockEnabled ? Math.round(1847    * acctMult) : 0,
        clicks:       mockEnabled ? Math.round(72300   * acctMult) : 0,
        impressions:  mockEnabled ? Math.round(3420000 * acctMult) : 0,
        pageViews:    mockEnabled ? Math.round(294000  * acctMult) : 0,
        metaSpend:    mockEnabled ? Math.round(42600   * acctMult) : 0,
        googleSpend:  mockEnabled ? Math.round(25820   * acctMult) : 0,
        totalRevenue: mockEnabled ? Math.round(321800  * acctMult) : 0,
      };
      const seededRnd = (seed) => { let s=seed; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; };
      const eachDay = (start, end) => { const out=[]; let cur=new Date(start); cur.setHours(0,0,0,0); const fin=new Date(end); fin.setHours(23,59,59,999); while(cur<=fin){ out.push(new Date(cur)); cur=new Date(cur); cur.setDate(cur.getDate()+1); } return out; };
      const fmtDt = (d) => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
      const allDays = eachDay(dateRange.startDate, dateRange.endDate);

      // ── Formatters ────────────────────────────────────────────
      const fmtC  = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0);
      const fmtCK = v => v>=1000?`R$${(v/1000).toFixed(0)}K`:fmtC(v);
      const fmtN  = v => new Intl.NumberFormat('pt-BR').format(Math.round(v||0));
      const fmtP  = v => `${(v||0).toFixed(2)}%`;
      const fmtX  = v => `${(v||0).toFixed(2)}x`;

      // ── Chart.js factory helpers ──────────────────────────────
      const gridC = 'rgba(0,0,0,0.06)', tickC = '#9ca3af';
      const cOpts = (yFmt) => ({
        responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{labels:{color:tickC,font:{size:11,family:'Inter'},boxWidth:8,boxHeight:8,usePointStyle:true}},
          tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374151',borderColor:'#e5e7eb',borderWidth:1,padding:8,
                   callbacks:yFmt?{label:ctx=>`${ctx.dataset.label}: ${yFmt(ctx.parsed.y)}`}:{}}
        },
        scales:{
          x:{grid:{display:false},ticks:{color:tickC,font:{size:10},autoSkip:true,maxRotation:0}},
          y:{grid:{color:gridC},ticks:{color:tickC,font:{size:10},callback:v=>yFmt?yFmt(v):fmtN(v)}}
        }
      });
      const mkBar  = (C,cv,lbs,dt,col,lbl,fmt)=>new C(cv,{type:'bar',data:{labels:lbs,datasets:[{label:lbl,data:dt,backgroundColor:col,borderRadius:4,maxBarThickness:32}]},options:cOpts(fmt)});
      const mkLine = (C,cv,lbs,dt,col,lbl,fmt)=>new C(cv,{type:'line',data:{labels:lbs,datasets:[{label:lbl,data:dt,borderColor:col,backgroundColor:col+'30',borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3}]},options:cOpts(fmt)});
      const mkArea = (C,cv,lbs,dt,col)=>new C(cv,{type:'line',data:{labels:lbs,datasets:[{label:'Usuários ativos',data:dt,borderColor:col,backgroundColor:col+'30',borderWidth:2,fill:true,pointRadius:0,tension:0.35}]},options:cOpts(fmtN)});
      const mkWk   = (C,cv,wkD,col,fmt)=>new C(cv,{type:'line',data:{labels:wkD.map(d=>d.day),datasets:[
        {label:'Semana atual',data:wkD.map(d=>d.current),borderColor:col,backgroundColor:col+'30',borderWidth:2.5,pointRadius:3,tension:0.3,spanGaps:true},
        {label:'Semana anterior',data:wkD.map(d=>d.previous),borderColor:'#9ca3af',borderWidth:1.5,borderDash:[5,3],pointRadius:0,tension:0.3}
      ]},options:cOpts(fmt)});
      const mkComposed = (C,cv,lbs,series)=>new C(cv,{data:{labels:lbs,datasets:series.map(s=>({
        type:s.type,label:s.label,data:s.data,borderColor:s.color,
        backgroundColor:s.type==='bar'?s.color+'CC':s.color+'20',
        yAxisID:s.yAxisID||'y',borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:0.3,borderRadius:4,maxBarThickness:24
      }))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{labels:{color:tickC,font:{size:11},usePointStyle:true,boxWidth:8}},
                 tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374151',borderColor:'#e5e7eb',borderWidth:1,padding:8}},
        scales:{x:{grid:{display:false},ticks:{color:tickC,font:{size:10},autoSkip:true,maxRotation:0}},
                l:{type:'linear',position:'left',grid:{color:gridC},ticks:{color:tickC,font:{size:10},callback:v=>fmtN(v)}},
                r:{type:'linear',position:'right',grid:{display:false},ticks:{color:tickC,font:{size:10},callback:v=>fmtN(v)}}}}});
      const mkPie  = (C,cv,lbs,dt,cols)=>new C(cv,{type:'doughnut',data:{labels:lbs,datasets:[{data:dt,backgroundColor:cols,borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'52%',plugins:{legend:{position:'bottom',labels:{color:tickC,font:{size:11},usePointStyle:true,padding:14,boxWidth:8}},tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374151',borderColor:'#e5e7eb',borderWidth:1}}}});
      const mkHBar = (C,cv,lbs,dt,cols)=>new C(cv,{type:'bar',data:{labels:lbs,datasets:[{data:dt,backgroundColor:cols,borderRadius:4,maxBarThickness:22}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374151',borderColor:'#e5e7eb',borderWidth:1,callbacks:{label:ctx=>`Sessões: ${fmtN(ctx.parsed.x)}`}}},scales:{x:{grid:{color:gridC},ticks:{color:tickC,font:{size:10},callback:v=>fmtN(v)}},y:{grid:{display:false},ticks:{color:tickC,font:{size:11}}}}}});
      const mkTopCamps = (C,cv,top5)=>new C(cv,{type:'bar',data:{labels:top5.map(c=>c.name.length>30?c.name.slice(0,30)+'…':c.name),datasets:[{data:top5.map(c=>c.spend),backgroundColor:['#8B5CF6','#6D4FCC','#5540A0','#3E3178','#2A2150'].slice(0,top5.length),borderRadius:4,maxBarThickness:28}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374151',borderColor:'#e5e7eb',borderWidth:1,callbacks:{label:(ctx)=>{const c=top5[ctx.dataIndex];return[`Gasto: ${fmtC(c.spend)}`,`ROAS: ${c.roas.toFixed(2)}x`];}}}},scales:{x:{grid:{color:gridC},ticks:{color:tickC,font:{size:10},callback:v=>fmtCK(v)}},y:{grid:{display:false},ticks:{color:tickC,font:{size:11}}}}}});

      // ── Shared KPI card ───────────────────────────────────────
      const KPI = ({ title, value, fmt, icon: Icon, color, delta }) => (
        <div className="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{backgroundColor:color}}>
              {Icon && <Icon size={14} className="text-white"/>}
            </div>
            <p className="text-xs font-semibold text-gray-600 leading-tight">{title}</p>
          </div>
          <p className="text-2xl font-black text-gray-900 leading-none mb-1.5">
            {fmt==='currency'?fmtC(value):fmt==='percent'?fmtP(value):fmt==='multiplier'?fmtX(value):fmtN(value)}
          </p>
          {delta!==undefined&&(
            <div className={`inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-md ${delta>=0?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-600'}`}>
              {delta>=0?'▲':'▼'} {Math.abs(delta).toFixed(1)}%
            </div>
          )}
        </div>
      );

      // ── Preset apply ──────────────────────────────────────────
      const applyPreset = (preset) => {
        const end = new Date(); end.setHours(0,0,0,0);
        const start = new Date(end);
        const offsets = { '7d':6, '14d':13, '30d':29, '90d':89 };
        const labels  = { '7d':'Últimos 7 dias', '14d':'Últimos 14 dias', '30d':'Últimos 30 dias', '90d':'Últimos 90 dias' };
        start.setDate(start.getDate() - (offsets[preset] || 29));
        setDateRange({ startDate: start, endDate: end, preset, label: labels[preset] || preset });
        setPickStart(null); setPickEnd(null); setShowPicker(false);
      };

      // ── Calendar helpers ──────────────────────────────────────
      const fmtDP = d => d ? `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}` : '--';

      const calDays = (() => {
        const yr = pickerMonth.getFullYear(), mo = pickerMonth.getMonth();
        const first = new Date(yr, mo, 1), last = new Date(yr, mo + 1, 0);
        const days = [];
        for (let i = 0; i < first.getDay(); i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) days.push(new Date(yr, mo, d));
        return days;
      })();

      const handlePickDay = (day) => {
        if (!day) return;
        const d = new Date(day); d.setHours(0,0,0,0);
        if (!pickStart || (pickStart && pickEnd)) { setPickStart(d); setPickEnd(null); }
        else if (d < pickStart) { setPickEnd(pickStart); setPickStart(d); }
        else { setPickEnd(d); }
      };
      const applyCustomRange = () => {
        if (!pickStart || !pickEnd) return;
        const d = daysBetween(pickStart, pickEnd) + 1;
        setDateRange({ startDate: pickStart, endDate: pickEnd, preset: 'custom', label: `${fmtDP(pickStart)} → ${fmtDP(pickEnd)} (${d}d)` });
        setShowPicker(false);
      };
      const isDayIn    = (d) => { if (!d || !pickStart) return false; const t=d.getTime(); if(pickEnd) return t>=pickStart.getTime()&&t<=pickEnd.getTime(); return t===pickStart.getTime(); };
      const isDayStart = (d) => d && pickStart && d.getTime() === pickStart.getTime();
      const isDayEnd   = (d) => d && pickEnd   && d.getTime() === pickEnd.getTime();
      /* ── Visão Geral ── */
      const OverviewContent = () => {
        const [dailyTab, setDailyTab] = useState('resumo');
        const rand = seededRnd(77);
        const ovDays = allDays.map(d=>{
          const impressions=Math.round((USER_B.impressions/30)*(0.7+rand()*0.6));
          const clicks=Math.round((USER_B.clicks/30)*(0.7+rand()*0.6));
          const investment=Math.round((USER_B.totalSpend/30)*(0.75+rand()*0.5));
          const leads=Math.round((USER_B.leads/30)*(0.65+rand()*0.7));
          const sessions=Math.round((USER_B.clicks/30)*0.9*(0.75+rand()*0.5));
          return {date:fmtDt(d),impressions,clicks,sessions,investment,leads,
            ctr:impressions>0?+((clicks/impressions)*100).toFixed(2):0,
            cpm:impressions>0?+((investment/impressions)*1000).toFixed(2):0};
        });
        const tot = ovDays.reduce((a,d)=>{Object.keys(d).forEach(k=>{if(k!=='date')a[k]=(a[k]||0)+d[k];}); return a;},{});
        tot.ctr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
        tot.cpm=tot.impressions>0?(tot.investment/tot.impressions)*1000:0;
        // week comparison from last 14 days
        const rw=seededRnd(77);
        const today=new Date(); today.setHours(0,0,0,0);
        const w14s=new Date(today); w14s.setDate(w14s.getDate()-13);
        const d14=eachDay(w14s,today).map(d=>{
          const impressions=Math.round((USER_B.impressions/30)*(0.7+rw()*0.6));
          const clicks=Math.round((USER_B.clicks/30)*(0.7+rw()*0.6));
          const investment=Math.round((USER_B.totalSpend/30)*(0.75+rw()*0.5));
          const leads=Math.round((USER_B.leads/30)*(0.65+rw()*0.7));
          const sessions=Math.round((USER_B.clicks/30)*0.9*(0.75+rw()*0.5));
          return {date:fmtDt(d),impressions,clicks,sessions,investment,leads,
            ctr:impressions>0?+((clicks/impressions)*100).toFixed(2):0,
            cpm:impressions>0?+((investment/impressions)*1000).toFixed(2):0};
        });
        const DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
        const wkCmp=(key)=>{const l14=d14.slice(-14),prev=l14.slice(0,7),curr=l14.slice(7); return DAYS.map((day,i)=>({day,previous:prev[i]?.[key]??0,current:curr[i]?.[key]??null}));};
        const kpis=[
          {title:'Investimento',  value:tot.investment,fmt:'currency',icon:DollarSign, color:'#8b5cf6',delta:8.2},
          {title:'Total de Leads',value:tot.leads,     fmt:'number',  icon:Users,      color:'#10b981',delta:12.5},
          {title:'CPL',           value:tot.leads>0?tot.investment/tot.leads:0,fmt:'currency',icon:Receipt,color:'#f59e0b',delta:-3.1},
          {title:'Cliques',       value:tot.clicks,    fmt:'number',  icon:Activity,   color:'#3b82f6',delta:6.7},
          {title:'Impressões',    value:tot.impressions,fmt:'number', icon:BarChart3,  color:'#06b6d4',delta:5.4},
          {title:'CTR',           value:tot.ctr,       fmt:'percent', icon:TrendingUp, color:primaryColor,delta:1.3},
          {title:'Page Views',    value:tot.sessions,  fmt:'number',  icon:Smartphone, color:'#ec4899',delta:9.1},
          {title:'CPM',           value:tot.cpm,       fmt:'currency',icon:DollarSign, color:'#ef4444',delta:2.4},
        ];
        const lbs=ovDays.map(d=>d.date);
        useEffect(()=>{
          const C=window.Chart; if(!C) return; const inst=[];
          if(dailyTab==='resumo'){
            const c1=document.getElementById('ch-ov-winv'); if(c1)inst.push(mkWk(C,c1,wkCmp('investment'),'#8B5CF6',fmtC));
            const c2=document.getElementById('ch-ov-wlead');if(c2)inst.push(mkWk(C,c2,wkCmp('leads'),'#10B981',fmtN));
            const c3=document.getElementById('ch-ov-wclk'); if(c3)inst.push(mkWk(C,c3,wkCmp('clicks'),'#4285F4',fmtN));
            const c4=document.getElementById('ch-ov-wimp'); if(c4)inst.push(mkWk(C,c4,wkCmp('impressions'),'#F59E0B',fmtN));
          } else {
            const c1=document.getElementById('ch-ov-dinv'); if(c1)inst.push(mkBar(C,c1,lbs,ovDays.map(d=>d.investment),'#8B5CF6','Investimento',fmtCK));
            const c2=document.getElementById('ch-ov-dctr'); if(c2)inst.push(mkLine(C,c2,lbs,ovDays.map(d=>d.ctr),'#F59E0B','CTR',fmtP));
            const c3=document.getElementById('ch-ov-dimp'); if(c3)inst.push(mkBar(C,c3,lbs,ovDays.map(d=>d.impressions),'#4285F4','Impressões',fmtN));
            const c4=document.getElementById('ch-ov-dcpm'); if(c4)inst.push(mkLine(C,c4,lbs,ovDays.map(d=>d.cpm),'#EF4444','CPM',fmtC));
            const c5=document.getElementById('ch-ov-dcs');  if(c5)inst.push(mkComposed(C,c5,lbs,[{type:'bar',label:'Cliques',data:ovDays.map(d=>d.clicks),color:'#4285F4',yAxisID:'l'},{type:'line',label:'Sessões',data:ovDays.map(d=>d.sessions),color:'#10B981',yAxisID:'r'}]));
            const c6=document.getElementById('ch-ov-dlead');if(c6)inst.push(mkBar(C,c6,lbs,ovDays.map(d=>d.leads),'#10B981','Leads',fmtN));
          }
          return ()=>inst.forEach(i=>{try{i.destroy();}catch(e){}});
        },[dailyTab]);
        return (
          <div className="space-y-5">
            <DraggableKPIGrid storageKey="traffic-overview" items={kpis} renderItem={k=><KPI {...k}/>}/>
