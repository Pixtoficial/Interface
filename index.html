              </div>
              <Field label="Hora" value={form.time} onChange={v => setForm(f => ({...f, time:v}))} />
            </div>
            <div>
              <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Origem</label>
              <select value={form.source} onChange={e => setForm(f => ({...f, source:e.target.value}))} className="w-full px-3 py-2.5 border rounded-lg outline-none">
                <option value="ai">IA (Booked)</option><option value="human">Pessoal</option>
              </select>
            </div>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border font-bold text-sm">Cancelar</button>
              <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#c6f432] text-black font-bold text-sm">Criar</button>
            </div>
          </form>
        </div>
      );
    };

    /* =========================================================
       RAG TAB — com editor de conteúdo para o agente IA
       ========================================================= */
    const RagTab = ({ agent }) => {
      const [docs, setDocs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [editDoc, setEditDoc] = useState(null);   // { id?, filename, content, size_kb, isNew }
      const fileRef = useRef(null);
      const toast = useToast();

      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api(`/rag?agent=${agent.slug}`); setDocs(d.documents); }
        catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agent.slug, toast]);
      useEffect(() => { load(); }, [load]);

      const remove = async (id) => {
        if (!confirm('Excluir documento?')) return;
        try { await api(`/rag/${id}`, { method: 'DELETE' }); setDocs(d => d.filter(x => x.id !== id)); }
        catch (e) { toast(e.message, 'error'); }
      };

      const saveDoc = async ({ id, filename, content, size_kb, isNew }) => {
        try {
          if (isNew) {
            const r = await api('/rag', { method: 'POST', body: JSON.stringify({ agent_slug: agent.slug, filename, size_kb: size_kb || Math.ceil((content||'').length / 1024), content }) });
            setDocs(d => [r.document, ...d]);
            toast('Documento criado!', 'success');
          } else {
            const r = await api(`/rag/${id}`, { method: 'PATCH', body: JSON.stringify({ filename, content }) });
            setDocs(d => d.map(x => x.id === id ? r.document : x));
            toast('Documento salvo!', 'success');
          }
          setEditDoc(null);
        } catch (e) { toast(e.message, 'error'); }
      };

      const onPickFile = (file) => {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (['txt', 'md', 'csv', 'json'].includes(ext)) {
          const reader = new FileReader();
          reader.onload = (ev) => setEditDoc({ isNew: true, filename: file.name, content: ev.target.result, size_kb: Math.ceil(file.size/1024) });
          reader.readAsText(file);
        } else {
          // PDF e outros: abre modal para colar conteúdo
          setEditDoc({ isNew: true, filename: file.name, content: '', size_kb: Math.ceil(file.size/1024) });
          toast('Para PDF, cole o conteúdo extraído na área de texto.', 'info');
        }
      };

      if (loading) return <Loading />;

      return (
        <div className="animate-in fade-in duration-500 space-y-6 shrink-0">
          <div className="bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 shadow-sm p-6">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-purple-100 text-purple-700 rounded-lg"><Database size={20} /></div>
                <div><h2 className="text-xl font-bold">Base de Conhecimento RAG</h2><p className="text-sm text-gray-500">A IA usa estes documentos para responder com contexto da empresa.</p></div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setEditDoc({ isNew: true, filename: '', content: '', size_kb: 0 })} className="px-4 py-2 rounded-xl bg-black text-[#c6f432] font-bold text-sm flex items-center gap-2 hover:bg-gray-800 transition">
                  <Plus size={14} /> Novo Documento
                </button>
                <button onClick={() => fileRef.current?.click()} className="px-4 py-2 rounded-xl border border-gray-200 font-bold text-sm flex items-center gap-2 hover:bg-gray-50 transition">
                  <UploadCloud size={14} /> Subir Arquivo
                </button>
                <input ref={fileRef} type="file" className="hidden" accept=".txt,.md,.pdf,.csv" onChange={e => { onPickFile(e.target.files?.[0]); e.target.value=''; }} />
              </div>
            </div>
            <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl text-sm text-blue-700">
              <strong>Como funciona:</strong> Adicione documentos com o conteúdo da empresa (FAQs, preços, produtos, scripts de venda). A IA busca nesses documentos antes de responder no WhatsApp.
            </div>
          </div>

          <div className="bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-gray-200 flex items-center justify-between">
              <h2 className="font-bold text-lg">Documentos Indexados ({docs.length})</h2>
              <span className="text-xs text-gray-500 font-medium">{docs.filter(d => d.content).length} com conteúdo · {docs.filter(d => !d.content).length} sem conteúdo</span>
            </div>
            {docs.length === 0 ? (
              <div className="py-16 text-center text-gray-400">
                <Database size={32} className="mx-auto mb-2 opacity-40" />
                <p className="text-sm font-medium">Nenhum documento. Adicione conhecimento para a IA usar.</p>
              </div>
            ) : (
              <div className="divide-y divide-gray-100">
                {docs.map(d => (
                  <div key={d.id} className="flex items-center gap-4 px-6 py-4 hover:bg-gray-50/50 transition">
                    <div className={`p-2 rounded-lg shrink-0 ${d.content ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-600'}`}>
                      {d.content ? <FileCheck2 size={16}/> : <FileWarning size={16}/>}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm text-gray-900 truncate">{d.filename}</p>
                      <p className="text-xs text-gray-500 mt-0.5">
                        {d.content
                          ? `${d.content.length.toLocaleString()} chars · ${relTime(d.created_at)}`
                          : <span className="text-yellow-600 font-medium">Sem conteúdo — não será usado pela IA</span>}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button onClick={() => setEditDoc({ id: d.id, filename: d.filename, content: d.content || '', isNew: false })} className="px-3 py-1.5 text-xs font-bold border border-gray-200 rounded-lg hover:bg-gray-50 flex items-center gap-1 transition">
                        <Edit3 size={12} /> Editar
                      </button>
                      <button onClick={() => remove(d.id)} className="p-1.5 text-red-400 hover:bg-red-50 rounded-lg transition"><Trash2 size={14} /></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {editDoc && (
            <RagDocModal
              doc={editDoc}
              onClose={() => setEditDoc(null)}
              onSave={saveDoc}
            />
          )}
        </div>
      );
    };

    const RagDocModal = ({ doc, onClose, onSave }) => {
      const [filename, setFilename] = useState(doc.filename);
      const [content, setContent] = useState(doc.content || '');
      const [busy, setBusy] = useState(false);
      const fileRef = useRef(null);

      const handleFile = (file) => {
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (['txt', 'md', 'csv'].includes(ext)) {
          const reader = new FileReader();
          reader.onload = ev => { setContent(ev.target.result); if (!filename) setFilename(file.name); };
          reader.readAsText(file);
        }
      };

      const submit = async (e) => {
        e.preventDefault();
        if (!filename.trim()) return;
        setBusy(true);
        await onSave({ ...doc, filename: filename.trim(), content });
        setBusy(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl p-6 border border-gray-200 animate-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]">
            <div className="flex justify-between items-center mb-4 shrink-0">
              <h3 className="text-xl font-bold">{doc.isNew ? 'Novo Documento' : 'Editar Documento'}</h3>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg"><X size={18} /></button>
            </div>
            <form onSubmit={submit} className="flex flex-col flex-1 min-h-0 space-y-4">
              <div className="shrink-0">
                <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Nome do Documento</label>
                <input value={filename} onChange={e => setFilename(e.target.value)} className="w-full px-3 py-2.5 border rounded-lg outline-none focus:border-[#658210]" placeholder="FAQ da Empresa.txt" required />
              </div>
              <div className="flex-1 min-h-0 flex flex-col">
                <div className="flex items-center justify-between mb-1.5 shrink-0">
                  <label className="text-xs font-bold text-gray-500 uppercase">Conteúdo (texto que a IA vai ler)</label>
                  <button type="button" onClick={() => fileRef.current?.click()} className="text-xs font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1">
                    <UploadCloud size={12} /> Carregar .txt/.md
                  </button>
                  <input ref={fileRef} type="file" accept=".txt,.md,.csv" className="hidden" onChange={e => { handleFile(e.target.files?.[0]); e.target.value=''; }} />
                </div>
                <textarea
                  value={content}
                  onChange={e => setContent(e.target.value)}
                  className="flex-1 w-full px-3 py-2.5 border rounded-lg outline-none focus:border-[#658210] font-mono text-sm resize-none min-h-[300px]"
                  placeholder="Cole aqui o conteúdo do documento...&#10;&#10;Exemplo: FAQ, lista de preços, script de vendas, informações da empresa..."
                />
                <p className="text-[11px] text-gray-400 mt-1 shrink-0">{content.length.toLocaleString()} caracteres · ~{Math.ceil(content.length/4).toLocaleString()} tokens</p>
              </div>
              <div className="flex justify-end gap-2 pt-2 shrink-0">
                <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border font-bold text-sm">Cancelar</button>
                <button type="submit" disabled={busy || !filename.trim()} className="px-5 py-2.5 rounded-lg bg-[#c6f432] text-black font-bold text-sm flex items-center gap-2 disabled:opacity-60">
                  {busy ? <Loader2 size={14} className="animate-spin"/> : <Save size={14}/>} Salvar
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    /* =========================================================
       BUILDER TAB (Custom)
       ========================================================= */
    const BuilderTab = ({ primaryColor }) => {
      const [workflows, setWorkflows] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showNew, setShowNew] = useState(false);
      const toast = useToast();

      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api('/workflows'); setWorkflows(d.workflows); }
        catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [toast]);
      useEffect(() => { load(); }, [load]);

      const toggle = async (w) => {
        try { const r = await api(`/workflows/${w.id}`, { method: 'PATCH', body: JSON.stringify({ enabled: !w.enabled }) }); setWorkflows(ws => ws.map(x => x.id === w.id ? r.workflow : x)); }
        catch (e) { toast(e.message, 'error'); }
      };
      const run = async (w) => {
        try { const r = await api(`/workflows/${w.id}/run`, { method: 'POST' }); toast(`Execução ${r.execution.status === 'success' ? 'concluída' : 'falhou'}`, r.execution.status === 'success' ? 'success' : 'error'); }
        catch (e) { toast(e.message, 'error'); }
      };
      const remove = async (id) => {
        if (!confirm('Excluir workflow?')) return;
        try { await api(`/workflows/${id}`, { method: 'DELETE' }); setWorkflows(ws => ws.filter(w => w.id !== id)); }
        catch (e) { toast(e.message, 'error'); }
      };
      const create = async (data) => {
        try { const r = await api('/workflows', { method: 'POST', body: JSON.stringify(data) }); setWorkflows(ws => [...ws, r.workflow]); setShowNew(false); }
        catch (e) { toast(e.message, 'error'); }
      };

      if (loading) return <Loading />;

      return (
        <div className="animate-in fade-in duration-500 space-y-4 shrink-0">
          <div className="flex justify-between items-center">
            <p className="text-sm text-gray-500 font-medium">{workflows.length} workflows configurados.</p>
            <button onClick={() => setShowNew(true)} className="px-4 py-2 rounded-xl bg-black text-[#c6f432] font-bold text-sm flex items-center gap-2"><Plus size={14}/> Novo Workflow</button>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {workflows.map(w => (
              <div key={w.id} className="bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 p-6 shadow-sm">
                <div className="flex justify-between items-start mb-4">
                  <div>
                    <h3 className="text-lg font-bold text-gray-900">{w.name}</h3>
                    <p className="text-sm text-gray-500 mt-1">{w.description}</p>
                  </div>
                  <label className="relative inline-flex items-center cursor-pointer ml-4 shrink-0">
                    <input type="checkbox" className="sr-only peer" checked={!!w.enabled} onChange={() => toggle(w)} />
                    <div className="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#658210]"></div>
                  </label>
                </div>
                <div className="flex flex-wrap gap-2 mb-4">
                  {(w.steps || []).map((s, i) => (
                    <div key={i} className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-100 text-xs font-bold">
                      <span className="w-5 h-5 rounded bg-black text-[#c6f432] flex items-center justify-center text-[10px]">{i+1}</span>
                      <span className="text-gray-700">{s.name}</span>
                      {i < (w.steps||[]).length - 1 && <ArrowRight size={12} className="text-gray-400 ml-1" />}
                    </div>
                  ))}
                </div>
                <div className="flex gap-2 pt-3 border-t">
                  <button onClick={() => run(w)} className="flex-1 px-3 py-2 rounded-lg bg-[#c6f432] text-black font-bold text-sm flex items-center justify-center gap-2"><Play size={14}/> Executar</button>
                  <button onClick={() => remove(w.id)} className="px-3 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 font-bold text-sm"><Trash2 size={14}/></button>
                </div>
              </div>
            ))}
            {workflows.length === 0 && <Empty msg="Nenhum workflow configurado" />}
          </div>
          {showNew && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
              <NewWorkflowForm onClose={() => setShowNew(false)} onCreate={create} />
            </div>
          )}
        </div>
      );
    };

    const NewWorkflowForm = ({ onClose, onCreate }) => {
      const [form, setForm] = useState({ name:'', description:'', enabled:true, stepsRaw:'Trigger\nProcessar\nNotificar' });
      return (
        <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 border border-gray-200">
          <div className="flex justify-between items-center mb-4"><h3 className="text-xl font-bold">Novo Workflow</h3><button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-lg"><X size={18} /></button></div>
          <form onSubmit={(e) => {
            e.preventDefault();
            const steps = form.stepsRaw.split('\n').map(s => s.trim()).filter(Boolean).map(name => ({ name, type:'step' }));
            onCreate({ name: form.name, description: form.description, enabled: form.enabled, steps });
          }} className="space-y-3">
            <Field label="Nome" value={form.name} onChange={v => setForm(f => ({...f, name:v}))} required />
            <Field label="Descrição" value={form.description} onChange={v => setForm(f => ({...f, description:v}))} />
            <div>
              <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">Etapas (uma por linha)</label>
              <textarea value={form.stepsRaw} onChange={e => setForm(f => ({...f, stepsRaw:e.target.value}))} className="w-full px-3 py-2.5 border rounded-lg outline-none focus:border-[#658210] min-h-[100px]" />
            </div>
            <label className="flex items-center gap-2 text-sm text-gray-700 font-medium">
              <input type="checkbox" checked={form.enabled} onChange={e => setForm(f => ({...f, enabled:e.target.checked}))} /> Habilitar imediatamente
            </label>
            <div className="flex justify-end gap-2 pt-2">
              <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border font-bold text-sm">Cancelar</button>
              <button type="submit" className="px-5 py-2.5 rounded-lg bg-[#c6f432] text-black font-bold text-sm">Criar</button>
            </div>
          </form>
        </div>

    /* =========================================================
       LOGS TAB (Custom)
       ========================================================= */
    const LogsTab = () => {
      const [executions, setExecutions] = useState([]);
      const [loading, setLoading] = useState(true);
      const toast = useToast();
      const load = useCallback(async () => {
        setLoading(true);
        try { const d = await api('/workflows/all/executions'); setExecutions(d.executions); }

              <thead className="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[11px]"><tr><th className="px-6 py-4">Workflow</th><th className="px-6 py-4">Status</th><th className="px-6 py-4">Duração</th><th className="px-6 py-4">Quando</th><th className="px-6 py-4">Log</th></tr></thead>
