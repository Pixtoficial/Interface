      const [confirmDelete, setConfirmDelete] = useState(false);
      const [lead, setLead] = useState(initialLead);
      const [editing, setEditing] = useState(null); // 'phone' | 'email' | 'summary'
      const [editVal, setEditVal] = useState('');
      const [savingField, setSavingField] = useState(false);
      const toast = useToast();
      if (!lead) return null;
      const pc = primaryColor || '#c6f432';
      const fmtDate = (iso) => { if(!iso) return '—'; try { return new Date(iso.replace(' ','T')+'Z').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); } catch { return '—'; } };
      const startEdit = (field, value) => { setEditing(field); setEditVal(value || ''); };
      const saveField = async () => {
        if (savingField) return;
        setSavingField(true);
        const fieldMap = { phone: 'phone', email: 'email', summary: 'conversation_summary' };
        const key = fieldMap[editing];
        try {
          const { lead: updated } = await api(`/leads/${lead.id}`, { method: 'PATCH', body: JSON.stringify({ [key]: editVal }) });
          setLead(updated);
          setEditing(null);
        } catch (e) { toast(e.message, 'error'); } finally { setSavingField(false); }
      };
      const isLost = lead.stage === 'perdido' || lead.stage === 'lost';
      return createPortal(
        <>
          <div className="fixed inset-0 bg-black/30 backdrop-blur-[1px]" style={{zIndex:9998}} onClick={onClose}/>
          <div className="fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl border-l border-gray-200 overflow-y-auto flex flex-col" style={{zIndex:9999}}>

            <div className="flex items-center justify-between p-5 border-b border-gray-100 shrink-0" style={{backgroundColor:pc+'22'}}>
              <div>
                <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-0.5">Lead</p>
                <h2 className="text-xl font-black text-gray-900 leading-tight">{lead.name}</h2>
                <p className="text-sm text-gray-500 font-medium">{lead.company || '—'}</p>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-xl transition-colors shrink-0"><X size={20}/></button>

            {/* Content */}
            <div className="flex-1 p-5 space-y-4 overflow-y-auto">
              {/* Info grid — phone e email editáveis */}

                {/* Telefone editável */}
                <div className="p-3 bg-gray-50 rounded-xl border border-gray-100 group">

                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider">Telefone</p>
                    <button onClick={()=>startEdit('phone', lead.phone)} className="opacity-0 group-hover:opacity-100 transition-opacity p-0.5 hover:bg-gray-200 rounded">
                      <Edit3 size={9} className="text-gray-400"/>
                    </button>
                  </div>
                  {editing==='phone'
                    ? <div className="flex gap-1"><input autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveField();if(e.key==='Escape')setEditing(null);}} className="flex-1 text-xs border border-blue-300 rounded px-1.5 py-0.5 outline-none"/><button onClick={saveField} disabled={savingField} className="text-[9px] font-bold text-white bg-blue-500 px-2 rounded">{savingField?'…':'OK'}</button></div>
                    : <p className="font-bold text-sm text-gray-800 truncate">{lead.phone || <span className="text-gray-300 font-normal italic">não informado</span>}</p>
                  }
                </div>
                {/* E-mail editável */}
                <div className="p-3 bg-gray-50 rounded-xl border border-gray-100 group">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider">E-mail</p>
                    <button onClick={()=>startEdit('email', lead.email)} className="opacity-0 group-hover:opacity-100 transition-opacity p-0.5 hover:bg-gray-200 rounded">
                      <Edit3 size={9} className="text-gray-400"/>
                    </button>
                  </div>
                  {editing==='email'
                    ? <div className="flex gap-1"><input autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveField();if(e.key==='Escape')setEditing(null);}} className="flex-1 text-xs border border-blue-300 rounded px-1.5 py-0.5 outline-none"/><button onClick={saveField} disabled={savingField} className="text-[9px] font-bold text-white bg-blue-500 px-2 rounded">{savingField?'…':'OK'}</button></div>
                    : <p className="font-bold text-sm text-gray-800 truncate">{lead.email || <span className="text-gray-300 font-normal italic">não informado</span>}</p>
                  }
                </div>
                {[
                  {l:'Score',    v: lead.score||0},
                  {l:'Valor',    v: Number(lead.amount)>0?`R$ ${Number(lead.amount).toLocaleString('pt-BR')}`:'—'},
                  {l:'Origem',   v: lead.source||'Orgânico'},
                  {l:'Criado em',v: fmtDate(lead.created_at)},
                ].map(({l,v})=>(
                  <div key={l} className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">{l}</p>
                    <p className="font-bold text-sm text-gray-800 truncate">{v}</p>
                  </div>
                ))}
              </div>

              {/* Tag + Campanha/Orgânico */}
              <div className="flex gap-2 flex-wrap">
                {lead.tag && (
                  <span className="px-3 py-1.5 rounded-full text-xs font-bold bg-gray-100 text-gray-700">{lead.tag}</span>
                )}
                <span className={`px-3 py-1.5 rounded-full text-xs font-bold ${lead.source==='campanha'||lead.source==='campaign'?'bg-blue-100 text-blue-700':'bg-green-100 text-green-700'}`}>
                  {lead.source==='campanha'||lead.source==='campaign'?'📣 Campanha':'🌱 Orgânico'}
                </span>
              </div>

              {/* Motivo de perda */}
              {isLost && (
                <div className="p-3.5 bg-red-50 border border-red-100 rounded-xl">
                  <p className="text-[9px] font-bold text-red-400 uppercase tracking-wider mb-1.5">Motivo de Perda</p>
                  <p className="text-sm text-red-700 font-medium">{lead.loss_reason||'Não informado'}</p>
                </div>
              )}

              {/* Resumo da Conversa — editável */}
              <div className="border-2 border-blue-200 rounded-xl overflow-hidden">
                <div className="flex items-center justify-between px-3.5 py-2 bg-blue-500">
                  <p className="text-[10px] font-black text-white uppercase tracking-wider">💬 Resumo da Conversa</p>
                  <button onClick={()=>startEdit('summary', lead.conversation_summary)} className="p-0.5 hover:bg-white/20 rounded transition-colors" title="Editar resumo">
                    <Edit3 size={11} className="text-white"/>
                  </button>
                </div>
                <div className="p-3.5 bg-blue-50">
                  {editing==='summary' ? (
                    <div>
                      <textarea autoFocus value={editVal} onChange={e=>setEditVal(e.target.value)} rows={4}
                        className="w-full text-sm bg-transparent outline-none resize-none leading-relaxed text-gray-700 placeholder:text-gray-400"
                        placeholder="Escreva o resumo da conversa com este lead..."/>
                      <div className="flex gap-2 mt-2">
                        <button onClick={saveField} disabled={savingField} className="px-3 py-1 rounded-lg text-xs font-bold text-black" style={{backgroundColor:pc}}>{savingField?'Salvando…':'Salvar'}</button>
                        <button onClick={()=>setEditing(null)} className="px-3 py-1 rounded-lg text-xs font-bold border border-gray-200 text-gray-500">Cancelar</button>
                      </div>
                    </div>
                  ) : (
                    <p className="text-sm text-gray-700 leading-relaxed">{lead.conversation_summary || <span className="text-gray-400 italic">Sem resumo. Clique em ✎ para adicionar.</span>}</p>
                  )}
                </div>
              </div>

              {/* Nota do lead */}
              {lead.notes && (
                <div className="p-3.5 bg-yellow-50 border border-yellow-100 rounded-xl">
                  <p className="text-[9px] font-bold text-yellow-600 uppercase tracking-wider mb-1.5">📝 Nota do Lead</p>
                  <p className="text-sm text-gray-700 italic leading-relaxed">{lead.notes}</p>
                </div>
              )}

              {/* Agente */}
              {lead.agent_slug && (
                <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Agente</p>
                  <p className="font-bold text-sm text-gray-800">{({vendas:'Vendas+',leadflow:'Lead Flow',booker:'Booker','pixt-bdr':'PIXT BDR',custom:'Custom'})[lead.agent_slug]||lead.agent_slug}</p>
                </div>
              )}
            </div>

            {/* Footer — delete */}
            <div className="p-5 border-t border-gray-100 shrink-0">
              {confirmDelete ? (
                <div className="flex gap-2">
                  <button onClick={()=>{onDelete(lead.id);onClose();setConfirmDelete(false);}}
                    className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-sm hover:bg-red-600 transition-colors">
                    Confirmar Exclusão
                  </button>
                  <button onClick={()=>setConfirmDelete(false)} className="px-4 py-3 border border-gray-200 rounded-xl font-bold text-sm text-gray-600 hover:bg-gray-50">
                    Cancelar
                  </button>
                </div>
              ) : (
                <button onClick={()=>setConfirmDelete(true)}
                  className="w-full py-3 border border-red-200 text-red-500 rounded-xl font-bold text-sm hover:bg-red-50 flex items-center justify-center gap-2 transition-colors">
                  <Trash2 size={14}/> Excluir Lead
                </button>
              )}
            </div>
          </div>
        </>,
        document.body
      );
    };

    const WaIcon = () => (
      <svg viewBox="0 0 24 24" className="w-3 h-3" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </svg>
    );

    const FlatPipelineCard = ({ lead, stages, isDragging, onDragStart, onDragEnd, onRemove, onEdit, onClickCard, onMoveToStage }) => {
      const badge = { blue:'bg-blue-100 text-blue-700', orange:'bg-orange-100 text-orange-700', green:'bg-green-100 text-green-700', red:'bg-red-100 text-red-700', yellow:'bg-yellow-100 text-yellow-700', default:'bg-gray-100 text-gray-600' };
      const [expanded, setExpanded] = useState(false);
      const [dragging, setDragging] = useState(false);
      const [showStageDrop, setShowStageDrop] = useState(false);
      const [dropPos, setDropPos] = useState(null);
      const pillRef = useRef(null);

      const dropRef = useRef(null);

      /* Fecha o dropdown ao clicar fora ou ao scrollar a pipeline */
      useEffect(() => {
        if (!showStageDrop) return;
        const close = (e) => {
          if (dropRef.current && dropRef.current.contains(e.target)) return;
          if (pillRef.current && pillRef.current.contains(e.target)) return;
          setShowStageDrop(false);
        };
        const closeScroll = () => setShowStageDrop(false);
        document.addEventListener('mousedown', close);
        document.addEventListener('scroll', closeScroll, true);
        return () => {
          document.removeEventListener('mousedown', close);
          document.removeEventListener('scroll', closeScroll, true);
        };
      }, [showStageDrop]);

      const openDrop = (e) => {
        e.stopPropagation();
        if (!stages || !stages.length) return;
        if (showStageDrop) { setShowStageDrop(false); return; }
        const rect = pillRef.current?.getBoundingClientRect();
        if (!rect) return;
        /* Decide abrir abaixo ou acima dependendo do espaço disponível */
        const spaceBelow = window.innerHeight - rect.bottom;
        const dropH = stages.length * 36 + 40; // estimativa de altura
        const openAbove = spaceBelow < dropH && rect.top > dropH;
        setDropPos({
          left: rect.left,
          top: openAbove ? rect.top - dropH - 4 : rect.bottom + 4,
        });
        setShowStageDrop(true);
      };

      const fmtFullDate = (iso) => {
        if (!iso) return '';
        try { return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
        catch { return ''; }
      };

      const currentStage = stages?.find(s => s.id === lead.stage);
      const hasContacts = lead.phone || lead.email;

      return (
        <>
          <div
            draggable
            onDragStart={()=>{setDragging(true);onDragStart&&onDragStart();}}
            onDragEnd={()=>{setDragging(false);onDragEnd&&onDragEnd();}}
            onClick={()=>{ if(!dragging && onClickCard) onClickCard(); }}
            className={`group bg-white border border-gray-100 rounded-xl shadow-sm hover:border-gray-200 hover:shadow-md transition-all cursor-pointer ${isDragging ? 'opacity-30' : ''}`}>
            <div className="p-3">

              {/* Nome + empresa + ações */}
              <div className="flex justify-between items-start mb-1.5">
                <div className="flex-1 min-w-0">
                  <p className="font-bold text-sm text-gray-900 truncate leading-tight">{lead.name}</p>
                  <p className="text-[10px] text-gray-400 font-medium truncate">{lead.company || '—'}</p>
                </div>
                <div className="flex items-center gap-1 ml-1 opacity-0 group-hover:opacity-100 transition shrink-0">
                  <button onMouseDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onEdit();}} className="p-1 hover:bg-gray-100 rounded"><Edit3 size={10} className="text-gray-500"/></button>
                  <button onMouseDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onRemove();}} className="p-1 hover:bg-red-50 rounded"><Trash2 size={10} className="text-red-400"/></button>
                </div>
              </div>

              {/* Valor / Score + Data */}
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-gray-900">{Number(lead.amount)>0?`R$ ${Number(lead.amount).toLocaleString('pt-BR')}`:`Score: ${lead.score||0}`}</span>
                <span className="text-[10px] text-gray-400">{fmtFullDate(lead.created_at)||relTime(lead.created_at)}</span>
              </div>

              {/* Seletor de etapa — pill colorido (sozinho na linha) */}
              <div className="mb-2">
                <button
                  ref={pillRef}
                  onMouseDown={e=>e.stopPropagation()}
                  onClick={openDrop}
                  className="inline-flex items-center gap-1 px-2 py-[3px] rounded-md border text-[10px] font-bold transition-all hover:brightness-95 active:scale-95 max-w-full"
                  style={{
                    backgroundColor: currentStage ? (STAGE_HEADER_BG[currentStage.color]||'#6b7280')+'22' : '#f3f4f6',
                    borderColor:     currentStage ? (STAGE_HEADER_BG[currentStage.color]||'#6b7280')+'55' : '#e5e7eb',
                    color:           currentStage ? (STAGE_HEADER_BG[currentStage.color]||'#6b7280') : '#6b7280',
                  }}>
                  <div className="w-1.5 h-1.5 rounded-full shrink-0"
                    style={{backgroundColor: currentStage ? STAGE_HEADER_BG[currentStage.color]||'#9ca3af' : '#9ca3af'}}/>
                  <span className="truncate max-w-[120px]">{currentStage?.title || lead.stage}</span>
                  {stages && stages.length > 0 &&
                    <ChevronDown size={9} className={`shrink-0 transition-transform ${showStageDrop?'rotate-180':''}`}/>}
                </button>
              </div>

              {/* Tag + notas */}
              <div className="flex items-center justify-between">
                <span className={`text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wide ${badge[lead.color_type]||badge.default}`}>{lead.tag||'—'}</span>
                {(lead.notes||lead.conversation_summary) && (
                  <button onClick={e=>{e.stopPropagation();setExpanded(v=>!v);}} className="text-[9px] text-gray-400 hover:text-gray-600 font-bold flex items-center gap-0.5">
                    💬 {expanded?'▲':'▼'}
                  </button>
                )}
              </div>
              {expanded && (lead.notes||lead.conversation_summary) && (
                <div className="mt-2 p-2 bg-blue-50 border border-blue-100 rounded-lg">
                  <p className="text-[9px] font-bold text-blue-500 uppercase tracking-wider mb-1">Resumo</p>
                  <p className="text-[10px] text-gray-600 leading-relaxed">{lead.conversation_summary || lead.notes}</p>
                </div>
              )}

              {/* Ícones de contato — rodapé do card */}
              {hasContacts && (
                <div className="flex items-center gap-2 mt-2 pt-2 border-t border-gray-50">
                  {lead.phone && (
                    <a href={`tel:${lead.phone}`} onClick={e=>e.stopPropagation()} title={lead.phone}
                      className="flex items-center gap-1 text-[10px] font-medium text-gray-400 hover:text-green-600 transition-colors">
                      <Phone size={11}/> <span className="truncate max-w-[70px]">{lead.phone}</span>
                    </a>
                  )}
                  {lead.email && (
                    <a href={`mailto:${lead.email}`} onClick={e=>e.stopPropagation()} title={lead.email}
                      className="flex items-center gap-1 text-[10px] font-medium text-gray-400 hover:text-blue-500 transition-colors min-w-0">
                      <Mail size={11}/> <span className="truncate max-w-[70px]">{lead.email}</span>
                    </a>
                  )}
                  {lead.phone && (
                    <a href={`https://wa.me/${lead.phone.replace(/\D/g,'')}`} target="_blank" rel="noreferrer"
                      onClick={e=>e.stopPropagation()} title={`WhatsApp: ${lead.phone}`}
                      className="ml-auto text-gray-400 hover:text-[#25D366] transition-colors shrink-0">
                      <WaIcon/>
                    </a>
                  )}
                </div>
              )}

            </div>
          </div>

          {/* Dropdown de etapa via portal — nunca clippado pela coluna */}
          {showStageDrop && dropPos && stages && createPortal(
            <div
              ref={dropRef}
              style={{position:'fixed', left:dropPos.left, top:dropPos.top, zIndex:9999, minWidth:180}}
              className="bg-white rounded-xl shadow-2xl border border-gray-100 py-1.5 animate-in fade-in zoom-in-95 duration-100"
              onMouseDown={e=>e.stopPropagation()}
              onClick={e=>e.stopPropagation()}>
              <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider px-3 pt-0.5 pb-1.5 border-b border-gray-100">
                Mover para etapa
              </p>
              {stages.map(s => {
                const active = s.id === lead.stage;
                const hex = STAGE_HEADER_BG[s.color] || '#9ca3af';
                return (
                  <button key={s.id}
                    onClick={e=>{e.stopPropagation();onMoveToStage&&onMoveToStage(s.id);setShowStageDrop(false);}}
                    className="w-full text-left px-3 py-1.5 flex items-center gap-2 transition-colors hover:bg-gray-50"
                    style={{backgroundColor: active ? hex+'14' : undefined}}>
                    <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{backgroundColor: hex}}/>
                    <span className={`flex-1 text-[11px] font-bold truncate ${active ? 'text-gray-900' : 'text-gray-600'}`}>
                      {s.title}
                    </span>
                    {active && <CheckCircle2 size={9} className="shrink-0" style={{color: hex}}/>}
                  </button>
                );
              })}
            </div>,
            document.body
          )}
        </>
      );
    };

    const PipelineCard = ({ lead, isDragging, onDragStart, onDragEnd, onRemove, onEdit }) => {
      const badge = { blue:'bg-blue-100 text-blue-700', orange:'bg-orange-100 text-orange-700', green:'bg-green-100 text-green-700', red:'bg-red-100 text-red-700', yellow:'bg-yellow-100 text-yellow-700', default:'bg-gray-100 text-gray-600' };
      const [showNotes, setShowNotes] = useState(false);
      return (
        <div
          draggable
          onDragStart={onDragStart}
          onDragEnd={onDragEnd}
          className={`group bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 hover:border-gray-300 transition-all cursor-grab active:cursor-grabbing shrink-0 ${isDragging ? 'dragging' : ''}`}>
          <div className="flex justify-between items-start mb-2 shrink-0">
            <div className="flex-1 min-w-0">
              <p className="font-bold text-sm leading-tight text-gray-900 truncate">{lead.name}</p>
              <p className="text-[10px] text-gray-400 font-medium mt-0.5 truncate">{lead.company || '—'}</p>
            </div>
            <div className="flex items-center gap-1 ml-2 opacity-0 group-hover:opacity-100 transition shrink-0">
              <button onMouseDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onEdit();}} className="p-1 hover:bg-gray-100 rounded transition"><Edit3 size={11} className="text-gray-500"/></button>
              <button onMouseDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onRemove();}} className="p-1 hover:bg-red-50 rounded transition"><Trash2 size={11} className="text-red-400"/></button>
            </div>
          </div>
          <div className="flex items-center justify-between mb-2 shrink-0">
            <span className="text-xs font-bold text-gray-900">{Number(lead.amount)>0?`R$ ${Number(lead.amount).toLocaleString('pt-BR')}`:`Score: ${lead.score}`}</span>
            <span className="text-[10px] text-gray-400 font-medium">{relTime(lead.created_at)}</span>
          </div>
          <div className="flex items-center justify-between mb-1 shrink-0">
            <span className={`inline-block px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider ${badge[lead.color_type]||badge.default}`}>{lead.tag||'—'}</span>
            {lead.notes && (
              <button onClick={e=>{e.stopPropagation();setShowNotes(v=>!v);}} className="text-[9px] text-blue-500 hover:text-blue-700 font-bold">

              </button>

          </div>
          {showNotes && lead.notes && (

    function relTime(iso) {
      if (!iso) return '';
      const d = new Date(iso.replace(' ', 'T') + (iso.includes('Z') ? '' : 'Z'));
      const diff = (Date.now() - d.getTime()) / 1000;
      if (isNaN(diff)) return iso;
      if (diff < 60) return 'agora';
      if (diff < 3600) return `${Math.floor(diff/60)}m`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h`;
      return d.toLocaleDateString('pt-BR');

          {/* MRR Hero */}

    /* ── Gestão de Tarefas — Ekyte+Notion Hybrid ── */

       TASK MANAGEMENT — constants, helpers, components
       ========================================================= */
    const TASK_STAGES = [
      { id: 'briefing',  label: 'Briefing',  color: '#6366f1', colBg: 'bg-indigo-50/40 border-indigo-200' },
      { id: 'redacao',   label: 'Redação',   color: '#3b82f6', colBg: 'bg-blue-50/40 border-blue-200'     },
      { id: 'design',    label: 'Design',    color: '#8b5cf6', colBg: 'bg-violet-50/40 border-violet-200' },

      { id: 'aprovacao', label: 'Aprovação', color: '#f97316', colBg: 'bg-orange-50/40 border-orange-200' },
      { id: 'concluido', label: 'Concluído', color: '#22c55e', colBg: 'bg-green-50/40 border-green-200'   },

    const TASK_PRIORITIES = [
      { id: 'urgente',        label: 'Urgente',        bar: '#ef4444', badge: 'bg-red-100 text-red-700'       },
      { id: 'alta',           label: 'Alta',           bar: '#f97316', badge: 'bg-orange-100 text-orange-700' },
      { id: 'media',          label: 'Média',          bar: '#f59e0b', badge: 'bg-yellow-100 text-yellow-700' },
      { id: 'baixa',          label: 'Baixa',          bar: '#3b82f6', badge: 'bg-blue-100 text-blue-700'     },
      { id: 'nao_priorizada', label: 'Sem Prioridade', bar: '#9ca3af', badge: 'bg-gray-100 text-gray-500'     },
    ];
    const PICKER_COLORS = ['#6366f1','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f59e0b','#ef4444','#22c55e','#f97316','#64748b'];

    const getTaskPriority = (id) => {
      try { const s = localStorage.getItem('pixt_task_priorities'); if (s) { const ps = JSON.parse(s); const f = ps.find(p=>p.id===id); if(f) return f; } } catch {}
      return TASK_PRIORITIES.find(p => p.id === id) || TASK_PRIORITIES[2];
    };
    const getTaskStage = (id) => {
      try { const s = localStorage.getItem('pixt_task_stages'); if (s) { const ss = JSON.parse(s); const f = ss.find(s=>s.id===id); if(f) return f; } } catch {}
      return TASK_STAGES.find(s => s.id === id) || TASK_STAGES[0];
    };

    const deadlineBadge = (due_date) => {
      if (!due_date) return null;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(due_date + 'T00:00:00');
      const diff = Math.round((due - today) / 86400000);
      if (diff < 0)   return { label: `Há ${Math.abs(diff)}d`, cls: 'bg-red-500 text-white' };
      if (diff === 0) return { label: 'Hoje',                   cls: 'bg-orange-500 text-white' };
      if (diff === 1) return { label: 'Amanhã',                 cls: 'bg-lime-500 text-white' };
      return               { label: `Em ${diff}d`,             cls: 'bg-green-500 text-white' };
    };

    const fmtMins = (m) => {
      if (!m) return null;
      const h = Math.floor(m / 60), min = m % 60;
      if (!h) return `${min}min`;
      return min ? `${h}h${min}` : `${h}h`;
    };

    const taskInitials = (name) => name ? name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) : '??';

    const TColorPicker = ({ value, onChange }) => (
      <div className="flex gap-1.5 flex-wrap">
        {PICKER_COLORS.map(c => (
          <button key={c} type="button" onClick={() => onChange(c)}
            className={`w-5 h-5 rounded-full transition-all ${value === c ? 'ring-2 ring-offset-1 ring-gray-500 scale-110' : 'hover:scale-110'}`}
            style={{ backgroundColor: c }} />
        ))}
      </div>
    );

    /* TaskCard — card individual do Kanban */
    const TaskCard = ({ task, tags, executors, isLast, isExecutor, onDelete, onAdvance, onExecutorComplete, onDetail, dragTask, setDragTask, primaryColor }) => {
      const prio     = getTaskPriority(task.priority);
      const dl       = deadlineBadge(task.due_date);
      const est      = fmtMins(task.estimated_minutes);
      const taskTags = Array.isArray(task.tag_ids) ? task.tag_ids.map(id => tags.find(t => t.id === id)).filter(Boolean) : [];
      const exec     = executors ? executors.find(e => e.name === task.executor_name) : null;
      return (
        <div
          draggable={!isExecutor}
          onDragStart={isExecutor ? undefined : () => setDragTask(task.id)}
          onDragEnd={isExecutor ? undefined : () => setDragTask(null)}
          onClick={() => onDetail(task)}
          className={`bg-white border border-gray-100 rounded-xl shadow-sm ${isExecutor ? 'cursor-pointer' : 'cursor-grab active:cursor-grabbing'} group hover:border-gray-300 hover:shadow-md transition-all overflow-hidden ${dragTask === task.id ? 'opacity-30' : ''}`}>
          <div className="h-1" style={{ backgroundColor: prio.bar }}></div>
          <div className="p-3">
            <div className="flex items-center justify-between mb-1.5">
              <span className={`text-[9px] font-black px-1.5 py-0.5 rounded ${prio.badge}`}>{prio.label}</span>
              {!isExecutor && (
                <button onClick={e => { e.stopPropagation(); onDelete(task.id); }}
                  className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition-all">
                  <X size={11} />
                </button>
              )}
            </div>
            <p className="font-bold text-sm text-gray-900 leading-tight mb-1.5 line-clamp-2">{task.title}</p>
            {task.client_name && (
              <span className="inline-block text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-blue-50 text-blue-700 border border-blue-100 mb-2">{task.client_name}</span>
            )}
            <div className="flex flex-wrap gap-1 mb-2.5">
              {est && (
                <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-gray-100 text-gray-600 flex items-center gap-1">
                  <Clock size={9} />{est}
                </span>
              )}
              {dl && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${dl.cls}`}>{dl.label}</span>}
            </div>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-1.5">
                {task.executor_name ? (
                  <div className="w-5 h-5 rounded-full overflow-hidden flex items-center justify-center text-[8px] font-black text-white shrink-0"
                    style={exec?.photo_url ? {} : { backgroundColor: exec?.color_hex || primaryColor }}>
                    {exec?.photo_url
                      ? <img src={exec.photo_url} className="w-full h-full object-cover" />
                      : taskInitials(task.executor_name)}
                  </div>
                ) : (
                  <div className="w-5 h-5 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center">
                    <span className="text-[8px] text-gray-300">+</span>
                  </div>
                )}
                {taskTags.slice(0, 3).map(tag => (
                  <div key={tag.id} className="w-4 h-4 rounded-sm flex items-center justify-center text-[7px] font-black text-white shrink-0"
                    style={{ backgroundColor: tag.color_hex }}>{tag.name.slice(0, 2).toUpperCase()}</div>
                ))}
                {taskTags.length > 3 && <span className="text-[9px] text-gray-400">+{taskTags.length - 3}</span>}
              </div>
              {isExecutor ? (
                <button onClick={e => { e.stopPropagation(); onExecutorComplete(task); }}
                  className="text-[9px] font-bold px-2 py-1 rounded-lg text-black transition-all flex items-center gap-0.5 hover:opacity-80"
                  style={{ backgroundColor: primaryColor }}>
                  <CheckCircle2 size={9}/> Concluir
                </button>
              ) : !isLast ? (
                <button onClick={e => { e.stopPropagation(); onAdvance(task); }}
                  className="text-[9px] font-bold px-2 py-1 rounded-lg bg-gray-900 text-white hover:bg-gray-700 transition-all flex items-center gap-0.5">
                  <ArrowRight size={9} /> Avançar
                </button>
              ) : (
                <span className="text-[9px] font-bold px-2 py-0.5 rounded-full bg-green-100 text-green-700 flex items-center gap-0.5">
                  <CheckCircle2 size={9} /> Concluído
                </span>
              )}
            </div>
          </div>
        </div>
      );
    };

    /* KanbanView — flat/seamless (estilo pipeline de vendas) */
    const KanbanView = ({ tasks, stages, tags, executors, dragTask, setDragTask, isOver, setIsOver, onDrop, onDelete, onAdvance, onExecutorComplete, onDetail, primaryColor, isExecutor }) => (
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm flex-1 overflow-hidden" style={{ minHeight: 0 }}>
        {/* Single scroll wrapper — keeps headers + cards in sync horizontally */}
        <div style={{ overflowX: 'auto', height: '100%', display: 'flex', flexDirection: 'column' }}>
          {/* Stage headers */}
          <div className="flex border-b border-gray-100 shrink-0" style={{ minWidth: stages.length * 264 }}>
            {stages.map(stage => {
              const col = tasks.filter(t => t.current_stage === stage.id);
              return (
                <div key={stage.id} className="flex-none border-r border-black/5"
                  style={{ width: 264, backgroundColor: stage.color || '#6b7280' }}>
                  <div className="flex items-center justify-between px-3 py-3">
                    <h3 className="font-bold text-white text-sm">{stage.label}</h3>
                    <span className="text-xs font-bold px-1.5 py-0.5 rounded-full bg-white/25 text-white">{col.length}</span>
                  </div>
                </div>
              );
            })}
          </div>
          {/* Cards area — only vertical scroll here */}
          <div className="flex flex-1 overflow-y-auto" style={{ minWidth: stages.length * 264, minHeight: 300 }}>
            {stages.map((stage, idx) => {
              const col = tasks.filter(t => t.current_stage === stage.id);
              return (
                <div key={stage.id}
                  onDragOver={e => { e.preventDefault(); setIsOver(stage.id); }}
                  onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setIsOver(null); }}
                  onDrop={e => { e.preventDefault(); if (dragTask) onDrop(dragTask, stage.id); setIsOver(null); setDragTask(null); }}
                  className="flex-none border-r border-gray-100 p-2.5 space-y-2 transition-all duration-200"
                  style={{ width: 264, minHeight: 300,
                    backgroundColor: isOver === stage.id ? stage.color + '15' : 'white',
                    boxShadow: isOver === stage.id ? `inset 0 0 0 2px ${stage.color}` : 'none',
                    borderRadius: isOver === stage.id ? '12px' : undefined }}>
                  {isOver === stage.id && (
                    <div className="flex items-center justify-center gap-1.5 py-3 rounded-xl border-2 border-dashed transition-all"
                      style={{ borderColor: stage.color, color: stage.color }}>
                      <ArrowRight size={13}/>
                      <span className="text-xs font-black">Soltar aqui</span>
                    </div>
                  )}
                  {col.map(task => (
                    <TaskCard key={task.id} task={task} tags={tags} executors={executors}
                      isLast={false} isExecutor={isExecutor}
                      onDelete={onDelete} onAdvance={onAdvance} onExecutorComplete={onExecutorComplete} onDetail={onDetail}
                      dragTask={dragTask} setDragTask={setDragTask} primaryColor={primaryColor} />
                  ))}
                  {col.length === 0 && isOver !== stage.id && (
                    <div className="text-center py-8 text-[11px] text-gray-300 font-medium">Sem tarefas</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );

    /* TableView */
    const TableView = ({ tasks, stages, squads, tags, executors, groupBy, editingCell, setEditingCell, onInlineUpdate, onDelete, onAdvance, primaryColor }) => {
      const [collapsed, setCollapsed] = useState({});
      const groups = {};
      tasks.forEach(t => {
        let key = '';
        if (groupBy === 'client_name')  key = t.client_name || '(Sem cliente)';
        else if (groupBy === 'squad_id') key = squads.find(s => s.id === t.squad_id)?.name || '(Sem squad)';
        else if (groupBy === 'priority') key = getTaskPriority(t.priority).label;
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
      });
      return (
        <div className="flex-1 overflow-auto bg-white/70 border border-gray-200 rounded-2xl shadow-sm" style={{ minHeight: 0 }}>
          <table className="w-full text-sm">
            <thead className="sticky top-0 bg-gray-50 border-b border-gray-200 z-10">
              <tr>
                {['Tarefa', 'Estágio', 'Executor', 'Prazo', 'Prioridade', 'Tags', 'Tempo', ''].map((h, i) => (
                  <th key={i} className="px-4 py-3 text-left text-[11px] font-bold text-gray-400 uppercase tracking-wider whitespace-nowrap">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {Object.entries(groups).map(([gName, gTasks]) => (
                <React.Fragment key={gName}>
                  <tr className="bg-gray-50/80 border-b border-gray-100 cursor-pointer hover:bg-gray-100/80 transition-colors"
                    onClick={() => setCollapsed(c => ({ ...c, [gName]: !c[gName] }))}>
                    <td colSpan={8} className="px-4 py-2.5">
                      <div className="flex items-center gap-2">
                        <ChevronDown size={13} className={`text-gray-400 transition-transform ${collapsed[gName] ? '-rotate-90' : ''}`} />
                        <span className="font-bold text-gray-700 text-sm">{gName}</span>
                        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-gray-200 text-gray-500">{gTasks.length}</span>
                      </div>
                    </td>
                  </tr>
                  {!collapsed[gName] && gTasks.map(task => {
                    const prio  = getTaskPriority(task.priority);
                    const stage = getTaskStage(task.current_stage);
                    const dl    = deadlineBadge(task.due_date);
                    const est   = fmtMins(task.estimated_minutes);
                    const tTags = Array.isArray(task.tag_ids) ? task.tag_ids.map(id => tags.find(t => t.id === id)).filter(Boolean) : [];
                    const isEd  = (field) => editingCell?.taskId === task.id && editingCell?.field === field;
                    return (
                      <tr key={task.id} className="border-b border-gray-100 hover:bg-gray-50/50 transition-colors group">
                        <td className="px-4 py-2.5">
                          <div className="flex items-center gap-2">
                            <div className="w-1 h-7 rounded-full flex-shrink-0" style={{ backgroundColor: prio.bar }}></div>
                            <div className="min-w-[140px] max-w-[220px]">
                              {isEd('title') ? (
                                <input autoFocus defaultValue={task.title}
                                  onBlur={e => onInlineUpdate(task.id, 'title', e.target.value)}
                                  onKeyDown={e => { if (e.key === 'Enter') onInlineUpdate(task.id, 'title', e.target.value); if (e.key === 'Escape') setEditingCell(null); }}
                                  className="text-sm border border-blue-300 rounded px-2 py-1 outline-none w-full" />
                              ) : (
                                <span onClick={() => setEditingCell({ taskId: task.id, field: 'title' })}
                                  className="text-sm font-bold text-gray-900 cursor-pointer hover:bg-blue-50 px-1 py-0.5 rounded block truncate">{task.title}</span>
                              )}
                            </div>
                          </div>
                        </td>
                        <td className="px-4 py-2.5 whitespace-nowrap">
                          {isEd('current_stage') ? (
                            <select autoFocus value={task.current_stage}
                              onChange={e => onInlineUpdate(task.id, 'current_stage', e.target.value)}
                              onBlur={() => setEditingCell(null)}
                              className="text-xs border border-blue-300 rounded px-2 py-1 outline-none bg-white">
                              {TASK_STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                            </select>
                          ) : (
                            <span onClick={() => setEditingCell({ taskId: task.id, field: 'current_stage' })}
                              className="text-[10px] font-bold px-2 py-1 rounded-md cursor-pointer"
                              style={{ backgroundColor: stage.color + '22', color: stage.color }}>{stage.label}</span>
                          )}
                        </td>
                        <td className="px-4 py-2.5">
                          {isEd('executor_name') ? (
                            <input autoFocus defaultValue={task.executor_name || ''}
                              onBlur={e => onInlineUpdate(task.id, 'executor_name', e.target.value)}
                              onKeyDown={e => { if (e.key === 'Enter') onInlineUpdate(task.id, 'executor_name', e.target.value); if (e.key === 'Escape') setEditingCell(null); }}
                              className="text-xs border border-blue-300 rounded px-2 py-1 outline-none min-w-[100px]" />
                          ) : (
                            <div className="flex items-center gap-1.5 cursor-pointer hover:bg-blue-50 px-1 py-0.5 rounded"
                              onClick={() => setEditingCell({ taskId: task.id, field: 'executor_name' })}>
                              {task.executor_name ? (
                                (() => {
                                  const ex = executors ? executors.find(e => e.name === task.executor_name) : null;
                                  return (
                                    <>
                                      <div className="w-5 h-5 rounded-full overflow-hidden flex items-center justify-center text-[8px] font-black text-white shrink-0"
                                        style={ex?.photo_url ? {} : { backgroundColor: ex?.color_hex || primaryColor }}>
                                        {ex?.photo_url ? <img src={ex.photo_url} className="w-full h-full object-cover" /> : taskInitials(task.executor_name)}
                                      </div>
                                      <span className="text-xs text-gray-700 truncate max-w-[80px]">{task.executor_name}</span>
                                    </>
                                  );
                                })()
                              ) : <span className="text-gray-300 text-xs italic">—</span>}
                            </div>
                          )}
                        </td>
                        <td className="px-4 py-2.5 whitespace-nowrap">
                          {dl ? (
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${dl.cls}`}>{dl.label}</span>
                          ) : isEd('due_date') ? (
                            <input autoFocus type="date" defaultValue={task.due_date || ''}
                              onBlur={e => onInlineUpdate(task.id, 'due_date', e.target.value)}
                              className="text-xs border border-blue-300 rounded px-2 py-1 outline-none" />
                          ) : (
                            <span onClick={() => setEditingCell({ taskId: task.id, field: 'due_date' })}
                              className="text-xs text-gray-300 cursor-pointer hover:text-gray-500">Definir</span>
                          )}
                        </td>
                        <td className="px-4 py-2.5">
                          {isEd('priority') ? (
                            <select autoFocus value={task.priority}
                              onChange={e => onInlineUpdate(task.id, 'priority', e.target.value)}
                              onBlur={() => setEditingCell(null)}
                              className="text-[10px] border border-blue-300 rounded px-2 py-1 outline-none bg-white">
                              {TASK_PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                            </select>
                          ) : (
                            <span className={`text-[9px] font-black px-2 py-0.5 rounded cursor-pointer ${prio.badge}`}
                              onClick={() => setEditingCell({ taskId: task.id, field: 'priority' })}>{prio.label}</span>
                          )}
                        </td>
                        <td className="px-4 py-2.5">
                          <div className="flex gap-1">
                            {tTags.map(tag => (
                              <div key={tag.id} className="w-4 h-4 rounded-sm flex items-center justify-center text-[7px] font-black text-white"
                                style={{ backgroundColor: tag.color_hex }}>{tag.name.slice(0, 2).toUpperCase()}</div>
                            ))}
                          </div>
                        </td>
                        <td className="px-4 py-2.5 whitespace-nowrap">
                          <span className="text-[11px] font-mono text-gray-500">{est || '—'}</span>
                        </td>
                        <td className="px-4 py-2.5">
                          <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all">
                            {task.current_stage !== 'concluido' && (
                              <button onClick={() => onAdvance(task)}
                                className="text-[9px] font-bold px-2 py-1 rounded-lg bg-gray-900 text-white hover:bg-gray-700 transition-all">→</button>
                            )}
                            <button onClick={() => onDelete(task.id)}
                              className="text-[9px] font-bold px-2 py-1 rounded-lg bg-red-100 text-red-600 hover:bg-red-200 transition-all">✕</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </React.Fragment>
              ))}
              {tasks.length === 0 && (
                <tr><td colSpan={8} className="px-4 py-12 text-center text-gray-400 text-sm">Nenhuma tarefa encontrada</td></tr>
              )}
            </tbody>
          </table>
        </div>
      );
    };

    /* Modal: Executor Concluir/Passar tarefa */
    const ExecutorCompleteModal = ({ task, executors, onConfirm, onClose, primaryColor }) => {
      const trail = (() => { try { return JSON.parse(localStorage.getItem(`pixt_task_trail_${task.id}`) || '[]'); } catch { return []; } })();
      const curIdx = trail.findIndex(s => s.executor === task.executor_name);
      const nextTrailStep = trail[curIdx + 1] || null;
      const [nextExecutor, setNextExecutor] = useState(nextTrailStep ? nextTrailStep.executor : '');
      const [passForward, setPassForward] = useState(!!nextTrailStep);
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: primaryColor }}>
                <CheckCircle2 size={18} className="text-black"/>
              </div>
              <div>
                <h3 className="font-black text-gray-900">Tarefa Concluída!</h3>
                <p className="text-xs text-gray-400 truncate max-w-[200px]">{task.title}</p>
              </div>
              <button onClick={onClose} className="ml-auto text-gray-400 hover:text-gray-700"><X size={18}/></button>
            </div>
            {nextTrailStep && (
              <div className="mb-4 p-3 bg-indigo-50 border border-indigo-100 rounded-xl">
                <p className="text-[10px] font-bold text-indigo-500 uppercase tracking-wider mb-1">Próximo na trilha</p>
                <p className="font-bold text-sm text-indigo-900">{nextTrailStep.executor}</p>
                {nextTrailStep.role && <p className="text-xs text-indigo-500">{nextTrailStep.role}</p>}
              </div>
            )}
            <div className="mb-4">
              <label className="flex items-center gap-2 mb-3 cursor-pointer">
                <input type="checkbox" checked={passForward} onChange={e => setPassForward(e.target.checked)} className="rounded"/>
                <span className="text-sm font-bold text-gray-700">Passar para outro executor</span>
              </label>
              {passForward && (
                executors && executors.length > 0 ? (
                  <select value={nextExecutor} onChange={e => setNextExecutor(e.target.value)}
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none bg-white focus:border-indigo-400">
                    <option value="">Selecionar executor...</option>
                    {executors.map(ex => <option key={ex.id} value={ex.name}>{ex.name}{ex.role ? ` — ${ex.role}` : ''}</option>)}
                  </select>
                ) : (
                  <input value={nextExecutor} onChange={e => setNextExecutor(e.target.value)}
                    placeholder="Nome do próximo executor..."
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-400"/>
                )
              )}
            </div>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold hover:bg-gray-50">Cancelar</button>
              <button onClick={() => onConfirm(passForward ? nextExecutor : null)}
                className="flex-1 py-2.5 rounded-xl text-sm font-bold text-black hover:opacity-90"
                style={{ backgroundColor: primaryColor }}>
                {passForward ? 'Concluir & Passar →' : 'Finalizar'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    /* Modal: Avançar Etapa (Workflow Engine) */
    const AdvanceStageModal = ({ task, executors, onConfirm, onClose, primaryColor }) => {
      const curStage  = getTaskStage(task.current_stage);
      const liveStages = (() => { try { const s = localStorage.getItem('pixt_task_stages'); return s ? JSON.parse(s) : TASK_STAGES; } catch { return TASK_STAGES; } })();
      const curIdx    = liveStages.findIndex(s => s.id === task.current_stage);
      const nextStage = liveStages[curIdx + 1];
      const [executor, setExecutor] = useState('');
      if (!nextStage) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-black">Avançar Etapa</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-700"><X size={20} /></button>
            </div>
            <div className="flex items-center gap-3 mb-5 p-3 bg-gray-50 rounded-xl">
              <div className="text-center flex-1">
                <p className="text-[10px] font-bold text-gray-400 uppercase mb-1">ATUAL</p>
                <p className="font-black text-sm" style={{ color: curStage.color }}>{curStage.label}</p>
              </div>
              <ArrowRight size={16} className="text-gray-300 shrink-0" />
              <div className="text-center flex-1">
                <p className="text-[10px] font-bold text-gray-400 uppercase mb-1">PRÓXIMA</p>
                <p className="font-black text-sm" style={{ color: nextStage.color }}>{nextStage.label}</p>
              </div>
            </div>
            <p className="text-xs text-gray-500 mb-3 font-medium">
              Quem será o Executor na etapa <strong>{nextStage.label}</strong>?
            </p>
            {executors && executors.length > 0 ? (
              <select value={executor} onChange={e => setExecutor(e.target.value)} autoFocus
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none bg-white focus:border-blue-400 mb-3">
                <option value="">Selecionar executor...</option>
                {executors.map(ex => <option key={ex.id} value={ex.name}>{ex.name}{ex.role ? ` — ${ex.role}` : ''}</option>)}
              </select>
            ) : (
              <input value={executor} onChange={e => setExecutor(e.target.value)}
                placeholder="Nome do próximo executor..."
                className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400 mb-3"
                onKeyDown={e => e.key === 'Enter' && onConfirm(executor)}
                autoFocus />
            )}
            <p className="text-[11px] text-gray-400 mb-4 truncate">
              Tarefa: <span className="font-bold text-gray-600">{task.title}</span>
            </p>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold hover:bg-gray-50">Cancelar</button>
              <button onClick={() => onConfirm(executor)}
                className="flex-1 py-2.5 rounded-xl text-sm font-bold text-black hover:opacity-90 transition-all"
                style={{ backgroundColor: primaryColor }}>Avançar →</button>
            </div>
          </div>
        </div>
      );
    };

    /* ── TrailBuilder — sequência de executores para a tarefa ── */
    const TrailBuilder = ({ executors, value, onChange }) => {
      const addStep = () => onChange([...value, { executor: '', role: '' }]);
      const updStep = (i, patch) => onChange(value.map((s, idx) => idx === i ? { ...s, ...patch } : s));
      const delStep = (i) => onChange(value.filter((_, idx) => idx !== i));
      const moveStep = (i, dir) => {
        const nd = [...value]; const ni = i + dir;
        if (ni < 0 || ni >= nd.length) return;
        [nd[i], nd[ni]] = [nd[ni], nd[i]]; onChange(nd);
      };
      return (
        <div className="border border-gray-200 rounded-xl overflow-hidden">
          {value.length === 0 && (
            <p className="text-xs text-gray-400 italic p-3">Sem trilha definida. A tarefa ficará com o executor inicial.</p>
          )}
          {value.map((step, i) => (
            <div key={i} className="flex items-center gap-2 px-3 py-2 border-b border-gray-100 last:border-b-0 bg-gray-50/50">
              <span className="w-5 h-5 rounded-full text-[10px] font-black flex items-center justify-center shrink-0 bg-gray-200 text-gray-600">{i + 1}</span>
              {executors && executors.length > 0 ? (
                <select value={step.executor} onChange={e => updStep(i, { executor: e.target.value, role: executors.find(ex => ex.name === e.target.value)?.role || step.role })}
                  className="flex-1 text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white outline-none focus:border-blue-400">
                  <option value="">Selecionar executor...</option>
                  {executors.map(ex => <option key={ex.id} value={ex.name}>{ex.name}{ex.role ? ` (${ex.role})` : ''}</option>)}
                </select>
              ) : (
                <input value={step.executor} onChange={e => updStep(i, { executor: e.target.value })}
                  placeholder="Nome do executor..."
                  className="flex-1 text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white outline-none focus:border-blue-400"/>
              )}
              <button onClick={() => moveStep(i, -1)} disabled={i === 0} className="p-1 text-gray-400 hover:text-gray-600 disabled:opacity-30 text-xs">↑</button>
              <button onClick={() => moveStep(i, 1)} disabled={i === value.length - 1} className="p-1 text-gray-400 hover:text-gray-600 disabled:opacity-30 text-xs">↓</button>
              <button onClick={() => delStep(i)} className="text-red-400 hover:text-red-600"><X size={13}/></button>
            </div>
          ))}
          <button onClick={addStep}
            className="flex items-center gap-1.5 w-full text-xs font-bold text-gray-500 hover:text-gray-700 px-3 py-2.5 hover:bg-gray-50 transition-all border-t border-gray-100">
            <Plus size={12}/> Adicionar passo na trilha
          </button>
        </div>
      );
    };

    /* Modal: Criar Tarefa */
    const CreateTaskModal = ({ form, setFormField, squads, tags, executors, taskClients, onSave, onClose, primaryColor }) => {
      const toggleTag = (tagId) => {
        const cur = form.tag_ids || [];
        setFormField('tag_ids', cur.includes(tagId) ? cur.filter(id => id !== tagId) : [...cur, tagId]);
      };
      const noClients   = taskClients.length === 0;
      const noExecutors = executors.length === 0;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={onClose}>
          <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg mx-4 max-h-[92vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
              <h3 className="text-lg font-black text-gray-900">Nova Tarefa</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-700 p-1 rounded-lg hover:bg-gray-100"><X size={18} /></button>
            </div>
            <div className="space-y-4">
              {/* Título */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Título *</label>
                <input value={form.title} onChange={e => setFormField('title', e.target.value)}
                  placeholder="Ex: Criar campanha Meta Ads — Cliente X..."
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50" />
              </div>
              {/* Briefing */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Briefing / Descrição</label>
                <textarea value={form.description || ''} onChange={e => setFormField('description', e.target.value)}
                  rows={3} placeholder="Detalhes, instruções, contexto da tarefa..."
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none resize-none focus:border-blue-400 focus:ring-2 focus:ring-blue-50" />
              </div>
              {/* Cliente — relacional obrigatório */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Cliente *</label>
                {noClients ? (
                  <div className="flex items-center gap-2 p-3 bg-amber-50 border border-amber-200 rounded-xl">
                    <AlertCircle size={15} className="text-amber-500 shrink-0" />
                    <p className="text-xs text-amber-700 font-medium">Nenhum cliente cadastrado. Vá em <strong>Clientes</strong> para cadastrar primeiro.</p>
                  </div>
                ) : (
                  <select value={form.client_name} onChange={e => setFormField('client_name', e.target.value)}
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none bg-white focus:border-blue-400">
                    <option value="">Selecionar cliente...</option>
                    {taskClients.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                  </select>
                )}
              </div>
              {/* Executor — relacional obrigatório */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Executor Atual *</label>
                {noExecutors ? (
                  <div className="flex items-center gap-2 p-3 bg-amber-50 border border-amber-200 rounded-xl">
                    <AlertCircle size={15} className="text-amber-500 shrink-0" />
                    <p className="text-xs text-amber-700 font-medium">Nenhum executor cadastrado. Vá em <strong>Executores</strong> para cadastrar primeiro.</p>
                  </div>
                ) : (
                  <select value={form.executor_name} onChange={e => setFormField('executor_name', e.target.value)}
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none bg-white focus:border-blue-400">
                    <option value="">Selecionar executor...</option>
                    {executors.map(ex => <option key={ex.id} value={ex.name}>{ex.name}{ex.role ? ` — ${ex.role}` : ''}</option>)}
                  </select>
                )}
              </div>
              {/* Prioridade — botão group */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Prioridade</label>
                <div className="grid grid-cols-5 gap-1.5">
                  {TASK_PRIORITIES.map(p => (
                    <button key={p.id} type="button" onClick={() => setFormField('priority', p.id)}
                      className={`py-2 rounded-xl text-[10px] font-black transition-all border ${form.priority === p.id ? 'text-white border-transparent shadow-sm' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-300'}`}
                      style={form.priority === p.id ? { backgroundColor: p.bar } : {}}>
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>
              {/* Etapa + Prazo */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Etapa Inicial</label>
                  <select value={form.current_stage} onChange={e => setFormField('current_stage', e.target.value)}
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none bg-white">
                    {TASK_STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Prazo</label>
                  <input type="date" value={form.due_date || ''} onChange={e => setFormField('due_date', e.target.value)}
                    className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400" />
                </div>
              </div>
              {/* Tempo estimado */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Tempo Estimado (min)</label>
                <input type="number" value={form.estimated_minutes || 60}
                  onChange={e => setFormField('estimated_minutes', parseInt(e.target.value) || 60)}
                  min={15} step={15}
                  className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400" />
              </div>
              {/* Tags */}
              {tags.length > 0 && (
                <div>
                  <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block">Plataformas / Tags</label>
                  <div className="flex flex-wrap gap-2 p-3 border border-gray-200 rounded-xl min-h-[44px]">
                    {tags.map(tag => {
                      const sel = (form.tag_ids || []).includes(tag.id);
                      return (
                        <button key={tag.id} type="button" onClick={() => toggleTag(tag.id)}
                          className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all border ${sel ? 'text-white border-transparent' : 'bg-white border-gray-200 text-gray-600 hover:border-gray-300'}`}
                          style={sel ? { backgroundColor: tag.color_hex } : {}}>
                          <div className="w-2 h-2 rounded-sm shrink-0" style={{ backgroundColor: tag.color_hex }}></div>
                          {tag.name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
              {/* Trilha de Executores */}
              <div>
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5 block flex items-center gap-1.5">
                  <span>Trilha de Executores</span>
                  <span className="text-[10px] font-normal text-gray-400 normal-case">(opcional) — define quem recebe a tarefa em sequência</span>
                </label>
                <TrailBuilder executors={executors} value={form.workflow_trail || []} onChange={v => setFormField('workflow_trail', v)} />
              </div>
            </div>
            <div className="flex gap-3 mt-6 pt-4 border-t border-gray-100">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold hover:bg-gray-50 transition-all">Cancelar</button>
              <button onClick={onSave} disabled={noClients || noExecutors}
                className="flex-1 py-2.5 rounded-xl text-sm font-bold text-black hover:opacity-90 transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                style={{ backgroundColor: primaryColor }}>Criar Tarefa</button>
            </div>
          </div>
        </div>
      );
    };

    /* Transforma URLs em texto em links clicáveis */
    function linkify(text) {
      if (!text) return null;
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      const parts = text.split(urlRegex);
      const isUrl = (s) => /^https?:\/\//.test(s);
      return parts.map((part, i) =>
        isUrl(part)
          ? <a key={i} href={part} target="_blank" rel="noopener noreferrer"
              className="text-blue-600 underline hover:text-blue-800 break-all">{part}</a>
          : part
      );
    }

    /* TaskDrawer — painel lateral direito de detalhe da tarefa */
    const TaskDetailModal = ({ task: initialTask, tags, squads, executors, onClose, primaryColor, onTaskUpdate }) => {
      const [task, setTask] = useState(initialTask);
      const prio    = getTaskPriority(task.priority);
      const stage   = getTaskStage(task.current_stage);
      const dl      = deadlineBadge(task.due_date);
      const exec    = executors ? executors.find(e => e.name === task.executor_name) : null;
      const tTags   = Array.isArray(task.tag_ids) ? task.tag_ids.map(id => tags.find(t => t.id === id)).filter(Boolean) : [];
      const history = Array.isArray(task.stage_history) ? task.stage_history : [];
      const fmtDate = (iso) => { if(!iso) return '—'; try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return '—'; } };

      /* ── Briefing editável ── */
      const [editingBriefing, setEditingBriefing] = useState(false);
      const [briefingDraft, setBriefingDraft] = useState(task.description || '');
      const [savingBriefing, setSavingBriefing] = useState(false);
      const saveBriefing = async () => {
        setSavingBriefing(true);
        try {
          const { task: updated } = await api(`/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({ description: briefingDraft }) });
          setTask(updated);
          if (onTaskUpdate) onTaskUpdate(updated);
          setEditingBriefing(false);
        } catch (e) { alert(e.message); }
        finally { setSavingBriefing(false); }
      };

      /* ── Mover para etapa no Kanban ── */
      const [showStagePicker, setShowStagePicker] = useState(false);
      const allStages = (() => { try { const s = localStorage.getItem('pixt_task_stages'); return s ? JSON.parse(s) : TASK_STAGES; } catch { return TASK_STAGES; } })();
      const moveToStage = async (stageId) => {
        if (stageId === task.current_stage) { setShowStagePicker(false); return; }
        try {
          const { task: updated } = await api(`/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({ current_stage: stageId }) });
          setTask(updated);
          if (onTaskUpdate) onTaskUpdate(updated);
          setShowStagePicker(false);
        } catch (e) { alert(e.message); }
      };

      /* ── Comentários por login ── */
      const isExecutorUser = (auth.user?.role === 'executor') || ((auth.user?.email || '').endsWith('@executor.ia'));
      const currentUserName = auth.user?.name || (auth.user?.email || '').split('@')[0] || 'Usuário';
      const [comments, setComments] = useState([]);
      const [commLoading, setCommLoading] = useState(true);
      const [newComment, setNewComment] = useState('');
      const [sendingComment, setSendingComment] = useState(false);
      const commEndRef = useRef(null);

      useEffect(() => {
        api(`/tasks/${task.id}/comments`).then(d => setComments(d.comments || [])).catch(() => {
          // fallback para localStorage se o endpoint não existir (DB antigo)
          try { const ls = JSON.parse(localStorage.getItem(`pixt_task_comments_${task.id}`) || '[]');
            setComments(ls.map(c => ({ id: c.id, author_name: c.author, author_type: c.isExecutor ? 'executor' : 'owner', text: c.text, created_at: c.ts }))); } catch {}
        }).finally(() => setCommLoading(false));
      }, [task.id]);

      const addComment = async () => {
        if (!newComment.trim() || sendingComment) return;
        setSendingComment(true);
        try {
          const { comment } = await api(`/tasks/${task.id}/comments`, { method: 'POST', body: JSON.stringify({ text: newComment.trim() }) });
          setComments(prev => [...prev, comment]);
          setNewComment('');
          setTimeout(() => commEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
        } catch (e) {
          // fallback localStorage
          const c = { id: Date.now(), author_name: currentUserName, author_type: isExecutorUser ? 'executor' : 'owner', text: newComment.trim(), created_at: new Date().toISOString() };
          const next = [...comments, c];
          setComments(next);
          try { localStorage.setItem(`pixt_task_comments_${task.id}`, JSON.stringify(next.map(x => ({ id: x.id, author: x.author_name, isExecutor: x.author_type === 'executor', text: x.text, ts: x.created_at })))); } catch {}
          setNewComment('');
          setTimeout(() => commEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
        } finally { setSendingComment(false); }
      };

      return (
        <>
          <div className="fixed inset-0 z-40 bg-black/20 backdrop-blur-[1px]" onClick={onClose}/>
          <div className="fixed right-0 top-0 h-full w-full max-w-lg z-50 bg-white shadow-2xl border-l border-gray-200 flex flex-col animate-in slide-in-from-right duration-300">
            {/* Priority bar */}
            <div className="h-1.5 shrink-0" style={{ backgroundColor: prio.bar }}></div>
            {/* Header */}
            <div className="flex items-start justify-between p-5 border-b border-gray-100 shrink-0">
              <div className="flex-1 mr-3">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className={`text-[10px] font-black px-2 py-0.5 rounded ${prio.badge}`}>{prio.label}</span>
                  {!isExecutorUser ? (
                    <button onClick={()=>setShowStagePicker(v=>!v)}
                      className="text-[10px] font-bold px-2 py-0.5 rounded-md hover:opacity-80 transition-opacity cursor-pointer"
                      style={{ backgroundColor: stage.color + '22', color: stage.color }}
                      title="Clique para mover de etapa">
                      {stage.label} ✎
                    </button>
                  ) : (
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md"
                      style={{ backgroundColor: stage.color + '22', color: stage.color }}>
                      {stage.label}
                    </span>
                  )}
                  {dl && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${dl.cls}`}>{dl.label}</span>}
                </div>
                <h2 className="text-lg font-black text-gray-900 leading-tight">{task.title}</h2>
              </div>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-xl shrink-0 transition-colors"><X size={18}/></button>
            </div>

            {/* Stage picker — click a pill to move instantly */}
            {showStagePicker && !isExecutorUser && (
              <div className="px-5 py-3 border-b border-gray-100 bg-gray-50 shrink-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider shrink-0">Mover para:</span>
                  {allStages.map(s => (
                    <button key={s.id} onClick={() => moveToStage(s.id)}
                      className="px-3 py-1.5 rounded-xl text-xs font-bold text-white transition-all hover:scale-105 shrink-0 flex items-center gap-1"
                      style={{ backgroundColor: s.color, opacity: s.id === task.current_stage ? 0.5 : 1, outline: s.id === task.current_stage ? '2px solid #c6f432' : 'none' }}>
                      {s.id === task.current_stage && <CheckCircle2 size={10}/>}
                      {s.label}
                    </button>
                  ))}
                  <button onClick={() => setShowStagePicker(false)} className="px-2 py-1 rounded-lg text-xs text-gray-400 border border-gray-200 hover:bg-white ml-auto">✕</button>
                </div>
              </div>
            )}

            {/* Scrollable content */}
            <div className="flex-1 overflow-y-auto p-5 space-y-4">

              {/* ── Briefing — enquadramento próprio editável ── */}
              <div className="border-2 border-blue-200 rounded-xl overflow-hidden">
                <div className="flex items-center justify-between px-3.5 py-2 bg-blue-500">
                  <p className="text-[10px] font-black text-white uppercase tracking-wider flex items-center gap-1.5">📋 Briefing</p>
                  {!editingBriefing ? (
                    <button onClick={()=>{setBriefingDraft(task.description||'');setEditingBriefing(true);}}
                      className="p-1 hover:bg-white/20 rounded transition-colors" title="Editar briefing">
                      <Edit3 size={12} className="text-white"/>
                    </button>
                  ) : (
                    <div className="flex gap-1">
                      <button onClick={saveBriefing} disabled={savingBriefing}
                        className="px-2 py-0.5 bg-white text-blue-700 rounded text-[10px] font-black disabled:opacity-50">
                        {savingBriefing ? '...' : 'Salvar'}
                      </button>
                      <button onClick={()=>setEditingBriefing(false)}
                        className="px-2 py-0.5 bg-white/20 text-white rounded text-[10px] font-bold">Cancelar</button>
                    </div>
                  )}
                </div>
                <div className="p-3.5 bg-blue-50">
                  {editingBriefing ? (
                    <textarea value={briefingDraft} onChange={e=>setBriefingDraft(e.target.value)}
                      rows={5} autoFocus
                      placeholder="Detalhes, instruções, contexto da tarefa. Cole links aqui — eles ficam clicáveis."
                      className="w-full text-sm text-gray-700 bg-transparent outline-none resize-none leading-relaxed placeholder:text-gray-400"/>
                  ) : (
                    task.description
                      ? <p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{linkify(task.description)}</p>
                      : <p className="text-sm text-gray-400 italic">Nenhum briefing. Clique em ✎ para adicionar.</p>
                  )}
                </div>
              </div>

              {/* Material para criação */}
              {task.material && (
                <div className="p-3.5 bg-purple-50 border border-purple-100 rounded-xl">
                  <p className="text-[9px] font-bold text-purple-500 uppercase tracking-wider mb-1.5">🎨 Material para Criação</p>
                  <p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{linkify(task.material)}</p>
                </div>
              )}

              {/* Info grid */}
              <div className="grid grid-cols-2 gap-3">
                {task.client_name && (
                  <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Cliente</p>
                    <p className="font-bold text-sm text-gray-800">{task.client_name}</p>
                  </div>
                )}
                {task.executor_name && (
                  <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Executor</p>
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded-full overflow-hidden flex items-center justify-center text-[8px] font-black text-white shrink-0"
                        style={exec?.photo_url ? {} : { backgroundColor: exec?.color_hex || primaryColor }}>
                        {exec?.photo_url ? <img src={exec.photo_url} className="w-full h-full object-cover"/> : taskInitials(task.executor_name)}
                      </div>
                      <div>
                        <p className="font-bold text-xs text-gray-800 leading-none">{task.executor_name}</p>
                        {exec?.role && <p className="text-[9px] text-gray-400">{exec.role}</p>}
                      </div>
                    </div>
                  </div>
