                    {funilDays.map(d=><th key={d.date} className="px-2 py-2.5 text-right font-semibold text-gray-400 min-w-[72px]">{d.date}</th>)}
                    <th className="px-4 py-2.5 text-right font-bold text-gray-900 min-w-[90px]" style={{position:'sticky',right:0,background:`${primaryColor}18`,color:'#374151'}}>Total</th>
                  </tr>
                </thead>
                <tbody>
                  {LEADS_GROUPS.map(grp=>(
                    <React.Fragment key={grp.group}>
                      <tr><td colSpan={funilDays.length+3} className={`${grp.cls} bg-gray-50/60 text-[10px] font-bold uppercase tracking-wider text-gray-500 py-1.5 px-4`}>{grp.group}</td></tr>
                      {grp.metrics.map((m,mi)=>(
                        <tr key={m.key} className={`border-b border-gray-50 ${mi%2===0?'bg-white':'bg-gray-50/30'} hover:bg-gray-50`}>
                          <td className={`px-4 py-2 font-medium text-gray-800 ${grp.cls}`} style={{position:'sticky',left:0,background:mi%2===0?'white':'#f9fafb'}}>{m.label}</td>
                          <td className="px-2 py-2"><span className={`text-[9px] px-1.5 py-0.5 rounded font-semibold ${m.srcCls}`}>{m.src}</span></td>
                          {funilDays.map(d=><td key={d.date} className={`px-2 py-2 text-right font-mono ${m.calc?'text-gray-400':'text-gray-700'}`}>{fmtVal(d[m.key],m.fmt)}</td>)}
                          <td className="px-4 py-2 text-right font-mono font-bold text-gray-900" style={{position:'sticky',right:0,background:mi%2===0?'white':'#f9fafb'}}>{fmtVal(tot[m.key],m.fmt)}</td>
                        </tr>
                      ))}
                    </React.Fragment>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
              <p className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Resumo do Funil</p>
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                {[['Impressões',tot.impressions,'number'],['Cliques',tot.clicks,'number'],['Leads',tot.totalLeads,'number'],['Investimento',tot.cost,'currency']].map(([l,v,f])=>(
                  <div key={l} className="border border-gray-100 rounded-xl p-3">
                    <p className="text-xs text-gray-400 mb-0.5">{l}</p>
                    <p className="text-base font-bold font-mono text-gray-900">{fmtVal(v,f)}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      };

      /* ── Criativos ── */
      const CriativosContent = () => {
        const [items, setItems] = useState(() => { try { return JSON.parse(localStorage.getItem('pixt_criativos')||'[]'); } catch { return []; } });
        const [showModal, setShowModal] = useState(false);
        const [editId, setEditId] = useState(null);
        const [filter, setFilter] = useState('all');
        const [form, setForm] = useState({title:'',url:'',type:'image',status:'Em Teste',impressions:'',clicks:'',leads:'',notes:''});
        const save = ls => { setItems(ls); localStorage.setItem('pixt_criativos',JSON.stringify(ls)); };
        const openNew = () => { setEditId(null); setForm({title:'',url:'',type:'image',status:'Em Teste',impressions:'',clicks:'',leads:'',notes:''}); setShowModal(true); };
        const openEdit = c => { setEditId(c.id); setForm({...c}); setShowModal(true); };
        const del = id => save(items.filter(c=>c.id!==id));
        const submit = () => {
          if (!form.title) return;
          save(editId ? items.map(c=>c.id===editId?{...form,id:editId}:c) : [...items,{...form,id:Date.now()}]);
          setShowModal(false);
        };
        const filtered = filter==='all' ? items : items.filter(c=>c.status===filter);
        const sBadge = {
          'Em Teste':  'bg-yellow-100 text-yellow-700',
          'Validado':  'bg-green-100 text-green-700',
          'Descartado':'bg-red-100 text-red-500',
        };
        const getYTId = url => { const m=(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([a-zA-Z0-9_-]{11})/); return m?m[1]:null; };
        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div className="inline-flex rounded-xl border border-gray-200 p-0.5 bg-white gap-0.5">
                {[['all','Todos'],['Em Teste','Em Teste'],['Validado','Validado'],['Descartado','Descartado']].map(([v,l]) => (
                  <button key={v} onClick={() => setFilter(v)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${filter===v?'text-black shadow-sm':'text-gray-500 hover:text-gray-800'}`}
                    style={filter===v?{backgroundColor:primaryColor}:{}}>
                    {l}
                  </button>
                ))}
              </div>
              <button onClick={openNew} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-xs text-black shadow-sm" style={{backgroundColor:primaryColor}}>
                <Plus size={12}/> Novo Criativo
              </button>
            </div>
            {filtered.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-48 text-center gap-2">
                <Star size={28} className="text-gray-200"/>
                <p className="text-sm font-semibold text-gray-400">Nenhum criativo ainda</p>
                <p className="text-xs text-gray-300">Clique em "Novo Criativo" para adicionar</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                {filtered.map(c => {
                  const ytId = getYTId(c.url||'');
                  return (
                    <div key={c.id} className="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
                      <div className="h-36 bg-gray-100 flex items-center justify-center relative overflow-hidden">
                        {ytId
                          ? <img src={`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`} alt="" className="w-full h-full object-cover"/>
                          : <div className="flex flex-col items-center gap-1 text-gray-300"><Star size={24}/><span className="text-xs">Sem preview</span></div>
                        }
                        <span className={`absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-bold ${sBadge[c.status]||'bg-gray-100 text-gray-500'}`}>{c.status}</span>
                        {ytId && <span className="absolute top-2 right-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-600">YouTube</span>}
                        {c.type==='instagram' && <span className="absolute top-2 right-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-pink-100 text-pink-600">Instagram</span>}
                      </div>
                      <div className="p-3">
                        <p className="font-bold text-gray-900 text-sm mb-1 truncate">{c.title||'Sem título'}</p>
                        <div className="grid grid-cols-3 gap-1.5 mb-2">
                          {[['Impressões',c.impressions],['Cliques',c.clicks],['Leads',c.leads]].map(([l,v]) => (
                            <div key={l} className="bg-gray-50 rounded-lg p-1.5 text-center">
                              <p className="text-[9px] text-gray-400 font-semibold uppercase">{l}</p>
                              <p className="text-xs font-black text-gray-800">{v||'—'}</p>
                            </div>
                          ))}
                        </div>
                        {c.notes && <p className="text-[11px] text-gray-400 italic mb-2 line-clamp-2">{c.notes}</p>}
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => openEdit(c)} className="flex items-center gap-1 px-2 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-[11px] font-semibold">
                            <Edit3 size={11}/> Editar
                          </button>
                          <button onClick={() => del(c.id)} className="flex items-center gap-1 px-2 py-1 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 text-[11px] font-semibold">
                            <Trash2 size={11}/> Remover
                          </button>
                          {c.url && <a href={c.url} target="_blank" rel="noreferrer" className="flex items-center gap-1 px-2 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-600 text-[11px] font-semibold ml-auto">
                            <ArrowRight size={11}/> Ver
                          </a>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {showModal && (
              <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={() => setShowModal(false)}>
                <div className="bg-white rounded-2xl p-5 w-full max-w-md shadow-2xl" onClick={e => e.stopPropagation()}>
                  <div className="flex items-center justify-between mb-4">
                    <p className="font-black text-gray-900">{editId?'Editar Criativo':'Novo Criativo'}</p>
                    <button onClick={() => setShowModal(false)} className="p-1.5 rounded-lg hover:bg-gray-100"><X size={14} className="text-gray-400"/></button>
                  </div>
                  <div className="space-y-3">
                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Título</label>
                      <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none" placeholder="Nome do criativo"/></div>
                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">URL</label>
                      <input value={form.url} onChange={e=>setForm(f=>({...f,url:e.target.value}))} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none" placeholder="https://..."/></div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Tipo</label>
                        <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none">
                          {['image','video','youtube','instagram','carrossel'].map(t => <option key={t} value={t}>{t}</option>)}
                        </select></div>
                      <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Status</label>
                        <select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none">
                          {['Em Teste','Validado','Descartado'].map(s => <option key={s} value={s}>{s}</option>)}
                        </select></div>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      {[['impressions','Impressões'],['clicks','Cliques'],['leads','Leads']].map(([k,l]) => (
                        <div key={k}><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">{l}</label>
                          <input type="number" value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none" placeholder="0"/></div>
                      ))}
                    </div>
                    <div><label className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Observações</label>
                      <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none resize-none" placeholder="Notas sobre desempenho..."/></div>
                  </div>
                  <div className="flex gap-2 mt-4">
                    <button onClick={() => setShowModal(false)} className="flex-1 py-2 rounded-xl border border-gray-200 text-sm font-semibold text-gray-500 hover:bg-gray-50">Cancelar</button>
                    <button onClick={submit} className="flex-1 py-2 rounded-xl font-bold text-sm text-black" style={{backgroundColor:primaryColor}}>Salvar</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      /* ── Estratégia ── */
      const EstrategiaContent = () => (
        <MindMapCanvas
          storageKey="pixt_est_miromap_v2"
          primaryColor={primaryColor}
          initialTitle="Estratégia de Tráfego"
          height="calc(100vh - 220px)"
          showHeader={true}
        />
      );

      /* ── Páginas ── */
      const PaginasContent = () => {
        const pgRand=seededRnd(13);
        const pgScale=(base)=>Math.round(base*(pts/30)*(0.9+pgRand()*0.2));
        const topPages = [
          {path:'/',            title:'Home',               users:pgScale(2800), sessions:pgScale(3200), bounce:+(38+pgRand()*8).toFixed(1), dur:'2:14'},
          {path:'/sobre',       title:'Sobre Nós',          users:pgScale(1200), sessions:pgScale(1400), bounce:+(44+pgRand()*8).toFixed(1), dur:'1:48'},
          {path:'/servicos',    title:'Serviços',           users:pgScale(1800), sessions:pgScale(2100), bounce:+(31+pgRand()*8).toFixed(1), dur:'3:05'},
          {path:'/contato',     title:'Contato',            users:pgScale(900),  sessions:pgScale(1050), bounce:+(28+pgRand()*8).toFixed(1), dur:'1:32'},
          {path:'/blog',        title:'Blog',               users:pgScale(1500), sessions:pgScale(1800), bounce:+(52+pgRand()*8).toFixed(1), dur:'4:21'},
          {path:'/lp/oferta',   title:'Landing Page Oferta',users:pgScale(600),  sessions:pgScale(720),  bounce:+(22+pgRand()*8).toFixed(1), dur:'2:58'},
        ];
        const [tested, setTested] = useState(() => { try { return JSON.parse(localStorage.getItem('pixt_tested_pages')||'[]'); } catch { return []; } });
        const [showAdd, setShowAdd] = useState(false);
        const [addF, setAddF] = useState({path:'',title:'',status:'Em Teste',notes:''});
        const [sortK, setSortK] = useState('users');
        const [sortD, setSortD] = useState(-1);
        const saveTested = ls => { setTested(ls); localStorage.setItem('pixt_tested_pages',JSON.stringify(ls)); };
        const addPage = () => { if(!addF.path)return; saveTested([...tested,{...addF,id:Date.now()}]); setAddF({path:'',title:'',status:'Em Teste',notes:''}); setShowAdd(false); };
        const delPage = id => saveTested(tested.filter(p=>p.id!==id));
        const cycleStatus = id => {
          const sl=['Em Teste','Aprovada','Em Revisão','Descontinuada'];
          saveTested(tested.map(p=>p.id===id?{...p,status:sl[(sl.indexOf(p.status)+1)%sl.length]}:p));
        };
        const sorted = [...topPages].sort((a,b) => (b[sortK]-a[sortK])*sortD);
        const tSort = k => { if(sortK===k) setSortD(d=>d*-1); else { setSortK(k); setSortD(-1); } };
        const pgSC = {'Em Teste':'bg-yellow-100 text-yellow-700','Aprovada':'bg-green-100 text-green-700','Em Revisão':'bg-blue-100 text-blue-600','Descontinuada':'bg-gray-100 text-gray-500'};
        return (
          <div className="space-y-5">
            <div className="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
              <div className="px-4 py-3 border-b border-gray-100">
                <p className="text-sm font-bold text-gray-900">Top Páginas <span className="text-xs font-normal text-gray-400">— GA4</span></p>
              </div>
              <table className="w-full text-xs">
                <thead><tr className="border-b border-gray-100">
                  <th className="px-4 py-2.5 text-left font-semibold text-gray-400">Página</th>
                  {[['users','Usuários'],['sessions','Sessões'],['bounce','Rejeição'],['dur','Duração']].map(([k,l]) => (
                    <th key={k} onClick={() => k!=='dur'&&tSort(k)}
                      className={`px-3 py-2.5 text-right font-semibold text-gray-400 ${k!=='dur'?'cursor-pointer hover:text-gray-700 select-none':''}`}>
                      {l}{sortK===k?(sortD<0?' ↓':' ↑'):''}
                    </th>
                  ))}
                </tr></thead>
                <tbody>{sorted.map((p,i) => (
                  <tr key={i} className="border-b border-gray-50 hover:bg-gray-50">
                    <td className="px-4 py-2.5"><p className="font-medium text-gray-800">{p.title}</p><p className="text-gray-400 text-[10px]">{p.path}</p></td>
                    <td className="px-3 py-2.5 text-right font-semibold text-gray-700">{fmtN(p.users)}</td>
                    <td className="px-3 py-2.5 text-right text-gray-600">{fmtN(p.sessions)}</td>
                    <td className="px-3 py-2.5 text-right text-gray-600">{p.bounce}%</td>
                    <td className="px-3 py-2.5 text-right text-gray-600">{p.dur}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
            <div className="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
              <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                <p className="text-sm font-bold text-gray-900">Páginas em Testes</p>
                <button onClick={() => setShowAdd(v=>!v)} className="flex items-center gap-1 px-3 py-1.5 rounded-xl font-bold text-xs text-black" style={{backgroundColor:primaryColor}}>
                  <Plus size={12}/> Adicionar
                </button>
              </div>
              {showAdd && (
                <div className="px-4 py-3 border-b border-gray-100 bg-gray-50 flex flex-wrap gap-2 items-end">
                  <div><label className="text-[10px] font-bold text-gray-400 uppercase">Caminho</label>
                    <input value={addF.path} onChange={e=>setAddF(f=>({...f,path:e.target.value}))} className="mt-0.5 block border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs outline-none" placeholder="/pagina"/></div>
                  <div><label className="text-[10px] font-bold text-gray-400 uppercase">Título</label>
                    <input value={addF.title} onChange={e=>setAddF(f=>({...f,title:e.target.value}))} className="mt-0.5 block border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs outline-none" placeholder="Nome"/></div>
                  <div><label className="text-[10px] font-bold text-gray-400 uppercase">Notas</label>
                    <input value={addF.notes} onChange={e=>setAddF(f=>({...f,notes:e.target.value}))} className="mt-0.5 block border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs outline-none w-44" placeholder="Observação..."/></div>
                  <button onClick={addPage} className="px-3 py-1.5 rounded-lg font-bold text-xs text-black" style={{backgroundColor:primaryColor}}>Salvar</button>
                  <button onClick={() => setShowAdd(false)} className="px-3 py-1.5 rounded-lg font-bold text-xs text-gray-500 bg-gray-100">Cancelar</button>
                </div>
              )}
              {tested.length === 0
                ? <div className="px-4 py-8 text-center text-xs text-gray-300">Nenhuma página adicionada.</div>
                : <table className="w-full text-xs">
                    <thead><tr className="border-b border-gray-100">
                      <th className="px-4 py-2 text-left font-semibold text-gray-400">Página</th>
                      <th className="px-4 py-2 text-center font-semibold text-gray-400">Status</th>
                      <th className="px-4 py-2 text-left font-semibold text-gray-400">Notas</th>
                      <th className="px-4 py-2 text-right font-semibold text-gray-400">Ação</th>
                    </tr></thead>
                    <tbody>{tested.map(p => (
                      <tr key={p.id} className="border-b border-gray-50 hover:bg-gray-50">
                        <td className="px-4 py-2"><p className="font-medium text-gray-800">{p.title||p.path}</p><p className="text-gray-400 text-[10px]">{p.path}</p></td>
                        <td className="px-4 py-2 text-center">
                          <button onClick={() => cycleStatus(p.id)} className={`px-2 py-0.5 rounded-full text-[10px] font-bold cursor-pointer ${pgSC[p.status]||'bg-gray-100 text-gray-500'}`}>{p.status}</button>
                        </td>
                        <td className="px-4 py-2 text-gray-500 max-w-[180px] truncate">{p.notes||'—'}</td>
                        <td className="px-4 py-2 text-right">
                          <button onClick={() => delPage(p.id)} className="p-1 rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-500"><Trash2 size={12}/></button>
                        </td>
                      </tr>
                    ))}</tbody>
                  </table>
              }
            </div>
          </div>
        );
      };

      /* ── Usuários ── */
      const UsuariosContent = () => {
        const f = pts / 30;
        const uRand = seededRnd(33);
        const active  = Math.round(8400 * f * (0.9 + uRand() * 0.2));
        const newU    = Math.round(1200 * f * (0.9 + uRand() * 0.2));
        const avgD    = Math.round(active / pts);
        const retRate = parseFloat((38 + uRand() * 15).toFixed(1));

        const uDays = allDays.map((d, i) => {
          const r = seededRnd(33 + i);
          return {
            date: fmtDt(d),
            active: Math.round(avgD * (0.7 + r() * 0.6)),
            newU: Math.round((newU / pts) * (0.7 + r() * 0.6)),
          };
        });

        const DAY_LABELS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
        const buildWk = (key) => {
          const last14 = uDays.slice(-14);
          const prev7 = last14.slice(0, 7);
          const curr7 = last14.slice(7);
          return DAY_LABELS.map((day, i) => ({
            day,
            previous: prev7[i]?.[key] ?? 0,
            current:  curr7[i]?.[key] ?? null,
          }));
        };

        useEffect(() => {
          const C = window.Chart; if (!C) return;
          const inst = [];
          const lbs = uDays.map(d => d.date);
          const cv1 = document.getElementById('ch-usr-active');
          const cv2 = document.getElementById('ch-usr-new');
          const cv3 = document.getElementById('ch-usr-wact');
          const cv4 = document.getElementById('ch-usr-wnew');
          if (cv1) inst.push(mkArea(C, cv1, lbs, uDays.map(d => d.active), '#3b82f6'));
          if (cv2) inst.push(mkBar(C, cv2, lbs, uDays.map(d => d.newU), '#10b981', 'Novos Usuários', fmtN));
          if (cv3) inst.push(mkWk(C, cv3, buildWk('active'), '#3b82f6', fmtN));
          if (cv4) inst.push(mkWk(C, cv4, buildWk('newU'),   '#10b981', fmtN));
          return () => inst.forEach(i => { try { i.destroy(); } catch(e) {} });
        }, []);

        return (
          <div className="space-y-5">
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
              {[
                {title:'Usuários Ativos', value:active,  fmt:'number',  icon:Users,      color:'#3b82f6', delta:8.3},
                {title:'Novos Usuários',  value:newU,    fmt:'number',  icon:UserPlus,   color:'#10b981', delta:15.2},
                {title:'Média Diária',    value:avgD,    fmt:'number',  icon:Activity,   color:'#8b5cf6', delta:5.1},
                {title:'Taxa de Retorno', value:retRate, fmt:'percent', icon:TrendingUp, color:'#f59e0b', delta:2.7},
              ].map(k => <KPI key={k.title} {...k}/>)}
            </div>
            <div className="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-3">Usuários Ativos por Dia</p>
              <canvas id="ch-usr-active" height="80"/>
            </div>

                <canvas id="ch-usr-wact" height="100"/>

                <canvas id="ch-usr-wnew" height="100"/>

            </div>

            <div>
              <p className="text-sm font-bold text-gray-700">{dateRange.label}</p>
              <p className="text-[10px] text-gray-400 mt-0.5">

            </div>
            <div className="flex items-center gap-2 flex-wrap">

              <div className="inline-flex rounded-lg border border-gray-200 p-0.5 bg-white gap-0.5">

                  <button key={v} onClick={() => applyPreset(v)}

                    {l}

                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-semibold transition-all ${showPicker?'border-gray-400 bg-gray-50':'border-gray-200 bg-white hover:bg-gray-50'} text-gray-600`}>

                      {[['7d','7 dias'],['14d','14 dias'],['30d','30 dias'],['90d','90 dias']].map(([v,l]) => (
                        <button key={v} onClick={() => applyPreset(v)}
                          className={`py-1.5 rounded-lg text-[10px] font-bold transition-all ${dateRange.preset===v?'text-black':'text-gray-500 bg-gray-100 hover:bg-gray-200'}`}
                          style={dateRange.preset===v?{backgroundColor:primaryColor}:{}}>
                          {l}
                        </button>
                      ))}
                    </div>
                    <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-2">Período personalizado</p>
                    <div className="flex items-center justify-between mb-2 px-0.5">
                      <button onClick={() => { const m=new Date(pickerMonth); m.setMonth(m.getMonth()-1); setPickerMonth(m); }}
                        className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500 font-bold text-base">‹</button>
                      <p className="text-xs font-bold text-gray-700 capitalize">
                        {pickerMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
                      </p>
                      <button onClick={() => { const m=new Date(pickerMonth); m.setMonth(m.getMonth()+1); setPickerMonth(m); }}
                        className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500 font-bold text-base">›</button>
                    </div>
                    <div className="grid grid-cols-7 gap-0.5 text-center">
                      {['D','S','T','Q','Q','S','S'].map((d,i) => (
                        <p key={i} className="text-[9px] font-bold text-gray-400 py-1">{d}</p>
                      ))}
                      {calDays.map((day, i) => {
                        const inR = isDayIn(day);
                        const isS = isDayStart(day);
                        const isE = isDayEnd(day);
                        return (
                          <button key={i} onClick={() => handlePickDay(day)} disabled={!day}
                            className={`text-[11px] py-1.5 rounded-lg transition-all font-medium leading-none
                              ${!day ? 'opacity-0 pointer-events-none' : ''}
                              ${(isS||isE) ? 'text-black font-bold shadow-sm' : inR ? 'text-gray-800' : 'text-gray-600 hover:bg-gray-100'}`}
                            style={(isS||isE)?{backgroundColor:primaryColor}:inR?{backgroundColor:primaryColor+'44'}:{}}>
                            {day ? day.getDate() : ''}
                          </button>
                        );
                      })}
                    </div>
                    {pickStart && !pickEnd && (
                      <p className="text-[10px] text-gray-400 text-center mt-2">Selecione a data final</p>
                    )}
                    {pickStart && pickEnd && (
                      <button onClick={applyCustomRange}
                        className="mt-3 w-full py-2 rounded-xl font-bold text-xs text-black transition-all hover:opacity-90"
                        style={{backgroundColor:primaryColor}}>
                        Aplicar: {fmtDP(pickStart)} → {fmtDP(pickEnd)}
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          </div>
          {subTab==='overview'   && <OverviewContent   key={rangeKey}/>}
          {subTab==='meta'       && <MetaAdsContent    key={rangeKey}/>}
          {subTab==='gads'       && <GoogleAdsContent  key={rangeKey}/>}
          {subTab==='ga4'        && <GA4Content        key={rangeKey}/>}
          {subTab==='funil'      && <FunilContent      key={rangeKey}/>}
          {subTab==='criativos'  && <CriativosContent  key={rangeKey}/>}
          {subTab==='estrategia' && <EstrategiaContent key={rangeKey}/>}
        </div>
      );
    };

    /* ---- Admin Dashboard root ---- */
    const AGENT_SUBTABS = {
      vendas:     [{ id:'planejamento',label:'Planejamento',icon:FileText},{id:'playbook',label:'Playbook',icon:Workflow},{id:'documentos',label:'Documentações',icon:Database},{id:'estrategia',label:'Estratégia',icon:Target}],
      leadflow:   [{ id:'planejamento',label:'Planejamento',icon:FileText},{id:'playbook',label:'Playbook',icon:Workflow},{id:'documentos',label:'Documentações',icon:Database},{id:'estrategia',label:'Estratégia',icon:Target}],
      booker:     [{ id:'planejamento',label:'Planejamento',icon:FileText},{id:'playbook',label:'Playbook',icon:Workflow},{id:'documentos',label:'Documentações',icon:Database},{id:'estrategia',label:'Estratégia',icon:Target}],
      'pixt-bdr': [{ id:'planejamento',label:'Planejamento',icon:FileText},{id:'playbook',label:'Playbook',icon:Workflow},{id:'documentos',label:'Documentações',icon:Database},{id:'estrategia',label:'Estratégia',icon:Target}],
      custom:     [{ id:'planejamento',label:'Planejamento',icon:FileText},{id:'playbook',label:'Playbook',icon:Workflow},{id:'documentos',label:'Documentações',icon:Database},{id:'estrategia',label:'Estratégia',icon:Target}],
    };

    const AdminDashboard = ({ onLogout }) => {
      const PRIMARY = '#c6f432'; // cor da marca — fixa
      const [activeAgent, setActiveAgent] = useState(null);
      const [activeSpecial, setActiveSpecial] = useState('overview');
      const [agentSubTab, setAgentSubTab] = useState('planejamento');
      const [isAgentOn, setIsAgentOn] = useState(true);
      const [agentsOpen, setAgentsOpen] = useState(false);
      const [trafficOpen, setTrafficOpen] = useState(false);
      const [adminSideCollapsed, setAdminSideCollapsed] = useState(false);
      const toast = useToast();

      // Auto-open traffic dropdown when a traffic sub is active
      useEffect(() => {
        if (activeSpecial && activeSpecial.startsWith('traffic-')) setTrafficOpen(true);
      }, [activeSpecial]);

      // ── Layout config — persisted in localStorage ──
      const [layoutCfg, setLayoutCfg] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pixt_layout_cfg') || '{}'); } catch { return {}; }
      });
      const saveCfg = (updates, navOverride) => {
        const next = { ...layoutCfg, ...updates };
        setLayoutCfg(next);
        localStorage.setItem('pixt_layout_cfg', JSON.stringify(next));
        if (navOverride) { setActiveAgent(null); setActiveSpecial(navOverride); }
      };

      const layoutMode    = layoutCfg.mode       || 'classic';
      const labelColor    = layoutCfg.labelColor  || '#6b7280';
      const hiddenTabs    = layoutCfg.hidden       || [];
      const tabLabels     = layoutCfg.labels       || {};
      const platformOrder = layoutCfg.platformOrder || PLATFORM_TABS.map(t => t.id);
      const orderedPlatformTabs = platformOrder.map(id => PLATFORM_TABS.find(t => t.id === id)).filter(Boolean);

      // ── Drag-and-drop (platform tabs) ──
      const [dragId, setDragId] = useState(null);
      const onDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; };
      const onDragOver  = (e)     => { e.preventDefault(); };
      const onDrop      = (e, targetId) => {
        e.preventDefault();
        if (!dragId || dragId === targetId) { setDragId(null); return; }
        const cur = [...platformOrder];
        const fi = cur.indexOf(dragId), ti = cur.indexOf(targetId);
        cur.splice(fi, 1); cur.splice(ti, 0, dragId);
        saveCfg({ platformOrder: cur });
        setDragId(null);
      };

      const selectAgent   = (slug) => { setActiveAgent(slug); setActiveSpecial(null); setAgentSubTab('planejamento'); };
      const selectSpecial = (id)   => { setActiveAgent(null); setActiveSpecial(id); };
      const toggleAgent   = async (next) => {
        if (!activeAgent) return;
        setIsAgentOn(next);
        try { await api(`/agents/${activeAgent}/toggle`, { method: 'PATCH', body: JSON.stringify({ is_on: next }) }); }
        catch (e) { toast(e.message, 'error'); setIsAgentOn(!next); }
      };

      const fakeAgent  = activeAgent ? { slug: activeAgent, name: ADMIN_TABS.find(t => t.id === activeAgent)?.label || activeAgent, description: '', is_on: isAgentOn } : null;
      const subTabs    = activeAgent ? (AGENT_SUBTABS[activeAgent] || []) : [];
      const getLabel   = (tab) => tabLabels[tab.id] || tab.label;

      const isTrafficTab = activeSpecial && activeSpecial.startsWith('traffic-');
      const trafficSubId = isTrafficTab ? activeSpecial.replace('traffic-','') : null;

      const LABEL_MAP = {
        overview:'Visão Geral', clients:'Clientes', 'pipeline-geral':'Pipeline Geral',
        revenue:'Receita', contacts:'Contatos 360°', tasks:'Gestão de Tarefas',
        agentperf:'Performance Agentes', forecast:'DRE Projetado',
        leadscore:'Lead Scoring', reports:'Relatórios Auto.', customize:'Personalizar',
        'traffic-overview':'Visão Geral', 'traffic-meta':'Meta Ads', 'traffic-gads':'Google Ads',
        'traffic-ga4':'GA4', 'traffic-funil':'Funil', 'traffic-criativos':'Criativos',
        'traffic-estrategia':'Estratégia',
      };
      const breadcrumb = activeAgent
        ? ADMIN_TABS.find(t => t.id === activeAgent)?.label
        : isTrafficTab
          ? `Tráfego & Mídias / ${LABEL_MAP[activeSpecial]}`
          : LABEL_MAP[activeSpecial];

      const SPECIAL_TABS = [
        { id: 'overview',       label: 'Visão Geral',       icon: BarChart3 },
        { id: 'pipeline-geral', label: 'Pipeline Geral',    icon: KanbanSquare },
        { id: 'clients',        label: 'Clientes',          icon: UserPlus },
        { id: 'tasks',          label: 'Gestão de Tarefas', icon: CheckCircle2 },
      ];
      const TRAFFIC_SUBS = [
        {id:'traffic-overview',   label:'Visão Geral',  icon:LayoutDashboard},
        {id:'traffic-meta',       label:'Meta Ads',     icon:Target},
        {id:'traffic-gads',       label:'Google Ads',   icon:Globe},
        {id:'traffic-ga4',        label:'GA4',          icon:Activity},
        {id:'traffic-funil',      label:'Funil',        icon:Filter},
        {id:'traffic-criativos',  label:'Criativos',    icon:Star},
        {id:'traffic-estrategia', label:'Estratégia',   icon:MapPin},
      ];
      const AGENT_TABS_FILTERED = ADMIN_TABS.filter(t => !['overview','traffic','pipeline-geral','clients'].includes(t.id));

      const ContentArea = ({ darkBg }) => (
        <div className="flex-1 overflow-y-auto p-6" data-theme={darkBg ? 'dark' : 'light'} style={darkBg ? {backgroundColor:'#0d1117'} : {}}>
          {!activeAgent && activeSpecial === 'overview'       && <AdminOverviewTab primaryColor={PRIMARY} />}
          {!activeAgent && isTrafficTab                       && <AdminTrafficTab primaryColor={PRIMARY} activeTab={trafficSubId} />}
          {!activeAgent && activeSpecial === 'pipeline-geral' && <AdminPipelineTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'clients'        && <AdminPanel primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'tasks'          && <TasksTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'revenue'        && <RevenueDashboard primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'agentperf'      && <AgentPerfTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'forecast'       && <ForecastTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'leadscore'      && <LeadScoreTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'reports'        && <ReportsTab primaryColor={PRIMARY} />}
          {!activeAgent && activeSpecial === 'customize'      && <CustomizePanel />}
          {activeAgent && fakeAgent && (
            <>
              {agentSubTab === 'planejamento' && <AgentPlanTab agent={activeAgent} primaryColor={PRIMARY} />}
              {agentSubTab === 'playbook'     && <AgentPlaybookTab agent={activeAgent} primaryColor={PRIMARY} />}
              {agentSubTab === 'documentos'   && <AgentDocsTab agent={activeAgent} primaryColor={PRIMARY} />}
              {agentSubTab === 'estrategia'   && <AgentStrategyTab agent={activeAgent} primaryColor={PRIMARY} />}
            </>
          )}
        </div>
      );

      // ── Customization panel ──
      const LABEL_COLORS = [
        { hex:'#6b7280', name:'Cinza' }, { hex:'#1f2937', name:'Escuro' },
        { hex:'#c6f432', name:'Verde' }, { hex:'#6366f1', name:'Roxo'  },
        { hex:'#3b82f6', name:'Azul'  }, { hex:'#f97316', name:'Laranja'},
        { hex:'#ec4899', name:'Rosa'  }, { hex:'#14b8a6', name:'Teal'  },
      ];
      const CustomizePanel = () => {
        const allTabs = [...SPECIAL_TABS, ...TRAFFIC_SUBS, ...AGENT_TABS_FILTERED, ...PLATFORM_TABS];
        const [editLabels, setEditLabels] = useState({ ...tabLabels });

        const LAYOUTS = [
          { id:'classic', label:'Sidebar Claro', desc:'Sidebar branca à esquerda com ícone e rótulo — padrão limpo',
            preview:(
              <div className="w-full h-20 rounded-xl border border-gray-200 flex overflow-hidden bg-gray-50">
                <div className="w-14 bg-white border-r border-gray-200 flex flex-col gap-1.5 p-2">
                  <div className="h-5 rounded-lg w-full" style={{backgroundColor:PRIMARY}} />
                  {[1,2,3,4].map(i=><div key={i} className="h-4 rounded-lg bg-gray-100 w-full"/>)}
                </div>
                <div className="flex-1 p-3 space-y-2">
                  <div className="h-3 w-3/4 bg-gray-200 rounded"/>
                  <div className="grid grid-cols-2 gap-1.5">{[1,2,3,4].map(i=><div key={i} className="h-8 bg-white rounded-lg border border-gray-100"/>)}</div>
                </div>
              </div>
            )},
          { id:'dark', label:'Fundo Escuro', desc:'Tema escuro completo com sidebar dark e conteúdo em cards brancos',
            preview:(
              <div className="w-full h-20 rounded-xl border border-gray-700 flex overflow-hidden" style={{backgroundColor:'#0d1117'}}>
                <div className="w-14 border-r border-gray-700 flex flex-col gap-1.5 p-2" style={{backgroundColor:'#161b27'}}>
                  <div className="h-5 rounded-lg w-full" style={{backgroundColor:PRIMARY}} />
                  {[1,2,3,4].map(i=><div key={i} className="h-4 rounded-lg w-full" style={{backgroundColor:'#1f2937'}}/>)}
                </div>
                <div className="flex-1 p-3 space-y-2" style={{backgroundColor:'#0d1117'}}>
                  <div className="h-3 w-3/4 rounded" style={{backgroundColor:'#1f2937'}}/>
                  <div className="grid grid-cols-2 gap-1.5">{[1,2,3,4].map(i=><div key={i} className="h-8 rounded-lg border" style={{backgroundColor:'#161b27',borderColor:'#374151'}}/>)}</div>
                </div>
              </div>
            )},

                  <div className="w-5 h-5 rounded-lg" style={{backgroundColor:PRIMARY}} />

                <div className="flex-1 flex flex-col">
                  <div className="h-7 bg-white border-b border-gray-200 flex items-center px-2 gap-1">
                    <div className="h-2 w-16 bg-gray-200 rounded"/>
                    <div className="h-2 w-10 bg-gray-100 rounded ml-auto"/>
                  </div>
                  <div className="flex-1 p-2 grid grid-cols-3 gap-1">
                    {[1,2,3,4,5,6].map(i=><div key={i} className="bg-white rounded border border-gray-100"/>)}
                  </div>
                </div>
              </div>
            )},
        ];

        return (
          <div className="max-w-3xl space-y-10 animate-in fade-in duration-300">
            <section>
              <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Modelo de Layout</h3>
              <p className="text-xs text-gray-400 mb-4">Cada opção muda completamente a estrutura da interface.</p>
              <div className="grid grid-cols-3 gap-4">
                {LAYOUTS.map(opt => (
                  <button key={opt.id}
                    onClick={() => { saveCfg({ mode: opt.id }, 'overview'); }}
                    className={`p-4 rounded-2xl border-2 text-left transition-all hover:shadow-md ${layoutMode === opt.id ? 'border-gray-900 shadow-md bg-white' : 'border-gray-200 bg-white hover:border-gray-300'}`}>
                    {opt.preview}
                    <p className="font-bold text-gray-900 text-sm mt-3">{opt.label}</p>
                    <p className="text-xs text-gray-500 mt-0.5">{opt.desc}</p>
                    {layoutMode === opt.id && <span className="mt-2 inline-block text-[10px] font-extrabold px-2 py-0.5 rounded-full text-black" style={{backgroundColor:PRIMARY}}>● Ativo</span>}
                  </button>
                ))}
              </div>
            </section>

            <section>
              <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Cor dos Rótulos (nomes dos ícones)</h3>
              <p className="text-xs text-gray-400 mb-4">Aplica na cor do texto dos itens inativos do sidebar e da barra superior.</p>
              <div className="flex flex-wrap gap-3">
                {LABEL_COLORS.map(({ hex, name }) => (
                  <button key={hex} onClick={() => saveCfg({ labelColor: hex })} title={name}
                    className={`w-10 h-10 rounded-xl border-4 transition-all hover:scale-110 flex items-center justify-center ${labelColor === hex ? 'border-gray-900 scale-110 shadow-lg' : 'border-gray-200'}`}
                    style={{ backgroundColor: hex === '#ffffff' ? '#f3f4f6' : hex }}>
                    {labelColor === hex && <div className="w-3 h-3 rounded-full bg-white/80 shadow"/>}
                  </button>
                ))}
              </div>
            </section>

            <section>
              <h3 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Abas — Visibilidade e Nomes</h3>
              <p className="text-xs text-gray-400 mb-4">No layout Sidebar, arraste os itens de Plataforma para reordenar. Aqui você oculta e renomeia.</p>
              <div className="space-y-2">
                {allTabs.map(tab => {
                  const hidden = hiddenTabs.includes(tab.id);
                  return (
                    <div key={tab.id} className={`flex items-center gap-4 px-4 py-3 rounded-xl border transition-all ${hidden ? 'opacity-40 bg-gray-50 border-gray-100' : 'bg-white border-gray-200'}`}>
                      <button onClick={() => saveCfg({ hidden: hidden ? hiddenTabs.filter(x=>x!==tab.id) : [...hiddenTabs,tab.id] })}
                        className={`relative w-9 h-5 rounded-full transition-colors shrink-0 ${hidden ? 'bg-gray-300' : 'bg-gray-900'}`}>
                        <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all ${hidden ? 'left-0.5' : 'left-4'}`}/>
                      </button>
                      <span className="text-[10px] font-extrabold text-gray-300 uppercase w-24 shrink-0">{tab.id}</span>
                      <input value={editLabels[tab.id] ?? tab.label}
                        onChange={e => setEditLabels(p=>({...p,[tab.id]:e.target.value}))}
                        onBlur={e => saveCfg({ labels: {...tabLabels,[tab.id]:e.target.value} })}
                        className="flex-1 text-sm font-semibold text-gray-900 bg-transparent border-b border-transparent hover:border-gray-200 focus:border-gray-400 outline-none py-0.5 transition-colors"/>
                    </div>
                  );
                })}
              </div>
            </section>

            <button onClick={() => saveCfg({ mode:'classic', labelColor:'#6b7280', hidden:[], labels:{}, platformOrder:PLATFORM_TABS.map(t=>t.id) }, 'overview')}
              className="px-4 py-2 rounded-xl border border-gray-200 text-sm font-bold text-gray-600 hover:bg-gray-50 transition-all">
              Restaurar padrões
            </button>
          </div>
        );
      };

      // ══════════════════════════════════════════
      // LAYOUT 1 — Sidebar Clássico
      // ══════════════════════════════════════════
      if (layoutMode === 'classic') {
        const navItem = (active) =>
          `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition-all select-none ${active ? 'text-black shadow-sm' : 'hover:bg-gray-100/80 hover:text-gray-900'}`;

        const sc = adminSideCollapsed;
        const navItemC = (active) =>
          `w-full flex items-center ${sc ? 'justify-center px-0 py-3' : 'gap-3 px-3 py-2.5'} rounded-xl text-sm font-semibold transition-all select-none ${active ? 'text-black shadow-sm' : 'hover:bg-gray-100/80 hover:text-gray-900'}`;

        return (
          <div className="h-screen w-full flex font-sans bg-gray-50 text-gray-900 overflow-hidden">
            <aside className={`relative z-20 ${sc ? 'w-[4.5rem]' : 'w-60'} h-full flex flex-col bg-white backdrop-blur-xl border-r border-gray-200/60 shrink-0 transition-all duration-300`}>
              {/* Collapse toggle */}
              <button onClick={() => setAdminSideCollapsed(c => !c)}
                className="absolute top-5 -right-3 z-50 w-6 h-6 rounded-full border border-gray-200 bg-white shadow-md flex items-center justify-center text-gray-500 hover:scale-110 transition-all">
                {sc ? <ChevronRight size={12}/> : <ChevronLeft size={12}/>}
              </button>

              <div className={`${sc ? 'p-2 justify-center' : 'p-4'} border-b border-gray-100 shrink-0 flex items-center gap-3`}>

    /* =========================================================
       DASHBOARD ROOT
       ========================================================= */
    const Dashboard = ({ initialAgent, onLogout }) => {
      const [agents, setAgents] = useState([]);
      const [currentAgent, setCurrentAgent] = useState(null);
      const [activeTab, setActiveTab] = useState('overview');
      const [isAgentOn, setIsAgentOn] = useState(true);
      const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem('pixt_dark_client') === '1'; } catch { return false; } });
      const toast = useToast();
      const primaryColor = '#c6f432';
      const borderLight = '#e2e8f0';

      const toggleDark = () => setDarkMode(d => { const next = !d; try { localStorage.setItem('pixt_dark_client', next ? '1' : '0'); } catch {} return next; });

      const loadAgents = useCallback(async () => {
        try {
          const data = await api('/agents');
          setAgents(data.agents);
          if (!currentAgent) {
            const target = (initialAgent && data.agents.find(a => a.slug === initialAgent.slug)) || data.agents[0];
            setCurrentAgent(target);
            setIsAgentOn(!!target.is_on);
          }
        } catch (e) { toast(e.message, 'error'); }
      }, [currentAgent, initialAgent, toast]);

      useEffect(() => { loadAgents(); }, []);

    /* =========================================================
       PLATFORM CONNECTION SYSTEM
       ========================================================= */
    const usePlatformConnections = () => {
      const SEL_KEY = 'pixt_traffic_selected_v3';
      const [status, setStatus] = useState({ meta: false, google: false });
      const [accounts, setAccounts] = useState({ meta: [], ga4: [] });
      const [selectedIds, setSelectedIds] = useState(() => { try { return JSON.parse(localStorage.getItem(SEL_KEY)||'{}'); } catch { return {}; } });
      const [loadingStatus, setLoadingStatus] = useState(true);

      const reload = useCallback(async () => {
        setLoadingStatus(true);
        try {
          const s = await api('/traffic/status');
          setStatus(s);
          if (s.meta) {
            try { const { accounts: a } = await api('/traffic/meta/accounts'); setAccounts(prev => ({ ...prev, meta: a||[] })); } catch {}
          }
          if (s.google) {
            try { const { properties } = await api('/traffic/ga4/properties'); setAccounts(prev => ({ ...prev, ga4: properties||[] })); } catch {}
          }
        } catch {} finally { setLoadingStatus(false); }
      }, []);

      useEffect(() => { reload(); }, [reload]);

      // Detecta retorno de OAuth pela URL
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const metaStatus = params.get('traffic_meta');
        const googleStatus = params.get('traffic_google');
        if (metaStatus || googleStatus) {
          window.history.replaceState({}, '', window.location.pathname);
          if (metaStatus === 'ok') { setTimeout(reload, 500); }
          if (googleStatus === 'ok') { setTimeout(reload, 500); }
        }
      }, [reload]);

      const connectPlatform = (platform) => {
        const token = auth.token || '';
        const authPath = platform === 'google' ? 'google' : 'meta';
        window.location.href = `${API_BASE}/traffic/${authPath}/auth?token=${token}`;
      };

      const disconnectPlatform = async (platform) => {
        const p = platform === 'ga4' ? 'google' : platform;
        await api(`/traffic/disconnect/${p}`, { method: 'DELETE' });
        setStatus(s => ({ ...s, [p]: false, google: p === 'google' ? false : s.google }));
        setAccounts(a => ({ ...a, [platform]: [] }));
      };

      const selectAccount = (platform, id) => {
        const next = { ...selectedIds, [platform]: id };
        setSelectedIds(next);
        localStorage.setItem(SEL_KEY, JSON.stringify(next));
      };

      const isConnected = p => {
        if (p === 'ga4') return status.google;
        if (p === 'gads') return status.google;
        return status[p] || false;
      };
      const getAccounts = p => {
        if (p === 'ga4') return accounts.ga4 || [];
        return accounts[p] || [];
      };
      const getSelectedAccount = p => {
        const saved = selectedIds[p];
        const first = getAccounts(p)[0];
        return saved || first?.id || first?.property || '';
      };
      const getSeed = () => {
        const metaId = getSelectedAccount('meta') || getSelectedAccount('ga4') || '';
        return metaId.split('').reduce((a, c) => a + c.charCodeAt(0), 0) || 0;
      };

      return { isConnected, getSelectedAccount, getAccounts, connectPlatform, disconnectPlatform, selectAccount, getSeed, loadingStatus, reload };
    };

    const ConnectPlatformModal = ({ platform, title, icon: Icon, color, onConfirm, onClose }) => {
      const PERMS = {
        meta:['Ler métricas de campanhas e conjuntos de anúncios','Acessar gastos, CPM, CTR, CPC e ROAS','Visualizar leads gerados por anúncios','Ler relatórios de insights por período'],
        gads:['Acessar campanhas do Google Ads','Ler relatórios de conversão e CPA','Visualizar métricas de cliques e impressões','Acessar dados de orçamento e ROAS'],

      return createPortal(

              </div>

              <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Dados que serão lidos</p>
              <ul className="space-y-2 mb-6">
                {perms.map((p,i)=>(
                  <li key={i} className="flex items-center gap-2.5 text-sm text-gray-600">
