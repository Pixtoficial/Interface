                  <p className="text-xs text-gray-400 mb-2">Variáveis: <code className="bg-gray-100 px-1 rounded">{'{{nome}}'}</code> <code className="bg-gray-100 px-1 rounded">{'{{categoria}}'}</code> <code className="bg-gray-100 px-1 rounded">{'{{cidade}}'}</code></p>
                  <textarea
                    className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm resize-none outline-none focus:border-blue-400"
                    rows={4}
                    value={template}
                    onChange={e => setTemplate(e.target.value)}
                  />
                </div>
                <div className="mb-5 bg-gray-50 rounded-xl p-3 border border-gray-200">
                  <p className="text-[10px] font-bold text-gray-400 mb-1.5 uppercase">Pré-visualização</p>
                  <p className="text-sm text-gray-700">{preview}</p>
                </div>
                <div className="flex gap-3">
                  <button onClick={onClose} className="flex-1 py-3 border border-gray-200 rounded-xl font-bold text-sm hover:bg-gray-50">Cancelar</button>
                  <button onClick={send} disabled={sending || !template} className="flex-1 py-3 rounded-xl font-bold text-sm text-black disabled:opacity-50 flex items-center justify-center gap-2" style={{ backgroundColor: primaryColor }}>
                    {sending ? <Loader2 size={16} className="animate-spin" /> : <Send size={16} />}
                    {sending ? 'Enviando...' : 'Disparar'}
                  </button>
                </div>
              </>
            ) : (
              <div className="text-center py-4">
                <div className="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3"><CheckCircle size={28} className="text-green-600" /></div>
                <p className="text-xl font-black text-gray-900">{result.sent} enviado(s)</p>
                <p className="text-sm text-gray-500 mb-1">{result.errors?.length || 0} erro(s) de {result.total} leads</p>
                {result.errors?.length > 0 && (
                  <div className="mt-3 text-left bg-red-50 rounded-xl p-3 max-h-32 overflow-y-auto">
                    {result.errors.map((e, i) => <p key={i} className="text-xs text-red-700 font-medium">{e.name}: {e.error}</p>)}
                  </div>
                )}
                <button onClick={onSent} className="mt-4 px-6 py-2.5 rounded-xl font-bold text-sm text-black" style={{ backgroundColor: primaryColor }}>Fechar</button>
              </div>
            )}
          </div>
        </div>
      );
    };

    const LeadsImportadosTab = ({ primaryColor }) => {
      const toast = useToast();
      const [leads, setLeads] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [searchInput, setSearchInput] = useState('');
      const [total, setTotal] = useState(0);

      const load = async (q = '') => {
        setLoading(true);
        try {
          const params = new URLSearchParams({ limit: '200' });
          if (q) params.set('search', q);
          const d = await api(`/scrapper/leads?${params}`);
          setLeads(d.leads || []);
          setTotal(d.total || 0);
        } catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      };

      useEffect(() => { load(); }, []);

      const handleSearch = () => { setSearch(searchInput); load(searchInput); };

      const scoreColor = (s) => s >= 70 ? '#22c55e' : s >= 40 ? '#f59e0b' : '#ef4444';
      const scoreBg   = (s) => s >= 70 ? '#f0fdf4' : s >= 40 ? '#fffbeb' : '#fef2f2';

      const fmtPhone = (p) => {
        if (!p) return '—';
        const d = String(p).replace(/\D/g, '');
        if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
        if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
        return p;
      };

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
              <div>
                <h3 className="font-black text-gray-900 flex items-center gap-2"><Database size={18}/> Leads Importados</h3>
                <p className="text-xs text-gray-400 mt-0.5">{total} leads extraídos via scrapper</p>
              </div>
              <div className="flex gap-2">
                <input
                  value={searchInput}
                  onChange={e => setSearchInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleSearch()}
                  placeholder="Buscar por nome..."
                  className="px-3 py-2 border border-gray-200 rounded-xl text-sm outline-none focus:border-blue-400 bg-gray-50 w-48"
                />
                <button onClick={handleSearch} className="px-4 py-2 rounded-xl text-sm font-bold text-black hover:opacity-90 transition" style={{backgroundColor:primaryColor}}>
                  Buscar
                </button>
              </div>
            </div>

            {loading ? (
              <div className="flex items-center justify-center py-16 gap-2 text-gray-400">
                <Loader2 size={20} className="animate-spin"/> Carregando leads...
              </div>
            ) : leads.length === 0 ? (
              <div className="py-16 text-center text-gray-400">
                <Database size={36} className="mx-auto mb-3 opacity-30"/>
                <p className="font-semibold">Nenhum lead importado ainda.</p>
                <p className="text-xs mt-1">Use o Scrapper de Leads para extrair e importar empresas.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-gray-100">
                      {['Empresa', 'Nota ICP', 'Email', 'Telefone', 'Site', 'Cidade', 'Categoria'].map(h => (
                        <th key={h} className="text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider pb-3 pr-4 whitespace-nowrap">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-50">
                    {leads.map(l => (
                      <tr key={l.id} className="hover:bg-gray-50 transition-colors">
                        <td className="py-3 pr-4">
                          <div className="font-semibold text-gray-900 max-w-[180px] truncate" title={l.name}>{l.name}</div>
                          {l.insight && <p className="text-[10px] text-gray-400 truncate max-w-[180px]" title={l.insight}>{l.insight}</p>}
                        </td>
                        <td className="py-3 pr-4">
                          <div className="flex items-center gap-2">
                            <div className="w-24 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                              <div className="h-full rounded-full" style={{width:`${l.score||0}%`, backgroundColor:scoreColor(l.score||0)}}/>
                            </div>
                            <span className="text-xs font-bold px-2 py-0.5 rounded-full" style={{color:scoreColor(l.score||0), backgroundColor:scoreBg(l.score||0)}}>
                              {l.score||0}
                            </span>
                          </div>
                        </td>
                        <td className="py-3 pr-4 text-gray-400 text-xs">—</td>
                        <td className="py-3 pr-4">
                          {l.phone ? (
                            <a href={`tel:+55${l.phone}`} className="text-blue-600 hover:underline text-xs font-mono">{fmtPhone(l.phone)}</a>
                          ) : <span className="text-gray-300 text-xs">—</span>}
                        </td>
                        <td className="py-3 pr-4">
                          {l.website ? (
                            <a href={l.website.startsWith('http') ? l.website : `https://${l.website}`} target="_blank" rel="noopener noreferrer"
                              className="text-blue-600 hover:underline text-xs truncate max-w-[140px] block" title={l.website}>
                              {l.website.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}
                            </a>
                          ) : <span className="text-gray-300 text-xs">—</span>}
                        </td>
                        <td className="py-3 pr-4 text-xs text-gray-500">{l.city || '—'}</td>
                        <td className="py-3 pr-4">
                          {l.category ? (
                            <span className="text-[10px] font-medium bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{l.category}</span>
                          ) : <span className="text-gray-300 text-xs">—</span>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    const ScrapperTab = ({ agent, primaryColor }) => {
      const toast = useToast();
      const [filters, setFilters] = useState({ search_term: '', location: '', max_results: 50, min_rating: '' });
      const [currentRun, setCurrentRun] = useState(null);
      const [leads, setLeads] = useState([]);
      const [selected, setSelected] = useState(new Set());
      const [busy, setBusy] = useState(false);
      const [importing, setImporting] = useState(false);
      const [prospectModal, setProspectModal] = useState(false);
      const pollRef = useRef(null);

      useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

      const startPolling = (runId) => {
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(async () => {
          try {
            const { run } = await api(`/scrapper/runs/${runId}/status`);
            setCurrentRun(run);
            if (run.status === 'ready_to_analyze') {
              clearInterval(pollRef.current);
              analyzeRun(runId);
            } else if (run.status === 'done' || run.status === 'failed') {
              clearInterval(pollRef.current);
              if (run.status === 'done') fetchResults(runId);
            }
          } catch {}
        }, 5000);
      };

      const analyzeRun = async (runId) => {
        setCurrentRun(r => ({ ...r, status: 'analyzing' }));
        try {
          const data = await api(`/scrapper/runs/${runId}/analyze`, { method: 'POST' });
          setLeads(data.leads || []);
          setCurrentRun(r => ({ ...r, status: 'done', results_count: data.leads?.length || 0 }));
        } catch (e) { toast(e.message, 'error'); setCurrentRun(r => ({ ...r, status: 'failed' })); }
      };

      const fetchResults = async (runId) => {
        try {
          const { leads: l } = await api(`/scrapper/runs/${runId}/results`);
          setLeads(l || []);
        } catch {}
      };

      const startRun = async () => {
        if (!filters.search_term.trim()) return;
        setBusy(true);
        if (pollRef.current) clearInterval(pollRef.current);
        setLeads([]); setSelected(new Set());
        try {
          const { run } = await api('/scrapper/run', { method: 'POST', body: JSON.stringify(filters) });
          setCurrentRun(run);
          startPolling(run.id);
        } catch (e) { toast(e.message, 'error'); }
        finally { setBusy(false); }
      };

      const importSelected = async () => {
        if (!selected.size || !currentRun) return;
        setImporting(true);
        try {
          const { count } = await api(`/scrapper/runs/${currentRun.id}/import`, {
            method: 'POST',
            body: JSON.stringify({ lead_ids: [...selected] }),
          });
          toast(`${count} lead(s) importado(s) para o Pipeline!`, 'success');
          setSelected(new Set());
          setLeads(ls => ls.map(l => selected.has(l.id) ? { ...l, imported: true } : l));
        } catch (e) { toast(e.message, 'error'); }
        finally { setImporting(false); }
      };

      const statusConfig = {
        running:          { label: 'Buscando no Google Maps...', color: 'bg-blue-100 text-blue-700', pulse: true },
        ready_to_analyze: { label: 'Iniciando análise IA...', color: 'bg-yellow-100 text-yellow-700', pulse: true },
        analyzing:        { label: 'Analisando com IA...', color: 'bg-yellow-100 text-yellow-700', pulse: true },
        done:             { label: `${currentRun?.results_count || 0} leads analisados`, color: 'bg-green-100 text-green-700', pulse: false },
        failed:           { label: 'Erro na busca', color: 'bg-red-100 text-red-700', pulse: false },
      };
      const sc = statusConfig[currentRun?.status];
      const isRunning = currentRun && ['running', 'ready_to_analyze', 'analyzing'].includes(currentRun.status);

      return (
        <div className="space-y-6">
          {/* Filters */}
          <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
            <h3 className="font-black text-gray-900 mb-4 flex items-center gap-2"><MapPin size={18} /> Busca no Google Maps</h3>
            <div className="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label className="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider">Termo de busca</label>
                <input
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 text-sm outline-none focus:border-blue-400"
                  placeholder="ex: restaurante, academia, clínica..."
                  value={filters.search_term}
                  onChange={e => setFilters(f => ({ ...f, search_term: e.target.value }))}
                  onKeyDown={e => e.key === 'Enter' && startRun()}
                />
              </div>
              <div>
                <label className="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider">Cidade / Bairro</label>
                <input
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 text-sm outline-none focus:border-blue-400"
                  placeholder="ex: São Paulo, SP"
                  value={filters.location}
                  onChange={e => setFilters(f => ({ ...f, location: e.target.value }))}
                />
              </div>
              <div>
                <label className="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider">Máx. resultados</label>
                <input type="number" min="5" max="200"
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 text-sm outline-none focus:border-blue-400"
                  value={filters.max_results}
                  onChange={e => setFilters(f => ({ ...f, max_results: parseInt(e.target.value) || 50 }))}
                />
              </div>
              <div>
                <label className="text-[10px] font-bold text-gray-400 mb-1.5 block uppercase tracking-wider">Avaliação mínima</label>
                <select
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl py-2.5 px-3 text-sm outline-none bg-white"
                  value={filters.min_rating}
                  onChange={e => setFilters(f => ({ ...f, min_rating: e.target.value }))}
                >
                  <option value="">Qualquer</option>
                  <option value="3">3+ estrelas</option>
                  <option value="4">4+ estrelas</option>
                  <option value="4.5">4.5+ estrelas</option>
                </select>
              </div>
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              <button
                onClick={startRun}
                disabled={busy || isRunning || !filters.search_term.trim()}
                className="flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-sm text-black disabled:opacity-50 transition hover:scale-[1.02]"
                style={{ backgroundColor: primaryColor }}
              >
                {busy ? <Loader2 size={16} className="animate-spin" /> : <Search size={16} />}
                Buscar e Analisar
              </button>
              {currentRun && sc && (
                <span className={`inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-full ${sc.color}`}>
                  {sc.pulse && <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse" />}
                  {sc.label}
                </span>
              )}
            </div>
            <p className="text-[11px] text-gray-400 mt-3">A análise de IA (score, faturamento estimado, porte, insight) é feita automaticamente após a busca.</p>
          </div>

          {/* Results table */}
          {leads.length > 0 && (
            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
              <div className="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
                <div className="flex items-center gap-3">
                  <h3 className="font-black text-gray-900">{leads.length} leads encontrados</h3>
                  {selected.size > 0 && <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">{selected.size} selecionados</span>}
                </div>
                <div className="flex items-center gap-2">
                  {selected.size > 0 && (
                    <>
                      <button
                        onClick={() => setProspectModal(true)}
                        className="text-xs font-bold px-3 py-1.5 rounded-lg border border-gray-200 hover:bg-gray-50 flex items-center gap-1.5 transition"
                      >
                        <Send size={13} /> Prospectar
                      </button>
                      <button
                        onClick={importSelected}
                        disabled={importing}
                        className="text-xs font-bold px-3 py-1.5 rounded-lg text-black flex items-center gap-1.5 transition hover:scale-[1.02]"
                        style={{ backgroundColor: primaryColor }}
                      >
                        {importing ? <Loader2 size={13} className="animate-spin" /> : <Plus size={13} />}
                        Importar Pipeline
                      </button>
                    </>
                  )}
                  <label className="flex items-center gap-1.5 text-xs text-gray-500 cursor-pointer select-none">
                    <input type="checkbox" checked={selected.size === leads.length && leads.length > 0} onChange={e => setSelected(e.target.checked ? new Set(leads.map(l => l.id)) : new Set())} className="rounded" />
                    Todos
                  </label>
                </div>
              </div>
              <div className="overflow-x-auto" style={{ maxHeight: '520px', overflowY: 'auto' }}>
                <table className="w-full text-sm">
                  <thead className="bg-gray-50 sticky top-0 z-10">
                    <tr>
                      <th className="w-8 px-4 py-2.5"></th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Empresa</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Categoria</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Telefone</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Score</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Faturamento</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Porte</th>
                      <th className="px-4 py-2.5 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Insight IA</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-50">
                    {leads.map(lead => {
                      const isSel = selected.has(lead.id);
                      const sizeColor = { grande: 'bg-blue-100 text-blue-700', media: 'bg-purple-100 text-purple-700', pequena: 'bg-green-100 text-green-700', micro: 'bg-gray-100 text-gray-600' };
                      const scoreColor = lead.score >= 70 ? '#c6f432' : lead.score >= 40 ? '#fbbf24' : '#f87171';
                      return (
                        <tr
                          key={lead.id}
                          onClick={() => { const s = new Set(selected); isSel ? s.delete(lead.id) : s.add(lead.id); setSelected(s); }}
                          className={`cursor-pointer transition-colors hover:bg-gray-50 ${isSel ? 'bg-lime-50' : ''} ${lead.imported ? 'opacity-60' : ''}`}
                        >
                          <td className="px-4 py-3" onClick={e => e.stopPropagation()}>
                            <input type="checkbox" checked={isSel} onChange={e => { const s = new Set(selected); e.target.checked ? s.add(lead.id) : s.delete(lead.id); setSelected(s); }} className="rounded" />
                          </td>
                          <td className="px-4 py-3">
                            <div className="font-semibold text-gray-900 text-sm max-w-[150px] truncate">{lead.name}</div>
                            {lead.city && <div className="text-xs text-gray-400">{lead.city}</div>}
                            {lead.imported && <span className="text-[9px] font-bold text-green-600 bg-green-50 px-1.5 py-0.5 rounded">Importado</span>}
                          </td>
                          <td className="px-4 py-3 text-xs text-gray-500 max-w-[120px] truncate">{lead.category || '—'}</td>
                          <td className="px-4 py-3 font-mono text-xs text-gray-600">{lead.phone ? `+55 ${lead.phone.replace(/(\d{2})(\d{4,5})(\d{4})$/, '($1) $2-$3')}` : '—'}</td>
                          <td className="px-4 py-3">
                            <div className="flex items-center gap-2">
                              <div className="h-1.5 w-14 bg-gray-100 rounded-full overflow-hidden shrink-0">
                                <div className="h-full rounded-full transition-all" style={{ width: `${lead.score}%`, backgroundColor: scoreColor }} />
                              </div>
                              <span className="font-bold text-xs">{lead.score}</span>
                            </div>
                          </td>
                          <td className="px-4 py-3 text-xs text-gray-600 whitespace-nowrap">{lead.revenue_estimate || '—'}</td>
                          <td className="px-4 py-3">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${sizeColor[lead.company_size] || 'bg-gray-100 text-gray-600'}`}>{lead.company_size || 'micro'}</span>
                          </td>
                          <td className="px-4 py-3 text-xs text-gray-500 max-w-[220px]">{lead.insight || '—'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Prospect modal */}
          {prospectModal && (
            <ProspectModal
              leads={leads.filter(l => selected.has(l.id))}
              onClose={() => setProspectModal(false)}
              primaryColor={primaryColor}
              runId={currentRun?.id}
              onSent={() => { setProspectModal(false); setSelected(new Set()); }}
            />
          )}
        </div>
      );
    };

    /* =========================================================
       SETTINGS TAB
       ========================================================= */
    const SettingsTab = ({ agent, primaryColor }) => {
      const isAdmin = auth.user?.role === 'admin';
      return isAdmin
        ? <AdminSettingsView agent={agent} primaryColor={primaryColor} />
        : <ClientSettingsView agent={agent} primaryColor={primaryColor} />;
    };

    /* -- Google Calendar Card (Booker / LeadFlow) -- */
    const GoogleCalendarCard = ({ primaryColor }) => {
      const [gcStatus, setGcStatus] = useState(null); // null=loading, false=not connected, true=connected
      const [gcEvents, setGcEvents] = useState([]);
      const [loadingEvts, setLoadingEvts] = useState(false);
      const toast = useToast();

      useEffect(() => {
        api('/traffic/status').then(s => {
          setGcStatus(s.google);
          if (s.google) {
            setLoadingEvts(true);
            api('/traffic/calendar/events').then(d => setGcEvents(d.events || [])).catch(() => {}).finally(() => setLoadingEvts(false));
          }
        }).catch(() => setGcStatus(false));
      }, []);

      const connect = () => {
        window.location.href = `${API_BASE}/traffic/google/auth?token=${auth.token || ''}`;
      };
      const disconnect = async () => {
        await api('/traffic/disconnect/google', { method: 'DELETE' });
        setGcStatus(false); setGcEvents([]);
        toast('Google Agenda desconectado', 'success');
      };

      const fmtEvt = (ev) => {
        const start = ev.start?.dateTime || ev.start?.date || '';
        const d = start ? new Date(start) : null;
        return d ? `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}` : '';
      };

      return (
        <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 shrink-0">
          <div className="flex items-center gap-3 mb-5">
            <div className="p-2.5 bg-red-100 text-red-600 rounded-lg"><Calendar size={20}/></div>
            <div>
              <h2 className="text-xl font-bold text-gray-900">Google Agenda</h2>
              <p className="text-xs text-gray-500 mt-0.5">Sincronize reuniões e disponibilidade</p>
            </div>
          </div>
          {gcStatus === null && (
            <div className="flex items-center gap-2 text-sm text-gray-400"><Loader2 size={14} className="animate-spin"/> Verificando conexão...</div>
          )}
          {gcStatus === false && (
            <div>
              <p className="text-sm text-gray-600 mb-4 leading-relaxed">Conecte sua conta Google para que o agente consulte sua disponibilidade real e crie reuniões automaticamente no seu calendário.</p>
              <button onClick={connect} className="flex items-center gap-2 px-5 py-3 rounded-xl font-bold text-sm text-black hover:opacity-90 transition w-full justify-center" style={{backgroundColor:primaryColor}}>
                <Globe size={16}/> Conectar Google Agenda
              </button>
            </div>
          )}
          {gcStatus === true && (
            <div>
              <div className="flex items-center justify-between mb-4">
                <span className="inline-flex items-center gap-1.5 text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1.5 rounded-full"><CheckCircle2 size={11}/> Conectado</span>
                <button onClick={disconnect} className="text-xs text-red-500 hover:text-red-700 font-semibold flex items-center gap-1"><Unlink size={11}/> Desconectar</button>
              </div>
              {loadingEvts ? (
                <div className="flex items-center gap-2 text-xs text-gray-400 py-4 justify-center"><Loader2 size={12} className="animate-spin"/> Carregando eventos...</div>
              ) : gcEvents.length === 0 ? (
                <p className="text-xs text-gray-400 py-4 text-center">Nenhum evento nos próximos 30 dias</p>
              ) : (
                <div className="space-y-2 max-h-52 overflow-y-auto">
                  {gcEvents.slice(0, 8).map(ev => (
                    <div key={ev.id} className="flex items-start gap-3 p-2.5 bg-gray-50 rounded-xl">
                      <div className="w-1.5 h-1.5 rounded-full bg-red-400 mt-1.5 shrink-0"/>
                      <div className="min-w-0">
                        <p className="text-xs font-bold text-gray-900 truncate">{ev.summary || '(sem título)'}</p>
                        <p className="text-[10px] text-gray-500">{fmtEvt(ev)}</p>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    /* -- Admin: configurações completas do agente (próprio admin) -- */
    const AdminSettingsView = ({ agent, primaryColor }) => {
      const [settings, setSettings] = useState({ script:'', max_lines:'3', response_time:'0', language_type:'casual', reminders_count:'3', reminders_times:'24h, 1h, 15m' });
      const [channels, setChannels] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const toast = useToast();

      // WhatsApp QR Connection
      const [showQRFlow, setShowQRFlow] = useState(false);
      const [newInstName, setNewInstName] = useState('');
      const [qrData, setQrData] = useState(null);
      const [connState, setConnState] = useState('idle'); // idle|creating|pending_scan|connected|error
      const qrPollRef = useRef(null);

      const stopQRPoll = () => { if (qrPollRef.current) { clearInterval(qrPollRef.current); qrPollRef.current = null; } };
      useEffect(() => () => stopQRPoll(), []);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const d = await api(`/settings/${agent.slug}`);
          setSettings(s => ({ ...s, ...d.settings }));
          setChannels(d.whatsapp_channels.length ? d.whatsapp_channels : []);
        } catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agent.slug, toast]);
      useEffect(() => { load(); }, [load]);

      const save = async () => {
        setSaving(true);
        try {
          await api(`/settings/${agent.slug}`, { method: 'PUT', body: JSON.stringify({ settings, whatsapp_channels: channels.filter(c => c.number) }) });
          toast('Ajustes guardados!', 'success');
        } catch (e) { toast(e.message, 'error'); }
        finally { setSaving(false); }
      };

      const set = (k, v) => setSettings(s => ({ ...s, [k]: v }));
      const updateCh = (idx, patch) => setChannels(cs => cs.map((c, i) => i === idx ? { ...c, ...patch } : c));
      const addCh = () => setChannels(cs => [...cs, { number: '', active: 1, evolution_instance: '' }]);
      const removeCh = (idx) => setChannels(cs => cs.filter((_, i) => i !== idx));

      const deleteInstance = async (instanceName) => {
        if (!confirm(`Desconectar a instância "${instanceName}"?`)) return;
        try {
          await api(`/whatsapp/instance/${instanceName}`, { method: 'DELETE' });
          toast('Instância removida!', 'success');
          load();
        } catch (e) { toast(e.message, 'error'); }
      };

      const startQRFlow = () => {
        setShowQRFlow(true); setConnState('idle'); setQrData(null);
        setNewInstName(`${agent.slug}-${Date.now().toString(36)}`);
      };

      const reconfigureWebhooks = async () => {
        try {
          const res = await api('/whatsapp/reconfigure-webhooks', { method: 'POST' });
          const ok = res.results?.filter(r => r.ok).length || 0;
          const fail = res.results?.filter(r => !r.ok).length || 0;
          toast(`Webhooks atualizados: ${ok} OK${fail ? `, ${fail} com erro` : ''}`, fail ? 'error' : 'success');
        } catch (e) { toast(e.message, 'error'); }
      };

      const createQRInstance = async () => {
        if (!newInstName.trim()) return;
        setConnState('creating');
        try {
          const data = await api('/whatsapp/create-instance', {
            method: 'POST',
            body: JSON.stringify({ name: newInstName.trim(), agent_slug: agent.slug }),
          });
          setQrData(data.qr);
          setConnState('pending_scan');
          // Poll status a cada 4s
          qrPollRef.current = setInterval(async () => {
            try {
              const { state } = await api(`/whatsapp/instance-status/${newInstName.trim()}`);
              if (state === 'open') {
                stopQRPoll();
                setConnState('connected');
                toast('WhatsApp conectado com sucesso!', 'success');
                setTimeout(async () => {
                  setShowQRFlow(false); setConnState('idle'); setQrData(null);
                  await load();
                }, 2500);
              } else if (state !== 'connecting' && state !== 'unknown') {
                // QR expirou, busca novo
                try {
                  const qrRes = await api(`/whatsapp/instance-qr/${newInstName.trim()}`);
                  if (qrRes.qr) setQrData(qrRes.qr);
                } catch {}
              }
            } catch {}
          }, 4000);
        } catch (e) { setConnState('error'); toast(e.message, 'error'); }
      };

      if (loading) return <Loading />;

      const webhookOrigin = window.location.origin;
      const userId = auth.user?.id || 'USER_ID';
      const copyToClipboard = (txt) => { navigator.clipboard.writeText(txt).catch(() => {}); toast('Copiado!', 'success'); };

      return (
        <div className="space-y-8 animate-in fade-in duration-500 shrink-0">
           {/* Webhook / n8n */}
           <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 shrink-0">
             <div className="flex items-center gap-3 mb-6">
               <div className="p-2.5 rounded-lg" style={{ backgroundColor: '#c6f432' }}><Zap size={20} className="text-black" /></div>
               <div><h2 className="text-xl font-bold text-gray-900">Integração Webhook / n8n</h2><p className="text-sm text-gray-500">URLs para receber dados do n8n ou de qualquer sistema externo.</p></div>
             </div>
             <div className="space-y-4">
               {[
                 { label: 'Espelhar Mensagem (POST)', url: `${webhookOrigin}/api/webhook/message` },
                 { label: 'Atualizar Lead (POST)', url: `${webhookOrigin}/api/webhook/lead` },
                 { label: 'Status do Agente (GET)', url: `${webhookOrigin}/api/webhook/status?user_id=${userId}&agent_slug=${agent.slug}` },
               ].map(({ label, url }) => (
                 <div key={label}>
                   <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase">{label}</label>
                   <div className="flex gap-2">
                     <input readOnly value={url} className="flex-1 px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-mono text-gray-700 outline-none" />
                     <button onClick={() => copyToClipboard(url)} className="px-4 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm font-bold transition shrink-0">📋</button>
                   </div>
                 </div>
               ))}
               <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                 <p className="font-bold text-amber-800 text-sm mb-1">Header obrigatório em todos os requests:</p>
                 <code className="text-xs text-amber-700 font-mono">x-webhook-secret: &lt;WEBHOOK_SECRET do .env&gt;</code>
               </div>
             </div>
           </div>

           <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
              <div className="space-y-8">
                 {/* Canais */}
                 <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 shrink-0">
                    <div className="flex items-center justify-between mb-6 shrink-0">
                      <div className="flex items-center gap-3"><div className="p-2.5 bg-green-100 text-green-700 rounded-lg"><Smartphone size={20} /></div><div><h2 className="text-xl font-bold text-gray-900">Canais WhatsApp</h2><p className="text-xs text-gray-500 mt-0.5">Conecte números e gerencie instâncias</p></div></div>
                      <button onClick={startQRFlow} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-black hover:opacity-90 transition" style={{backgroundColor:primaryColor}}><Plus size={15}/> Conectar Número</button>
                    </div>

                    {/* QR Flow */}
                    {showQRFlow && (
                      <div className="mb-5 p-5 border-2 border-dashed border-green-300 bg-green-50 rounded-2xl">
                        <div className="flex items-center justify-between mb-4">
                          <p className="font-bold text-gray-900 text-sm flex items-center gap-2"><Smartphone size={15} className="text-green-600"/> Conectar Novo Número WhatsApp</p>
                          <button onClick={() => { stopQRPoll(); setShowQRFlow(false); setConnState('idle'); setQrData(null); }} className="p-1 rounded-lg hover:bg-green-100 text-gray-500"><X size={16}/></button>
                        </div>
                        {connState === 'idle' && (
                          <div className="flex gap-2">
                            <input value={newInstName} onChange={e => setNewInstName(e.target.value.replace(/\s/g,''))}
                              placeholder="nome-da-instancia (sem espaços)"
                              className="flex-1 px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white outline-none focus:border-green-400 font-mono"/>
                            <button onClick={createQRInstance} disabled={!newInstName.trim()} className="px-5 py-2.5 rounded-xl font-bold text-sm text-black disabled:opacity-50 hover:opacity-90" style={{backgroundColor:primaryColor}}>Gerar QR</button>
                          </div>
                        )}
                        {connState === 'creating' && (
                          <div className="flex items-center gap-2 text-sm text-gray-600 py-4 justify-center"><Loader2 size={18} className="animate-spin text-green-600"/> Criando instância na Evolution API...</div>
                        )}
                        {connState === 'pending_scan' && (
                          <div className="flex flex-col items-center gap-4 py-2">
                            <p className="text-sm text-gray-600 font-medium">Escaneie o QR Code com o WhatsApp do número que deseja conectar</p>
                            {qrData ? (
                              qrData.base64 ? (
                                <img src={qrData.base64.startsWith('data:') ? qrData.base64 : `data:image/png;base64,${qrData.base64}`} alt="QR Code WhatsApp" className="w-52 h-52 rounded-2xl border-4 border-white shadow-lg"/>
                              ) : (qrData.code || typeof qrData === 'string') ? (
                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=210x210&data=${encodeURIComponent(qrData.code || qrData)}`} alt="QR Code WhatsApp" className="w-52 h-52 rounded-2xl border-4 border-white shadow-lg"/>
                              ) : (
                                <div className="w-52 h-52 bg-white rounded-2xl flex items-center justify-center text-xs text-gray-400 text-center p-4">QR disponível na Evolution API. Acesse e escaneie manualmente.</div>
                              )
                            ) : (
                              <div className="flex items-center gap-2 text-sm text-gray-500"><Loader2 size={16} className="animate-spin"/> Carregando QR...</div>
                            )}
                            <div className="flex items-center gap-2 text-xs font-bold text-amber-700 bg-amber-100 px-4 py-2 rounded-full">
                              <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"/>Aguardando conexão... (atualiza automaticamente)
                            </div>
                            <p className="text-[10px] text-gray-400">Instância: <code className="font-mono">{newInstName}</code></p>
                          </div>
                        )}
                        {connState === 'connected' && (
                          <div className="flex flex-col items-center gap-3 py-6">
                            <div className="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center"><CheckCircle size={28} className="text-green-600"/></div>
                            <p className="text-lg font-black text-green-700">WhatsApp Conectado!</p>
                            <p className="text-xs text-gray-500 font-mono">{newInstName}</p>
                            <p className="text-xs text-gray-400">O agente já está respondendo mensagens neste número.</p>
                          </div>
                        )}
                        {connState === 'error' && (
                          <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-xs text-red-700 font-medium">
                            Erro ao criar instância. Verifique se o nome não está em uso e tente novamente.
                          </div>
                        )}
                      </div>
                    )}

                    {/* Lista de canais */}
                    {channels.length === 0 && !showQRFlow && (
                      <div className="py-8 text-center text-sm text-gray-400">
                        <Smartphone size={32} className="mx-auto mb-2 opacity-30"/>
                        Nenhum número conectado ainda. Clique em <strong>Conectar Número</strong>.
                      </div>
                    )}
                    {channels.map((ch, idx) => (
                      <div key={idx} className="mb-3 p-4 bg-gray-50 border border-gray-200 rounded-2xl">
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <div className={`w-2.5 h-2.5 rounded-full ${ch.active ? 'bg-green-500' : 'bg-gray-300'}`}/>
                            <span className="font-bold text-sm text-gray-900 font-mono">{ch.evolution_instance || 'sem instância'}</span>
                            {ch.number && <span className="text-xs text-gray-500">{ch.number}</span>}
                          </div>
                          <div className="flex items-center gap-2">
                            <label className="flex items-center gap-1.5 text-xs font-bold cursor-pointer">
                              <input type="checkbox" checked={!!ch.active} onChange={e => updateCh(idx, { active: e.target.checked ? 1 : 0 })} className="rounded"/>
                              {ch.active ? <span className="text-green-600">Ativo</span> : <span className="text-gray-400">Inativo</span>}
                            </label>
                            {ch.evolution_instance && (
                              <button onClick={() => deleteInstance(ch.evolution_instance)} title="Desconectar" className="p-1.5 rounded-lg text-red-400 hover:bg-red-50 hover:text-red-600 transition"><Unlink size={14}/></button>
                            )}
                            <button onClick={() => removeCh(idx)} className="p-1.5 rounded-lg text-gray-400 hover:bg-gray-200 transition"><Trash2 size={14}/></button>
                          </div>
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={ch.number} onChange={e => updateCh(idx, { number: e.target.value })} className="flex-1 px-3 py-2 bg-white border border-gray-200 rounded-xl outline-none focus:border-green-400 text-sm" placeholder="+55 (11) 99999-9999"/>
                          <input type="text" value={ch.evolution_instance || ''} onChange={e => updateCh(idx, { evolution_instance: e.target.value })} className="flex-1 px-3 py-2 bg-white border border-gray-200 rounded-xl outline-none focus:border-green-400 text-sm font-mono" placeholder="nome-da-instancia"/>
                        </div>
                      </div>
                    ))}
                    <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
                      <button onClick={addCh} className="flex items-center gap-2 text-sm font-bold text-gray-500 hover:text-gray-900 transition-colors"><Plus size={16}/> Adicionar canal manual</button>
                      {channels.length > 0 && (
                        <button onClick={reconfigureWebhooks} className="flex items-center gap-1.5 text-xs font-bold text-amber-600 hover:text-amber-800 transition-colors px-3 py-1.5 bg-amber-50 hover:bg-amber-100 rounded-lg border border-amber-200">
                          <RefreshCw size={12}/> Reconfigurar Webhooks
                        </button>
                      )}
                    </div>
                 </div>

                 {/* Script & IA */}
                 <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 flex flex-col shrink-0">
                    <div className="flex items-center gap-3 mb-6"><div className="p-2.5 bg-blue-100 text-blue-700 rounded-lg"><MessageSquare size={20} /></div><h2 className="text-xl font-bold text-gray-900">Script & IA</h2></div>
                    <textarea value={settings.script || ''} onChange={e => set('script', e.target.value)} className="w-full min-h-[130px] p-4 bg-white border rounded-xl text-sm mb-4 outline-none focus:border-blue-400 font-medium" placeholder="Você é um assistente da empresa X. Seja cordial e objetivo." />
                    <div className="grid grid-cols-2 gap-4 pt-4 border-t">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Máx. Linhas</label>
                        <input type="number" min="1" max="20" value={settings.max_lines || 3} onChange={e => set('max_lines', e.target.value)} className="w-full px-4 py-2.5 border rounded-xl font-bold outline-none text-center" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Delay Resposta</label>
                        <select value={settings.response_time || '0'} onChange={e => set('response_time', e.target.value)} className="w-full px-4 py-2.5 border rounded-xl font-medium outline-none bg-white">
                          <option value="0">Imediato</option>
                          <option value="5">5 segundos</option>
                          <option value="10">10 segundos</option>
                          <option value="30">30 segundos</option>
                          <option value="60">1 minuto</option>
                        </select>
                      </div>
                    </div>
                    <div className="pt-4 mt-2">
                      <label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Tipo de Linguagem</label>
                      <div className="grid grid-cols-2 gap-2">
                        {[['casual','💬 Casual'],['formal','🎩 Formal'],['tecnico','🔧 Técnico'],['vendas','🎯 Vendas']].map(([v, l]) => (
                          <button key={v} onClick={() => set('language_type', v)} className={`py-2.5 rounded-xl text-sm font-bold border-2 transition ${settings.language_type === v ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'}`}>{l}</button>
                        ))}
                      </div>
                    </div>
                    {agent.slug === 'booker' && (
                      <div className="pt-4 border-t mt-4 space-y-3">
                        <div><label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Qtd. Lembretes</label><input type="number" min="1" max="5" value={settings.reminders_count || 3} onChange={e => set('reminders_count', e.target.value)} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm font-medium focus:outline-none focus:border-yellow-400" /></div>
                        <div><label className="block text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">Tempos de Disparo</label><input type="text" value={settings.reminders_times || '24h, 1h, 15m'} onChange={e => set('reminders_times', e.target.value)} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-xl text-sm font-medium focus:outline-none focus:border-yellow-400" /></div>
                      </div>
                    )}
                 </div>
              </div>

              {/* Presença Digital + Google Calendar */}
              <div className="space-y-8 flex flex-col shrink-0">
                 <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 flex-1 shrink-0">
                    <div className="flex items-center gap-3 mb-6"><div className="p-2.5 bg-orange-100 text-orange-700 rounded-lg"><Globe size={20} /></div><h2 className="text-xl font-bold text-gray-900">Presença Digital</h2></div>
                    <div className="space-y-5">
                       <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Globe size={14} /> Site Oficial</label><input type="url" value={settings.site || ''} onChange={e => set('site', e.target.value)} placeholder="https://..." className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium" /></div>
                       <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Instagram size={14} /> Instagram</label><input type="url" value={settings.instagram || ''} onChange={e => set('instagram', e.target.value)} placeholder="https://..." className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium" /></div>
                       <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Linkedin size={14} /> LinkedIn Business</label><input type="url" value={settings.linkedin || ''} onChange={e => set('linkedin', e.target.value)} placeholder="https://..." className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium" /></div>
                    </div>
                 </div>

                 {/* Google Agenda — apenas booker e leadflow */}
                 {(agent.slug === 'booker' || agent.slug === 'leadflow') && (
                   <GoogleCalendarCard primaryColor={primaryColor} />
                 )}
              </div>
           </div>
           <div className="flex justify-end pt-4 shrink-0">
             <button onClick={save} disabled={saving} className="px-8 py-4 rounded-xl font-bold text-black shadow-[0_5px_15px_rgba(198,244,50,0.2)] hover:scale-105 transition-all flex items-center gap-2 disabled:opacity-60" style={{ backgroundColor: primaryColor }}>
               {saving ? <Loader2 size={16} className="animate-spin"/> : <Save size={16} />}
               Guardar Ajustes
             </button>
           </div>
        </div>
      );
    };

    /* -- Cliente: presença digital + config do agente + ICP -- */
    const ClientSettingsView = ({ agent, primaryColor }) => {
      const [settingsTab, setSettingsTab] = useState('presenca');
      const [settings, setSettings] = useState({ display_number:'', site:'', instagram:'', linkedin:'', script:'', max_lines:'3', response_time:'0', language_type:'casual', reminders_count:'3', reminders_times:'24h, 1h, 15m' });
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const toast = useToast();

      const [icp, setIcp] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pixt_icp_'+agent.slug) || 'null') || { budget_min:'', budget_max:'', company_size:'', industries:'', regions:'', pain_points:'', decision_maker:'', timeline:'', notes:'' }; } catch { return { budget_min:'', budget_max:'', company_size:'', industries:'', regions:'', pain_points:'', decision_maker:'', timeline:'', notes:'' }; }
      });
      const saveIcp = (v) => { setIcp(v); localStorage.setItem('pixt_icp_'+agent.slug, JSON.stringify(v)); toast('ICP salvo!', 'success'); };

      const [kb, setKb] = useState(() => { try { return JSON.parse(localStorage.getItem('pixt_kb_'+agent.slug)||'[]'); } catch { return []; } });
      const kbFileRef = useRef(null);
      const addKbDoc = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const doc = { id: Date.now(), name: file.name, size: (file.size/1024).toFixed(1)+'KB', ts: new Date().toISOString() };
        const next = [...kb, doc];
        setKb(next); localStorage.setItem('pixt_kb_'+agent.slug, JSON.stringify(next));
        e.target.value = '';
      };
      const removeKbDoc = (id) => { const next = kb.filter(d=>d.id!==id); setKb(next); localStorage.setItem('pixt_kb_'+agent.slug, JSON.stringify(next)); };

      const [sla, setSla] = useState(() => { try { return JSON.parse(localStorage.getItem('pixt_sla_'+agent.slug)||'null') || { primeiro_contato:'2', resposta_humano:'1', alerta_atraso:'80' }; } catch { return { primeiro_contato:'2', resposta_humano:'1', alerta_atraso:'80' }; } });
      const saveSla = (v) => { setSla(v); localStorage.setItem('pixt_sla_'+agent.slug, JSON.stringify(v)); toast('Configurações de tempo salvas!', 'success'); };

      /* ── Follow-ups configuráveis ── */
      const defFollowup = { time: '24', unit: 'h', message: '' };
      const [followups, setFollowups] = useState(() => {
        try { const f = JSON.parse(localStorage.getItem('pixt_followups_'+agent.slug)||'null'); return f || [{ ...defFollowup }, { ...defFollowup, time:'48' }, { ...defFollowup, time:'72' }]; } catch { return [{ ...defFollowup }, { ...defFollowup, time:'48' }, { ...defFollowup, time:'72' }]; }
      });
      const saveFollowups = (v) => { setFollowups(v); localStorage.setItem('pixt_followups_'+agent.slug, JSON.stringify(v)); toast('Follow-ups salvos!', 'success'); };
      const updateFollowup = (i, k, v) => setFollowups(fs => fs.map((f, idx) => idx===i ? {...f, [k]:v} : f));
      const addFollowup = () => setFollowups(fs => [...fs, { ...defFollowup, time: String((fs.length+1)*24) }]);
      const removeFollowup = (i) => setFollowups(fs => fs.filter((_,idx) => idx!==i));
      const ORDINALS = ['1º Follow-up','2º Follow-up','3º Follow-up','4º Follow-up','5º Follow-up','6º Follow-up','7º Follow-up'];

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const d = await api(`/settings/${agent.slug}`);
          setSettings(s => ({ ...s, ...d.settings }));
        } catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [agent.slug, toast]);
      useEffect(() => { load(); }, [load]);

      const set = (k, v) => setSettings(s => ({ ...s, [k]: v }));

      const save = async () => {
        setSaving(true);
        try {
          await api(`/settings/${agent.slug}`, { method: 'PUT', body: JSON.stringify({ settings }) });
          toast('Preferências salvas!', 'success');
        } catch (e) { toast(e.message, 'error'); }
        finally { setSaving(false); }
      };

      if (loading) return <Loading />;

      const STABS = [
        {id:'presenca',  l:'Presença Digital'},
        {id:'agente',    l:'Configurações do Agente'},
        {id:'followup',  l:'Follow-up'},
        {id:'icp',       l:'ICP — Perfil Ideal'},
      ];

      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="flex gap-1 bg-white border border-gray-200 rounded-2xl p-1.5 shadow-sm w-fit">
            {STABS.map(t => (
              <button key={t.id} onClick={() => setSettingsTab(t.id)}
                className={`px-4 py-2 rounded-xl text-sm font-bold transition-all ${settingsTab===t.id?'text-black shadow-sm':'text-gray-500 hover:text-gray-700'}`}
                style={settingsTab===t.id?{backgroundColor:primaryColor}:{}}>
                {t.l}
              </button>
            ))}
          </div>

          {settingsTab === 'presenca' && (
            <div className="max-w-xl space-y-8">
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200">
                <div className="flex items-center gap-3 mb-6"><div className="p-2.5 bg-green-100 text-green-700 rounded-lg"><Smartphone size={20}/></div><h2 className="text-xl font-bold text-gray-900">Número de Atendimento</h2></div>
                <p className="text-sm text-gray-500 mb-4">Número do WhatsApp que seus clientes vão utilizar para entrar em contato.</p>
                <input type="text" value={settings.display_number||''} onChange={e=>set('display_number',e.target.value)} placeholder="+55 (11) 99999-9999" className="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl outline-none focus:border-green-400 font-medium"/>
              </div>
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200">
                <div className="flex items-center gap-3 mb-6"><div className="p-2.5 bg-orange-100 text-orange-700 rounded-lg"><Globe size={20}/></div><h2 className="text-xl font-bold text-gray-900">Presença Digital</h2></div>
                <div className="space-y-5">
                  <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Globe size={14}/> Site Oficial</label><input type="url" value={settings.site||''} onChange={e=>set('site',e.target.value)} placeholder="https://..." className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium"/></div>
                  <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Instagram size={14}/> Instagram</label><input type="url" value={settings.instagram||''} onChange={e=>set('instagram',e.target.value)} placeholder="https://instagram.com/suaempresa" className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium"/></div>
                  <div><label className="flex items-center gap-2 text-xs font-bold text-gray-500 mb-2 uppercase"><Linkedin size={14}/> LinkedIn</label><input type="url" value={settings.linkedin||''} onChange={e=>set('linkedin',e.target.value)} placeholder="https://linkedin.com/company/..." className="w-full px-4 py-3 bg-white border rounded-xl outline-none focus:border-orange-400 font-medium"/></div>
                </div>
              </div>
              <div className="flex justify-end">
                <button onClick={save} disabled={saving} className="px-8 py-4 rounded-xl font-bold text-black hover:scale-105 transition-all flex items-center gap-2 disabled:opacity-60" style={{backgroundColor:primaryColor}}>
                  {saving?<Loader2 size={16} className="animate-spin"/>:<Save size={16}/>} Salvar Preferências
                </button>
              </div>
            </div>
          )}

          {settingsTab === 'agente' && (
            <div className="max-w-2xl space-y-6">
              {/* Script */}
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 min-h-[220px]">
                <div className="flex items-center gap-3 mb-5"><div className="p-2.5 rounded-lg" style={{backgroundColor:primaryColor}}><Bot size={20} className="text-black"/></div><div><h2 className="text-xl font-bold text-gray-900">Script do Agente</h2><p className="text-sm text-gray-500">Instruções que definem como o agente se comporta.</p></div></div>
                <textarea value={settings.script||''} onChange={e=>set('script',e.target.value)} rows={5} className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none resize-none font-mono text-sm focus:border-gray-400" placeholder="Ex: Você é um especialista em vendas da empresa X. Seu objetivo é..."/>
              </div>

              {/* Configurações de Resposta */}
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 min-h-[220px]">
                <div className="flex items-center gap-3 mb-5"><div className="p-2.5 bg-blue-100 text-blue-700 rounded-lg"><MessageSquare size={20}/></div><div><h2 className="text-xl font-bold text-gray-900">Configurações de Resposta</h2><p className="text-sm text-gray-500">Comportamento e velocidade do agente.</p></div></div>
                <div className="space-y-4">
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-2 block">Velocidade de Resposta do Agente</label>
                    <p className="text-xs text-gray-400 mb-2">Em quanto tempo (segundos) o agente irá responder as mensagens.</p>
                    <select value={settings.response_time||'5'} onChange={e=>set('response_time',e.target.value)} className="w-full px-3 py-2.5 border border-gray-200 rounded-xl outline-none text-sm font-medium bg-white focus:border-blue-400">
                      <option value="3">3 segundos — Ultra rápido</option>
                      <option value="5">5 segundos — Muito rápido</option>
                      <option value="10">10 segundos — Rápido</option>
                      <option value="15">15 segundos — Normal</option>
                      <option value="20">20 segundos — Moderado</option>
                      <option value="30">30 segundos — Pausado</option>
                      <option value="45">45 segundos — Lento</option>
                      <option value="60">60 segundos — Muito lento</option>
                      <option value="120">2 minutos — Deliberativo</option>
                    </select>
                  </div>
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-2 block">Máx. linhas por resposta</label>
                    <select value={settings.max_lines||'3'} onChange={e=>set('max_lines',e.target.value)} className="w-full px-3 py-2.5 border border-gray-200 rounded-xl outline-none text-sm font-medium bg-white focus:border-blue-400">
                      {['1','2','3','4','5','6','8','10'].map(n=><option key={n} value={n}>{n} linhas</option>)}
                    </select>
                  </div>
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-2 block">Tipo de Linguagem</label>
                    <select value={settings.language_type||'casual'} onChange={e=>set('language_type',e.target.value)} className="w-full px-3 py-2.5 border border-gray-200 rounded-xl outline-none text-sm font-medium bg-white focus:border-blue-400">
                      <option value="casual">Casual e amigável</option>
                      <option value="formal">Formal e profissional</option>
                      <option value="technical">Técnico e direto</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* Base de Conhecimento */}
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200 min-h-[220px]">
                <div className="flex items-center justify-between mb-5">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-indigo-100 text-indigo-700 rounded-lg"><FileText size={20}/></div>
                    <div><h2 className="text-xl font-bold text-gray-900">Base de Conhecimento</h2><p className="text-sm text-gray-500">Documentos que o agente usa como referência.</p></div>
                  </div>
                  <button onClick={() => kbFileRef.current?.click()}
                    className="flex items-center gap-1.5 px-4 py-2 rounded-xl font-bold text-sm text-black hover:opacity-80 transition-all"
                    style={{ backgroundColor: primaryColor }}>
                    <UploadCloud size={15}/> Importar
                  </button>
                  <input ref={kbFileRef} type="file" className="hidden" accept=".pdf,.txt,.doc,.docx,.md" onChange={addKbDoc}/>
                </div>
                {kb.length === 0 ? (
                  <div className="text-center py-10 text-gray-300">
                    <FileText size={36} className="mx-auto mb-2 opacity-40"/>
                    <p className="font-semibold text-gray-400 text-sm">Nenhum documento importado.</p>
                    <p className="text-xs text-gray-300 mt-1">Suporta PDF, TXT, DOC, DOCX, MD</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {kb.map(doc => (
                      <div key={doc.id} className="flex items-center gap-3 p-3 bg-gray-50 border border-gray-100 rounded-xl hover:border-gray-200 transition-colors">
                        <div className="p-1.5 bg-indigo-50 rounded-lg shrink-0"><FileText size={14} className="text-indigo-600"/></div>
                        <div className="flex-1 min-w-0">
                          <p className="font-bold text-sm text-gray-800 truncate">{doc.name}</p>
                          <p className="text-[10px] text-gray-400">{doc.size} · {new Date(doc.ts).toLocaleDateString('pt-BR')}</p>
                        </div>
                        <button onClick={() => removeKbDoc(doc.id)} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400 transition-colors shrink-0"><Trash2 size={13}/></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {(agent.slug === 'booker' || agent.slug === 'leadflow') && (
                <GoogleCalendarCard primaryColor={primaryColor} />
              )}

              <div className="flex justify-end">
                <button onClick={save} disabled={saving} className="px-8 py-4 rounded-xl font-bold text-black hover:scale-105 transition-all flex items-center gap-2 disabled:opacity-60" style={{backgroundColor:primaryColor}}>
                  {saving?<Loader2 size={16} className="animate-spin"/>:<Save size={16}/>} Salvar Configurações
                </button>
              </div>
            </div>
          )}

          {settingsTab === 'followup' && (
            <div className="max-w-2xl space-y-4">
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-6 shadow-sm border border-gray-200">
                <div className="flex items-center gap-3 mb-6">
                  <div className="p-2.5 rounded-lg" style={{backgroundColor:primaryColor}}><Send size={18} className="text-black"/></div>
                  <div><h2 className="text-xl font-bold text-gray-900">Configuração de Follow-ups</h2><p className="text-sm text-gray-500">Defina quando e como o agente vai retomar contato com leads sem resposta.</p></div>
                </div>
                <div className="space-y-3">
                  {followups.map((fu, i) => (
                    <div key={i} className="bg-gray-50 border border-gray-100 rounded-2xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-sm font-bold text-gray-800">{ORDINALS[i] || `${i+1}º Follow-up`}</span>
                        {followups.length > 1 && (
                          <button onClick={() => removeFollowup(i)} className="p-1.5 hover:bg-red-50 rounded-lg text-red-400 transition-colors"><Trash2 size={13}/></button>
                        )}
                      </div>
                      <div className="flex gap-3">
                        <div className="flex-1">
                          <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Enviar após</label>
                          <div className="flex gap-1.5">
                            <input type="number" min="1" value={fu.time} onChange={e => updateFollowup(i,'time',e.target.value)}
                              className="w-20 border border-gray-200 rounded-xl px-3 py-2 text-sm font-bold outline-none focus:border-gray-400 bg-white"/>
                            <select value={fu.unit} onChange={e => updateFollowup(i,'unit',e.target.value)}
                              className="flex-1 border border-gray-200 rounded-xl px-2 py-2 text-sm font-medium outline-none bg-white">
                              <option value="h">Horas</option>
                              <option value="d">Dias</option>
                              <option value="min">Minutos</option>
                            </select>
                          </div>
                        </div>
                        <div className="flex-1">
                          <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Estilo da mensagem</label>
                          <select value={fu.style||'leve'} onChange={e => updateFollowup(i,'style',e.target.value)}
                            className="w-full border border-gray-200 rounded-xl px-2 py-2 text-sm font-medium outline-none bg-white">
                            <option value="leve">Leve e amigável</option>
                            <option value="valor">Proposta de valor</option>
                            <option value="urgencia">Urgência</option>
                            <option value="ultima">Última tentativa</option>
                            <option value="personalizado">Personalizado</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold text-gray-400 uppercase mb-1 block">Mensagem (opcional)</label>
                        <textarea value={fu.message} onChange={e => updateFollowup(i,'message',e.target.value)}
                          rows={2} placeholder="Deixe em branco para usar o estilo padrão do agente..."
                          className="w-full px-3 py-2 border border-gray-200 rounded-xl outline-none text-sm resize-none bg-white focus:border-gray-400"/>
                      </div>
                    </div>
                  ))}
                </div>
                {followups.length < 7 && (
                  <button onClick={addFollowup}
                    className="mt-3 w-full flex items-center justify-center gap-2 py-3 border-2 border-dashed border-gray-200 rounded-2xl text-sm font-bold text-gray-400 hover:border-gray-400 hover:text-gray-600 transition-all">
                    <Plus size={15}/> Adicionar Follow-up
                  </button>
                )}
                <div className="flex justify-end mt-5">
                  <button onClick={() => saveFollowups(followups)}
                    className="px-8 py-3.5 rounded-xl font-bold text-black hover:scale-105 transition-all flex items-center gap-2"
                    style={{ backgroundColor: primaryColor }}>
                    <Save size={16}/> Salvar Follow-ups
                  </button>
                </div>
              </div>
            </div>
          )}

          {settingsTab === 'icp' && (
            <div className="max-w-2xl space-y-6">
              <div className="bg-white/80 backdrop-blur-sm rounded-[2rem] p-8 shadow-sm border border-gray-200">
                <div className="flex items-center gap-3 mb-2"><div className="p-2.5 bg-purple-100 text-purple-700 rounded-lg"><Target size={20}/></div><div><h2 className="text-xl font-bold text-gray-900">Perfil de Cliente Ideal (ICP)</h2><p className="text-sm text-gray-500">Defina seu cliente ideal para pontuar leads automaticamente.</p></div></div>
                <p className="text-xs text-gray-400 mb-6 mt-2 bg-purple-50 border border-purple-100 rounded-xl px-3 py-2">Quanto mais completo, mais precisa será a pontuação dos seus leads na pipeline.</p>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Budget Mínimo (R$)</label><input type="number" value={icp.budget_min} onChange={e=>setIcp(v=>({...v,budget_min:e.target.value}))} placeholder="5000" className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium"/></div>
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Budget Máximo (R$)</label><input type="number" value={icp.budget_max} onChange={e=>setIcp(v=>({...v,budget_max:e.target.value}))} placeholder="50000" className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium"/></div>
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Tamanho de Empresa</label><select value={icp.company_size} onChange={e=>setIcp(v=>({...v,company_size:e.target.value}))} className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium bg-white"><option value="">Qualquer tamanho</option><option value="solopreneur">Solopreneur</option><option value="pequena">Pequena (2-20)</option><option value="media">Média (21-200)</option><option value="grande">Grande (200+)</option></select></div>
                  <div><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Prazo de Decisão</label><select value={icp.timeline} onChange={e=>setIcp(v=>({...v,timeline:e.target.value}))} className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium bg-white"><option value="">Qualquer prazo</option><option value="imediato">Imediato</option><option value="30dias">Até 30 dias</option><option value="90dias">Até 90 dias</option><option value="longo">Longo prazo</option></select></div>
                  <div className="lg:col-span-2"><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Segmentos / Nichos</label><input value={icp.industries} onChange={e=>setIcp(v=>({...v,industries:e.target.value}))} placeholder="Ex: SaaS, e-commerce, saúde, educação..." className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium"/></div>
                  <div className="lg:col-span-2"><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Regiões</label><input value={icp.regions} onChange={e=>setIcp(v=>({...v,regions:e.target.value}))} placeholder="Ex: São Paulo, Sul do Brasil, Brasil todo..." className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium"/></div>
                  <div className="lg:col-span-2"><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Dores / Problemas Principais</label><textarea value={icp.pain_points} onChange={e=>setIcp(v=>({...v,pain_points:e.target.value}))} rows={3} className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium resize-none" placeholder="Ex: Dificuldade em escalar vendas, alto custo de aquisição de clientes..."/></div>
                  <div className="lg:col-span-2"><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Quem toma a decisão</label><input value={icp.decision_maker} onChange={e=>setIcp(v=>({...v,decision_maker:e.target.value}))} placeholder="Ex: CEO, Diretor de Marketing, Gerente Comercial..." className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium"/></div>
                  <div className="lg:col-span-2"><label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Notas adicionais</label><textarea value={icp.notes} onChange={e=>setIcp(v=>({...v,notes:e.target.value}))} rows={2} className="w-full px-3 py-2.5 border rounded-xl outline-none text-sm font-medium resize-none" placeholder="Outros critérios importantes..."/></div>
                </div>
              </div>
              <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                <p className="text-xs font-bold text-amber-800 mb-1">Como funciona a pontuação</p>
                <p className="text-xs text-amber-700">Leads que correspondem ao ICP ganham pontos mais altos. Budget alinhado (+30pts), segmento certo (+20pts), região correta (+15pts), prazo imediato (+20pts), tomador de decisão identificado (+15pts).</p>
              </div>
              <div className="flex justify-end">
                <button onClick={() => saveIcp(icp)} className="px-8 py-4 rounded-xl font-bold text-black hover:scale-105 transition-all flex items-center gap-2" style={{backgroundColor:primaryColor}}>
                  <Save size={16}/> Salvar ICP
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* =========================================================

       ========================================================= */
    const NavItem = ({ icon, label, isActive, onClick, primaryColor }) => (
      <button onClick={onClick} className={`w-full flex items-center px-4 py-3 rounded-xl transition-all duration-200 group relative overflow-hidden shrink-0 ${isActive ? 'text-black font-bold shadow-sm' : 'text-gray-500 hover:text-gray-900 hover:bg-white/50'}`} style={{ backgroundColor: isActive ? primaryColor : 'transparent' }}>
        <span className={`mr-3 z-10 ${isActive ? 'text-black' : 'text-gray-400'}`}>{icon}</span><span className="text-sm z-10">{label}</span>
      </button>
    );

    const StatCard = ({ title, value, trend, isStatus, primaryColor, borderLight }) => (
      <div className="p-6 rounded-2xl border relative overflow-hidden shadow-sm backdrop-blur-sm shrink-0 bg-white/80" style={{ borderColor: borderLight }}>
        <div className="absolute top-0 right-0 w-24 h-24 blur-3xl opacity-30 rounded-full translate-x-1/2 -translate-y-1/2" style={{ backgroundColor: primaryColor }}></div>
        <p className="text-xs font-bold text-gray-500 uppercase mb-2 shrink-0">{title}</p>
        <div className="flex items-end justify-between shrink-0">
          <h3 className="text-3xl font-extrabold text-gray-900 shrink-0">{value}</h3>
          {isStatus
            ? <span className="text-xs font-bold text-green-700 bg-green-100 px-2.5 py-1 rounded-md flex items-center gap-1 shrink-0"><div className="w-1.5 h-1.5 rounded-full bg-green-600 shrink-0"></div> {trend}</span>
            : <span className="text-sm font-bold text-gray-500 shrink-0">{trend}</span>}
        </div>
      </div>
    );

    const KanbanColumn = ({ stage, count, isOver, onDragOver, onDragLeave, onDrop, children }) => {
      const colorClass = STAGE_COLORS[stage.color] || STAGE_COLORS.gray;
      const dotColor = COLOR_HEX[stage.color] || COLOR_HEX.gray;
      return (
        <div onDragOver={onDragOver} onDragLeave={onDragLeave} onDrop={onDrop} className={`flex-none w-72 rounded-2xl flex flex-col border backdrop-blur-sm h-full overflow-hidden shrink-0 transition ${colorClass} ${isOver ? 'drop-target' : ''}`}>
          <div className="p-4 border-b border-black/5 shrink-0">
            <div className="flex justify-between items-center mb-1 shrink-0">
              <div className="flex items-center gap-2">
                <div className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: dotColor }}></div>
                <h3 className="font-bold text-gray-800">{stage.title}</h3>
              </div>

    /* ── LeadDrawer — painel lateral de detalhes do lead ── */
