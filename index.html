                )}
                <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Prioridade</p>
                  <span className={`text-xs font-black px-2 py-0.5 rounded ${prio.badge}`}>{prio.label}</span>
                </div>
                {task.estimated_minutes > 0 && (
                  <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Tempo Est.</p>
                    <p className="font-bold text-sm text-gray-800 flex items-center gap-1"><Clock size={12}/>{fmtMins(task.estimated_minutes)}</p>
                  </div>
                )}
                <div className="p-3 bg-gray-50 rounded-xl border border-gray-100">
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Criado em</p>
                  <p className="font-bold text-sm text-gray-800">{fmtDate(task.created_at)}</p>
                </div>
                {task.due_date && (
                  <div className={`p-3 rounded-xl border ${dl ? dl.cls.replace('text-','border-').replace('bg-','bg-') : 'bg-gray-50 border-gray-100'}`}>
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-1">Prazo</p>
                    <p className="font-bold text-sm">{fmtDate(task.due_date)}</p>
                  </div>
                )}
              </div>

              {/* Tags/Plataformas */}
              {tTags.length > 0 && (
                <div>
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2">Plataformas</p>
                  <div className="flex flex-wrap gap-2">
                    {tTags.map(tag => (
                      <span key={tag.id} className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-bold text-white" style={{ backgroundColor: tag.color_hex }}>{tag.name}</span>
                    ))}
                  </div>
                </div>
              )}

              {/* Trilha de executores */}
              {(() => {
                const trail = (() => { try { return JSON.parse(localStorage.getItem(`pixt_task_trail_${task.id}`) || '[]'); } catch { return []; } })();
                if (!isExecutorUser && trail.length === 0) return null;
                if (trail.length === 0) return null;
                const curIdx = trail.findIndex(s => s.executor === task.executor_name);
                return (
                  <div>
                    <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                      <ArrowRight size={11}/> Trilha de Executores
                    </p>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      {trail.map((step, i) => (
                        <React.Fragment key={i}>
                          <div className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-bold transition-all ${i === curIdx ? 'bg-gray-900 text-white' : i < curIdx ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                            {i < curIdx && <CheckCircle2 size={10}/>}
                            {i === curIdx && <span className="w-2 h-2 rounded-full bg-yellow-400 animate-pulse inline-block"/>}
                            <span>{step.executor}</span>
                          </div>
                          {i < trail.length - 1 && <ArrowRight size={11} className="text-gray-300 shrink-0"/>}
                        </React.Fragment>
                      ))}
                    </div>
                  </div>
                );
              })()}

              {/* Histórico de etapas */}
              {history.length > 0 && (
                <div>
                  <p className="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1.5"><History size={11}/> Histórico</p>
                  <div className="space-y-1.5">
                    {history.map((h, i) => {
                      const hs = getTaskStage(h.stage);
                      return (
                        <div key={i} className="flex items-center gap-2.5 p-2 rounded-lg bg-gray-50 border border-gray-100">
                          <div className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: hs.color }}></div>
                          <p className="font-bold text-xs text-gray-800 flex-1">{hs.label}</p>
                          {h.duration_minutes > 0 && <p className="text-[10px] font-bold text-gray-500">{fmtMins(h.duration_minutes)}</p>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* ── Comentários por login ── */}
              <div className="border border-gray-200 rounded-xl overflow-hidden">
                <div className="flex items-center gap-2 px-3.5 py-2 bg-gray-50 border-b border-gray-200">
                  <MessageSquare size={11} className="text-gray-400"/>
                  <p className="text-[9px] font-bold text-gray-500 uppercase tracking-wider flex-1">Comentários</p>
                  <span className="text-[9px] font-bold px-2 py-0.5 rounded-full"
                    style={{ backgroundColor: isExecutorUser ? '#1f2937' : (primaryColor), color: isExecutorUser ? 'white' : 'black' }}>
                    {isExecutorUser ? '⚡ Executor' : '👑 Dono'}
                  </span>
                </div>
                <div className="p-3.5 space-y-2.5 min-h-[80px]">
                  {commLoading && <p className="text-xs text-gray-300 text-center py-3">Carregando...</p>}
                  {!commLoading && comments.length === 0 && (
                    <p className="text-xs text-gray-300 italic text-center py-4">Nenhum comentário ainda. Inicie a conversa!</p>
                  )}
                  {comments.map(c => {
                    const isExec = c.author_type === 'executor';
                    return (
                      <div key={c.id} className={`flex ${isExec ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[82%] px-3 py-2 rounded-2xl text-sm ${isExec ? 'bg-gray-900 text-white rounded-tr-sm' : 'bg-blue-50 text-gray-800 rounded-tl-sm border border-blue-100'}`}>
                          <p className={`text-[9px] font-black mb-0.5 ${isExec ? 'text-gray-400' : 'text-blue-500'}`}>{c.author_name}</p>
                          <p className="leading-snug">{c.text}</p>
                          <p className={`text-[9px] mt-0.5 ${isExec ? 'text-gray-500' : 'text-gray-400'}`}>{new Date(c.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p>
                        </div>
                      </div>
                    );
                  })}
                  <div ref={commEndRef}/>
                </div>
                <div className="flex gap-2 p-3 border-t border-gray-100 bg-gray-50">
                  <input value={newComment} onChange={e=>setNewComment(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),addComment())}
                    placeholder={`Comentar como ${currentUserName}...`}
                    className="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-sm outline-none focus:border-gray-400 bg-white"/>
                  <button onClick={addComment} disabled={!newComment.trim() || sendingComment}
                    className="px-3 py-2 rounded-xl font-bold text-sm text-black disabled:opacity-40 transition-all hover:opacity-80"
                    style={{ backgroundColor: primaryColor }}>
                    {sendingComment ? <Loader2 size={14} className="animate-spin"/> : <Send size={14}/>}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </>
      );
    };

    /* ── ExecutorsView ── */
    const ExecutorsView = ({ executors, squads, tasks, onRefresh, primaryColor }) => {
      const toast = useToast();
      const [showModal, setShowModal] = useState(false);
      const [form, setForm]           = useState({ name: '', role: '', color_hex: '#6366f1', photo_url: null });
      const [saving, setSaving]       = useState(false);
      const [deleting, setDeleting]   = useState(null);
      const fileRef                   = React.useRef();

      // Login de executor
      const [loginModal, setLoginModal] = useState(null); // { name, id }
      const [loginForm, setLoginForm]   = useState({ password: '' });
      const [loginSaving, setLoginSaving] = useState(false);
      const [executorUsers, setExecutorUsers] = useState([]);
      useEffect(() => {
        api('/executor-users').then(d => setExecutorUsers(d.executor_users || [])).catch(() => {});
      }, []);
      const openLoginModal = (ex) => { setLoginModal(ex); setLoginForm({ password: '' }); };
      const createLogin = async () => {
        if (!loginForm.password || loginForm.password.length < 6) return toast('Senha precisa ter ao menos 6 caracteres', 'error');
        setLoginSaving(true);
        try {
          const { email } = await api('/executor-users', { method: 'POST', body: JSON.stringify({ name: loginModal.name, password: loginForm.password }) });
          toast(`Login criado! Email: ${email}`, 'success');
          setLoginModal(null);
          const d = await api('/executor-users');
          setExecutorUsers(d.executor_users || []);
        } catch (e) { toast(e.message, 'error'); } finally { setLoginSaving(false); }
      };
      const deleteLogin = async (userId) => {
        try {
          await api(`/executor-users/${userId}`, { method: 'DELETE' });
          toast('Login removido', 'success');
          const d = await api('/executor-users');
          setExecutorUsers(d.executor_users || []);
        } catch (e) { toast(e.message, 'error'); }
      };

      const [editingEx, setEditingEx] = useState(null); // executor being edited

      const openModal = () => { setForm({ name: '', role: '', color_hex: '#6366f1', photo_url: null }); setEditingEx(null); setShowModal(true); };
      const openEditEx = (ex) => { setForm({ name: ex.name, role: ex.role||'', color_hex: ex.color_hex||'#6366f1', photo_url: ex.photo_url||null }); setEditingEx(ex); setShowModal(true); };

      const pickPhoto = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const url = await resizeImageToDataUrl(file, 200);
          setForm(f => ({ ...f, photo_url: url }));
        } catch { toast('Erro ao processar imagem', 'error'); }
        e.target.value = '';
      };

      const saveExecutor = async () => {
        if (!form.name.trim()) return toast('Nome obrigatório', 'error');
        setSaving(true);
        try {
          if (editingEx) {
            await api(`/task-executors/${editingEx.id}`, { method: 'PUT', body: JSON.stringify(form) });
            toast('Executor atualizado', 'success');
          } else {
            await api('/task-executors', { method: 'POST', body: JSON.stringify(form) });
            toast('Executor criado', 'success');
          }
          setShowModal(false);
          setEditingEx(null);
          onRefresh();
        } catch (e) { toast(e.message, 'error'); } finally { setSaving(false); }
      };

      const deleteExecutor = async (id) => {
        setDeleting(id);
        try {
          await api(`/task-executors/${id}`, { method: 'DELETE' });
          toast('Removido', 'success');
          onRefresh();
        } catch (e) { toast(e.message, 'error'); } finally { setDeleting(null); }
      };

      const execTaskCount = (name) => tasks.filter(t => t.executor_name === name && t.current_stage !== 'concluido').length;

      return (
        <div className="flex flex-col gap-4 animate-in fade-in duration-300" style={{ height: 'calc(100vh - 210px)' }}>
          <div className="flex items-center justify-between flex-shrink-0">
            <div>
              <h2 className="text-lg font-black text-gray-900">Executores</h2>
              <p className="text-xs text-gray-400 mt-0.5">{executors.length} membro{executors.length !== 1 ? 's' : ''} da equipe</p>
            </div>
            <button onClick={openModal}
              className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-black hover:opacity-90 transition-all"
              style={{ backgroundColor: primaryColor }}>
              <Plus size={15} /> Novo Executor
            </button>
          </div>
          <div className="flex-1 overflow-y-auto min-h-0">
            {executors.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 bg-white/60 border border-dashed border-gray-200 rounded-2xl">
                <div className="w-12 h-12 rounded-2xl bg-gray-100 flex items-center justify-center mb-3"><Users size={22} className="text-gray-400" /></div>
                <p className="font-bold text-gray-600 mb-1">Nenhum executor cadastrado</p>
                <p className="text-sm text-gray-400 mb-4">Adicione os membros da equipe responsáveis pelas tarefas</p>
                <button onClick={openModal} className="px-4 py-2 rounded-xl text-sm font-bold text-black" style={{ backgroundColor: primaryColor }}>+ Novo Executor</button>
              </div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                {executors.map(ex => {
                  const active = execTaskCount(ex.name);
                  return (
                    <div key={ex.id} className="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all group relative">
                      <div className="absolute top-3 right-3 flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                        <button onClick={() => openEditEx(ex)}
                          className="text-gray-300 hover:text-blue-500 p-1 rounded-lg hover:bg-blue-50 transition-all">
                          <Edit3 size={13} />
                        </button>
                        <button onClick={() => deleteExecutor(ex.id)} disabled={deleting === ex.id}
                          className="text-gray-300 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition-all">
                          <Trash2 size={13} />
                        </button>
                      </div>
                      <div className="w-14 h-14 rounded-2xl mb-3 mx-auto overflow-hidden flex items-center justify-center"
                        style={ex.photo_url ? {} : { backgroundColor: ex.color_hex }}>
                        {ex.photo_url
                          ? <img src={ex.photo_url} className="w-full h-full object-cover" />
                          : <span className="text-base font-black text-white">{taskInitials(ex.name)}</span>}
                      </div>
                      <p className="font-black text-gray-900 text-sm text-center leading-tight truncate">{ex.name}</p>
                      {ex.role && <p className="text-[11px] text-gray-400 text-center mt-0.5 truncate">{ex.role}</p>}
                      <div className="mt-3 pt-3 border-t border-gray-100 flex items-center justify-center gap-1.5">
                        <div className="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                        <span className="text-[10px] font-bold text-gray-500">{active} ativa{active !== 1 ? 's' : ''}</span>
                      </div>
                      {/* Login de acesso */}
                      {(() => {
                        const slug = ex.name.trim().toLowerCase().replace(/\s+/g, '.').replace(/[^a-z0-9.]/g, '');
                        const exEmail = `${slug}@executor.ia`;
                        const hasLogin = executorUsers.some(u => u.email === exEmail);
                        return hasLogin ? (
                          <div className="mt-2 p-2 bg-green-50 border border-green-100 rounded-xl">
                            <p className="text-[9px] font-black text-green-600 text-center">✓ Login ativo</p>
                            <p className="text-[9px] text-green-700 text-center font-mono truncate">{exEmail}</p>
                            <button onClick={() => { const u = executorUsers.find(u => u.email === exEmail); if(u) deleteLogin(u.id); }}
                              className="w-full mt-1.5 text-[9px] text-red-400 hover:text-red-600 font-bold">Remover login</button>
                          </div>
                        ) : (
                          <button onClick={() => openLoginModal(ex)}
                            className="w-full mt-2 py-1.5 rounded-xl text-[10px] font-bold border border-dashed border-gray-200 text-gray-400 hover:border-blue-300 hover:text-blue-600 transition-all">
                            + Criar Login
                          </button>
                        );
                      })()}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          {loginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={() => setLoginModal(null)}>
              <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-black text-gray-900">Criar Login — {loginModal.name}</h3>
                  <button onClick={() => setLoginModal(null)} className="text-gray-400 hover:text-gray-700 p-1 rounded-lg hover:bg-gray-100"><X size={16} /></button>
                </div>
                <div className="p-3 bg-blue-50 border border-blue-100 rounded-xl mb-4">
                  <p className="text-[10px] font-bold text-blue-600 mb-1">Email automático gerado:</p>
                  <p className="text-sm font-mono font-bold text-blue-900">
                    {loginModal.name.trim().toLowerCase().replace(/\s+/g,'.').replace(/[^a-z0-9.]/g,'')}@executor.ia
                  </p>
                  <p className="text-[10px] text-blue-500 mt-1">O executor usa este email + senha que você definir.</p>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Senha *</label>
                    <input type="password" value={loginForm.password} onChange={e => setLoginForm(f => ({...f, password: e.target.value}))}
                      placeholder="Mínimo 6 caracteres"
                      className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400"
                      onKeyDown={e => e.key === 'Enter' && createLogin()} />
                  </div>
                </div>
                <div className="flex gap-3 mt-5">
                  <button onClick={() => setLoginModal(null)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold hover:bg-gray-50">Cancelar</button>
                  <button onClick={createLogin} disabled={loginSaving}
                    className="flex-1 py-2.5 rounded-xl text-sm font-bold text-black hover:opacity-90 disabled:opacity-50"
                    style={{ backgroundColor: primaryColor }}>{loginSaving ? 'Criando...' : 'Criar Login'}</button>
                </div>
              </div>
            </div>
          )}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={() => setShowModal(false)}>
              <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm mx-4" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-5">
                  <h3 className="text-base font-black text-gray-900">{editingEx ? 'Editar Executor' : 'Novo Executor'}</h3>
                  <button onClick={() => { setShowModal(false); setEditingEx(null); }} className="text-gray-400 hover:text-gray-700 p-1 rounded-lg hover:bg-gray-100"><X size={16} /></button>
                </div>
                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={pickPhoto} />
                <div className="space-y-4">
                  {/* Avatar / Foto */}
                  <div className="flex flex-col items-center gap-2">
                    <div
                      onClick={() => fileRef.current.click()}
                      className="w-20 h-20 rounded-2xl overflow-hidden flex items-center justify-center cursor-pointer hover:opacity-80 transition-all relative group"
                      style={form.photo_url ? {} : { backgroundColor: form.color_hex }}>
                      {form.photo_url
                        ? <img src={form.photo_url} className="w-full h-full object-cover" />
                        : <span className="text-2xl font-black text-white">{taskInitials(form.name) || '?'}</span>}
                      <div className="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-2xl">
                        <span className="text-white text-[10px] font-bold">Trocar foto</span>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <button type="button" onClick={() => fileRef.current.click()}
                        className="text-xs font-bold text-blue-600 hover:text-blue-800 transition-colors">Carregar foto</button>
                      {form.photo_url && (
                        <button type="button" onClick={() => setForm(f => ({ ...f, photo_url: null }))}
                          className="text-xs font-bold text-red-400 hover:text-red-600 transition-colors">Remover</button>
                      )}
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Nome *</label>
                    <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
                      onKeyDown={e => e.key === 'Enter' && saveExecutor()} placeholder="Nome completo"
                      className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Cargo / Função</label>
                    <input value={form.role} onChange={e => setForm(f => ({ ...f, role: e.target.value }))}
                      placeholder="Ex: Designer, Copywriter, Gestor..."
                      className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-blue-400" />
                  </div>
                  {!form.photo_url && (
                    <div>
                      <label className="text-xs font-bold text-gray-500 uppercase mb-1.5 block">Cor do Avatar</label>
                      <TColorPicker value={form.color_hex} onChange={c => setForm(f => ({ ...f, color_hex: c }))} />
                    </div>
                  )}
                </div>
                <div className="flex gap-3 mt-5">
                  <button onClick={() => setShowModal(false)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-bold hover:bg-gray-50">Cancelar</button>
                  <button onClick={saveExecutor} disabled={saving}
                    className="flex-1 py-2.5 rounded-xl text-sm font-bold text-black hover:opacity-90 transition-all disabled:opacity-50"
                    style={{ backgroundColor: primaryColor }}>Salvar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ── ConfigView ── */
    const ConfigView = ({ tags, onRefresh, primaryColor, taskStages, onEditStages, taskPriorities, onEditPriorities }) => {
      const toast = useToast();
      const [newTag, setNewTag]     = useState({ name: '', color_hex: '#6366f1' });
      const [saving, setSaving]     = useState(false);
      const [deleting, setDeleting] = useState(null);

      const addTag = async () => {
        if (!newTag.name.trim()) return toast('Nome obrigatório', 'error');
        setSaving(true);
        try {
          await api('/task-tags', { method: 'POST', body: JSON.stringify(newTag) });
          toast('Tag criada', 'success');
          setNewTag({ name: '', color_hex: '#6366f1' });
          onRefresh();
        } catch (e) { toast(e.message, 'error'); } finally { setSaving(false); }
      };

      const delTag = async (id) => {
        setDeleting(id);
        try { await api(`/task-tags/${id}`, { method: 'DELETE' }); onRefresh(); toast('Removida', 'success'); }
        catch (e) { toast(e.message, 'error'); } finally { setDeleting(null); }
      };

      return (
        <div className="space-y-5 animate-in fade-in duration-300 overflow-y-auto" style={{ maxHeight: 'calc(100vh - 210px)' }}>
          <div className="bg-white/80 border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
            <div className="p-5 border-b border-gray-100">
              <h3 className="font-black text-gray-900">Plataformas & Tags</h3>
              <p className="text-xs text-gray-400 mt-0.5">Tags para categorizar tarefas por canal ou tipo</p>
            </div>
            <div className="p-5 space-y-4">
              <div className="flex items-center gap-3 p-4 bg-gray-50 rounded-xl flex-wrap">
                <input value={newTag.name} onChange={e => setNewTag(t => ({ ...t, name: e.target.value }))}
                  onKeyDown={e => e.key === 'Enter' && addTag()}
                  placeholder="Nome da tag (Ex: Meta Ads)"
                  className="flex-1 min-w-[160px] border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-blue-400 bg-white" />
                <TColorPicker value={newTag.color_hex} onChange={c => setNewTag(t => ({ ...t, color_hex: c }))} />
                <button onClick={addTag} disabled={saving}
                  className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold text-black hover:opacity-90 transition-all shrink-0"
                  style={{ backgroundColor: primaryColor }}><Plus size={13} /> Adicionar</button>
              </div>
              <div className="flex flex-wrap gap-2">
                {tags.length === 0 && <p className="text-xs text-gray-400 py-2">Nenhuma tag cadastrada ainda.</p>}
                {tags.map(tag => (
                  <div key={tag.id} className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-sm font-bold text-white"
                    style={{ backgroundColor: tag.color_hex }}>
                    {tag.name}
                    <button onClick={() => delTag(tag.id)} disabled={deleting === tag.id} className="opacity-70 hover:opacity-100 transition-opacity"><X size={12} /></button>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="bg-white/80 border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
            <div className="p-5 border-b border-gray-100 flex items-center justify-between">
              <div>
                <h3 className="font-black text-gray-900">Etapas do Kanban</h3>
                <p className="text-xs text-gray-400 mt-0.5">Configure as etapas, cores e ordem do fluxo</p>
              </div>
              {onEditStages && (
                <button onClick={onEditStages}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border border-gray-200 hover:bg-gray-50 text-gray-600 transition-all">
                  <Edit3 size={12}/> Editar
                </button>
              )}
            </div>
            <div className="p-5">
              <div className="flex items-center gap-2 flex-wrap">
                {(taskStages||TASK_STAGES).map((s, i, arr) => (
                  <React.Fragment key={s.id}>
                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold text-white" style={{ backgroundColor: s.color }}>
                      <div className="w-1.5 h-1.5 rounded-full bg-white/60"></div>{s.label}
                    </div>
                    {i < arr.length - 1 && <ArrowRight size={13} className="text-gray-300" />}
                  </React.Fragment>
                ))}
              </div>
            </div>
          </div>
          <div className="bg-white/80 border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
            <div className="p-5 border-b border-gray-100 flex items-center justify-between">
              <div>
                <h3 className="font-black text-gray-900">Níveis de Prioridade</h3>
                <p className="text-xs text-gray-400 mt-0.5">Personalize os rótulos e cores de cada nível</p>
              </div>
              {onEditPriorities && (
                <button onClick={onEditPriorities}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border border-gray-200 hover:bg-gray-50 text-gray-600 transition-all">
                  <Edit3 size={12}/> Editar
                </button>
              )}
            </div>

        '#6366f1':'bg-indigo-50/40 border-indigo-200','#3b82f6':'bg-blue-50/40 border-blue-200',

    /* ── TasksTab — componente principal ── */
    const TasksTab = ({ primaryColor, isExecutor }) => {
      const toast = useToast();
      const [subView, setSubView]   = useState('tarefas');
      const [taskView, setTaskView] = useState('kanban');
      const [tasks, setTasks] = useState([]);
      const [squads, setSquads] = useState([]);
      const [tags, setTags] = useState([]);
      const [executors, setExecutors] = useState([]);
      const [taskClients, setTaskClients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [dragTask, setDragTask] = useState(null);
      const [isOver, setIsOver] = useState(null);
      const [filters, setFilters] = useState({ client: '', executor: '', squad_id: '', stage: '', priority: '' });
      const [showCreate, setShowCreate] = useState(false);
      const [advanceTask, setAdvanceTask] = useState(null);
      const [executorCompleteTask, setExecutorCompleteTask] = useState(null);
      const [detailTask, setDetailTask] = useState(null);
      const [editingCell, setEditingCell] = useState(null);
      const [groupBy, setGroupBy] = useState('client_name');

      const [taskStages, setTaskStages] = useState(() => {
        try { const s = localStorage.getItem('pixt_task_stages'); return s ? JSON.parse(s) : TASK_STAGES; } catch { return TASK_STAGES; }
      });
      const saveTaskStages = (ns) => { setTaskStages(ns); localStorage.setItem('pixt_task_stages', JSON.stringify(ns)); };
      const [showStageConfig, setShowStageConfig] = useState(false);

      const [taskPriorities, setTaskPriorities] = useState(() => {
        try { const s = localStorage.getItem('pixt_task_priorities'); return s ? JSON.parse(s) : TASK_PRIORITIES; } catch { return TASK_PRIORITIES; }
      });
      const saveTaskPriorities = (np) => { setTaskPriorities(np); localStorage.setItem('pixt_task_priorities', JSON.stringify(np)); };
      const [showPriorityConfig, setShowPriorityConfig] = useState(false);

      /* ── Filtro de período ── */
      const [taskDateFrom, setTaskDateFrom] = useState(null);
      const [taskDateTo,   setTaskDateTo]   = useState(null);
      const [showTaskCal,  setShowTaskCal]  = useState(false);
      const [calPickMonth, setCalPickMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
      const [calPickA, setCalPickA] = useState(null);
      const [calPickB, setCalPickB] = useState(null);
      const fmtCalD = (d) => d ? d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : '';
      const calDaysT = (() => {
        const yr = calPickMonth.getFullYear(), mo = calPickMonth.getMonth();
        const first = new Date(yr, mo, 1);
        const last  = new Date(yr, mo+1, 0);
        const days = [];
        for (let i=0; i<first.getDay(); i++) days.push(null);
        for (let d=1; d<=last.getDate(); d++) days.push(new Date(yr, mo, d));
        return days;
      })();
      const handleCalT = (day) => {
        if (!day) return;
        const d = new Date(day); d.setHours(0,0,0,0);
        if (!calPickA || (calPickA && calPickB)) { setCalPickA(d); setCalPickB(null); }
        else if (d < calPickA) { setCalPickB(calPickA); setCalPickA(d); }
        else { setCalPickB(d); }
      };
      const applyCalT = () => {
        if (!calPickA) return;
        setTaskDateFrom(calPickA);
        setTaskDateTo(calPickB || calPickA);
        setShowTaskCal(false);
      };
      const clearCalT = () => { setTaskDateFrom(null); setTaskDateTo(null); setCalPickA(null); setCalPickB(null); setShowTaskCal(false); };

      const defForm = { title: '', description: '', client_name: '', squad_id: '', priority: 'media', current_stage: 'briefing', executor_name: '', estimated_minutes: 60, due_date: '', tag_ids: [], workflow_trail: [] };
      const [form, setForm] = useState(defForm);
      const setFF = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const loadAll = useCallback(async () => {
        setLoading(true);
        try {
          const [td, sd, gd, ed, cd] = await Promise.all([
            api('/tasks'),
            api('/squads').catch(() => ({ squads: [] })),
            api('/task-tags').catch(() => ({ tags: [] })),
            api('/task-executors').catch(() => ({ executors: [] })),
            api('/task-clients').catch(() => ({ clients: [] })),
          ]);
          setTasks(td.tasks || []);
          setSquads(sd.squads || []);
          setTags(gd.tags || []);
          setExecutors(ed.executors || []);
          setTaskClients(cd.clients || []);
        } catch (e) { toast(e.message, 'error'); }
        finally { setLoading(false); }
      }, [toast]);

      useEffect(() => { loadAll(); }, [loadAll]);

      const filtered = tasks.filter(t => {
        if (filters.client   && t.client_name !== filters.client) return false;
        if (filters.executor && t.executor_name !== filters.executor) return false;
        if (filters.stage    && t.current_stage !== filters.stage) return false;
        if (filters.priority && t.priority !== filters.priority) return false;
        if (taskDateFrom && t.due_date) {
          const d = new Date(t.due_date); d.setHours(0,0,0,0);
          if (d < taskDateFrom) return false;
        }
        if (taskDateTo && t.due_date) {
          const d = new Date(t.due_date); d.setHours(0,0,0,0);
          if (d > taskDateTo) return false;
        }
        return true;
      });

      const hasFilters = Object.values(filters).some(Boolean) || !!taskDateFrom;

      const isExecutorLogin = isExecutor;

          const { task } = await api('/tasks', { method: 'POST', body: JSON.stringify({ ...form, estimated_minutes: parseInt(form.estimated_minutes) || 60, squad_id: form.squad_id || null }) });

          {subView === 'clientes' && (
            <ClientsView taskClients={taskClients} tasks={tasks} onRefresh={loadAll} primaryColor={primaryColor} />
          )}
          {subView === 'executores' && (
            <ExecutorsView executors={executors} squads={squads} tasks={tasks} onRefresh={loadAll} primaryColor={primaryColor} />

          {subView === 'configuracoes' && (
            <ConfigView
              tags={tags} onRefresh={loadAll} primaryColor={primaryColor}

              onTaskUpdate={(updated) => { setTasks(ts => ts.map(t => t.id === updated.id ? updated : t)); setDetailTask(updated); }} />

    /* ── Forecasting IA ── */
    const ForecastTab = ({ primaryColor }) => {
      const [tab, setTab] = useState('dre');

      /* ── helpers DRE ── */
      const dreMonths = (() => {
        const out = [];
        for (let i = 2; i >= 0; i--) {
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          const label = d.toLocaleString('pt-BR', { month: 'short', year: '2-digit' }).replace('. de ', '/').replace('.','');
          out.push({ key, label });
        }
        return out;
      })();

      const hashStr = (s) => String(s).split('').reduce((a,c) => a*31 + c.charCodeAt(0), 7) >>> 0;

      const [planRB, setPlanRB] = useState(() => {
        const init = {};
        dreMonths.forEach((m, i) => { init[m.key] = [95000, 99500, 103500][i] ?? 103500; });
        return init;
      });

      const calcDRE = (rb, seedStr) => {
        const seed = hashStr(seedStr);
        const jit = (base, s2) => Math.round(base * (0.72 + ((hashStr(seedStr + s2) % 56) / 100)));
        const ded = rb * 0.0925;
        const rl = rb - ded;
        const cmvV = rl * 0.18;
        const lb = rl - cmvV;
        const mktV = rb * 0.08; const vendasV = rb * 0.06;
        const gnaV = rb * 0.10; const pdV = rb * 0.03;
        const despOp = mktV + vendasV + gnaV + pdV;
        const ebitda = lb - despOp;
        const daV = rb * 0.04;
        const ebit = ebitda - daV;
        const juroV = rb * 0.02;
        const lair = ebit - juroV;
        const irV = lair > 0 ? lair * 0.15 : 0;
        const ll = lair - irV;
        return { rb, ded, rl, cmvV, lb, mktV, vendasV, gnaV, pdV, despOp, ebitda, daV, ebit, juroV, lair, irV, ll };
      };

      const dreRows = [
        { key:'rb',      label:'(+) Receita Bruta de Vendas', bold:true, top:true },
        { key:'ded',     label:'(-) Deduções da Receita', indent:true, neg:true },
        { key:'rl',      label:'(=) Receita Líquida',  bold:true, sep:true },
        { key:'cmvV',    label:'(-) CMV / Custo do Serviço', indent:true, neg:true },
        { key:'lb',      label:'(=) Margem de Contribuição', bold:true, sep:true },
        { key:'despOp',  label:'(-) Gastos e Despesas', indent:true, neg:true, expandable:true },
        { key:'mktV',    label:'  ▸ Marketing', sub:true, neg:true },
        { key:'vendasV', label:'  ▸ Vendas / Comissões', sub:true, neg:true },
        { key:'gnaV',    label:'  ▸ G&A (Administrativo)', sub:true, neg:true },
        { key:'pdV',     label:'  ▸ P&D / Tecnologia', sub:true, neg:true },
        { key:'ebitda',  label:'(=) EBITDA', bold:true, sep:true, highlight:'blue' },
        { key:'daV',     label:'(-) D&A (Deprec./Amort.)', indent:true, neg:true },
        { key:'ebit',    label:'(=) EBIT (Resultado Operacional)', bold:true, sep:true },
        { key:'juroV',   label:'(-) Despesas Financeiras', indent:true, neg:true },
        { key:'lair',    label:'(=) LAIR (Antes do IR)', bold:true, sep:true },
        { key:'irV',     label:'(-) IR / CSLL', indent:true, neg:true },
        { key:'ll',      label:'(=) Lucro Líquido', bold:true, sep:true, big:true },
      ];

      const fmtD = v => v === 0 ? '—' : `R$ ${Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})}`;
      const fmtV = (plan, real) => {
        if (!plan || plan === 0) return { txt:'—', color:'#9ca3af' };
        const v = ((real - plan) / Math.abs(plan)) * 100;
        return { txt: (v>0?'+':'')+v.toFixed(0)+'%', color: v >= 0 ? '#16a34a' : '#dc2626' };
      };

      const [est, setEst] = useState({
        receitaBruta: 103500,
        impostos: 9.25,
        cmv: 18,
        marketing: 8,
        vendas: 6,
        gna: 10,
        pd: 3,
        da: 4,
        jurosDespesas: 2,
        ir: 15,
      });

      /* valores para aba Estimativa */
      const estD = calcDRE(Number(est.receitaBruta)||0, 'est');

      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          {/* Tabs */}
          <div className="flex rounded-xl bg-gray-100 p-1 gap-1 w-fit">
            {[{v:'dre',l:'DRE Projetado'},{v:'est',l:'Estimativa'}].map(t=>(
              <button key={t.v} onClick={()=>setTab(t.v)}
                className={`px-5 py-2 rounded-lg text-sm font-bold transition-all ${tab===t.v?'bg-white shadow text-gray-900':'text-gray-500 hover:text-gray-700'}`}>{t.l}</button>
            ))}
          </div>

          {tab === 'dre' && (
            <div className="space-y-6">
              <div className="bg-white/80 border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                <div className="p-5 border-b border-gray-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-gray-900">DRE — Demonstrativo de Resultados do Exercício</h3>
                    <p className="text-xs text-gray-400 mt-0.5">Planejado vs Realizado · últimos 3 meses</p>
                  </div>
                  <div className="text-[10px] flex gap-3 font-bold text-gray-500">
                    <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-blue-100 inline-block"/>Planejado</span>
                    <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-green-100 inline-block"/>Realizado</span>
                    <span className="flex items-center gap-1"><span className="w-3 h-3 rounded bg-red-100 inline-block"/>Variação</span>
                  </div>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-gray-50 border-b border-gray-200">
                      <tr>
                        <th className="px-5 py-3 text-left text-[11px] font-bold text-gray-500 uppercase tracking-wider sticky left-0 bg-gray-50 min-w-[200px]">Estrutura</th>
                        {dreMonths.map(m => (
                          <React.Fragment key={m.key}>
                            <th className="px-3 py-3 text-center text-[10px] font-bold text-blue-600 uppercase tracking-wider border-l border-gray-100 whitespace-nowrap" style={{minWidth:100}}>{m.label}<br/>Planejado</th>
                            <th className="px-3 py-3 text-center text-[10px] font-bold text-green-600 uppercase tracking-wider whitespace-nowrap" style={{minWidth:100}}>{m.label}<br/>Realizado</th>
                            <th className="px-3 py-3 text-center text-[10px] font-bold text-gray-500 uppercase tracking-wider border-r border-gray-100 whitespace-nowrap" style={{minWidth:80}}>Variação</th>
                          </React.Fragment>
                        ))}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-50">
                      {dreRows.map((row, ri) => (
                        <tr key={row.key} className={`${row.sep?'border-t-2 border-gray-200':''}  ${row.big?'bg-gray-900':row.top?'bg-gray-50/50':''} hover:bg-gray-50/40 transition-colors`}>
                          <td className={`px-5 py-2.5 sticky left-0 ${row.big?'bg-gray-900 text-white font-black text-[13px]':row.top?'bg-gray-50/50':'bg-white'} ${row.sub?'pl-10 text-gray-400 text-[11px]':row.indent?'pl-8 text-gray-500':row.bold?'font-bold text-gray-800':'text-gray-600'}`}>
                            {row.label}
                          </td>
                          {dreMonths.map(m => {
                            const rb_plan = planRB[m.key] || 100000;
                            const planData = calcDRE(rb_plan, '');
                            const realRB   = Math.round(rb_plan * (0.72 + ((hashStr(m.key + row.key) % 56) / 100)));
                            const realData = calcDRE(realRB, m.key);
                            const pVal = planData[row.key] ?? 0;
                            const rVal = realData[row.key] ?? 0;
                            const vr = fmtV(Math.abs(pVal), Math.abs(rVal));
                            return (
                              <React.Fragment key={m.key}>
                                <td className="px-3 py-2.5 text-right tabular-nums border-l border-gray-100">
                                  {row.key === 'rb' ? (
                                    <input type="number" value={planRB[m.key]||100000}
                                      onChange={e => setPlanRB(p => ({...p, [m.key]: parseFloat(e.target.value)||0}))}
                                      className="w-24 text-right border border-blue-200 rounded-lg px-2 py-0.5 text-xs font-bold outline-none focus:border-blue-400 bg-blue-50 text-blue-700"/>
                                  ) : (
                                    <span className={`text-xs font-bold tabular-nums ${row.big?'text-white':row.neg?'text-red-600':'text-gray-800'}`}>
                                      {row.neg ? `(${fmtD(pVal)})` : fmtD(pVal)}
                                    </span>
                                  )}
                                </td>
                                <td className="px-3 py-2.5 text-right tabular-nums">
                                  <span className={`text-xs font-bold ${row.big?'text-white':row.neg?'text-red-500':'text-gray-700'}`}>
                                    {row.neg ? `(${fmtD(rVal)})` : fmtD(rVal)}
                                  </span>
                                </td>
                                <td className="px-3 py-2.5 text-center border-r border-gray-100">
                                  <span className="text-[10px] font-black px-1.5 py-0.5 rounded" style={{color: vr.color, backgroundColor: vr.color+'15'}}>{vr.txt}</span>
                                </td>
                              </React.Fragment>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {tab === 'est' && (
            <div className="space-y-6">
              <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 text-sm text-blue-700 font-medium">
                Ajuste as métricas abaixo e o DRE será recalculado automaticamente em tempo real.
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white/80 border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
                  <h4 className="font-bold text-gray-900 text-sm">Receita & Deduções</h4>
                  {[
                    {k:'receitaBruta',l:'Receita Bruta (R$)',type:'valor'},
                    {k:'impostos',l:'Impostos / Deduções (%)',type:'pct'},
                    {k:'cmv',l:'CMV / Custo do Serviço (%)',type:'pct'},
                  ].map(f=>(
                    <div key={f.k}>
                      <label className="text-xs font-bold text-gray-500 mb-1 block">{f.l}</label>
                      <input type="number" value={est[f.k]} onChange={e=>setEst(s=>({...s,[f.k]:parseFloat(e.target.value)||0}))}
                        className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-bold outline-none focus:border-blue-400"/>
                    </div>
                  ))}
                </div>
                <div className="bg-white/80 border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
                  <h4 className="font-bold text-gray-900 text-sm">Despesas Operacionais (%)</h4>
                  {[
                    {k:'marketing',l:'Marketing (% rec. bruta)'},
                    {k:'vendas',l:'Vendas / Comissões (%)'},
                    {k:'gna',l:'G&A — Administrativo (%)'},
                    {k:'pd',l:'P&D / Tecnologia (%)'},
                    {k:'da',l:'D&A — Deprec./Amort. (%)'},
                    {k:'jurosDespesas',l:'Juros / Despesas Financeiras (%)'},
                    {k:'ir',l:'IR / CSLL sobre LAIR (%)'},
                  ].map(f=>(
                    <div key={f.k}>
                      <label className="text-xs font-bold text-gray-500 mb-1 block">{f.l}</label>
                      <input type="number" value={est[f.k]} onChange={e=>setEst(s=>({...s,[f.k]:parseFloat(e.target.value)||0}))}
                        className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-bold outline-none focus:border-blue-400"/>
                    </div>
                  ))}
                </div>
              </div>

              {/* Live preview */}
              <div className="bg-gray-900 rounded-2xl p-6 border border-gray-800 grid grid-cols-2 md:grid-cols-4 gap-4">
                {[
                  {l:'Receita Líquida', v: fmtD(estD.rl)},
                  {l:'EBITDA', v: fmtD(estD.ebitda), color: estD.ebitda>=0?'#4ade80':'#f87171'},
                  {l:'Lucro Líquido', v: fmtD(estD.ll), color: estD.ll>=0?'#4ade80':'#f87171'},
                  {l:'Margem LL', v: estD.rb>0?(estD.ll/estD.rb*100).toFixed(1)+'%':'—', color: estD.ll/estD.rb>0.05?'#4ade80':'#f87171'},
                ].map(k=>(
                  <div key={k.l}>
                    <p className="text-gray-500 text-xs font-bold uppercase mb-1">{k.l}</p>
                    <p className="text-xl font-black" style={{color: k.color||'white'}}>{k.v}</p>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ── Lead Scoring ── */
    const LeadScoreTab = ({ primaryColor }) => {
      const [leads, setLeads] = useState([]);
      const [loading, setLoading] = useState(true);
      const toast = useToast();
      useEffect(() => {
        api('/leads?agent=vendas').then(d => setLeads((d.leads || []).sort((a, b) => b.score - a.score))).catch(e => toast(e.message, 'error')).finally(() => setLoading(false));
      }, [toast]);
      if (loading) return <div className="flex justify-center py-20"><Loader2 className="animate-spin text-gray-400" /></div>;
      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          <p className="text-sm text-gray-500 font-medium">Leads classificados por score. Conecte-se ao pipeline de vendas para ver dados reais.</p>
          <div className="bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <table className="w-full text-sm text-left">
              <thead className="bg-gray-50 text-gray-500 font-bold uppercase tracking-wider text-[11px]"><tr><th className="px-5 py-3">Rank</th><th className="px-5 py-3">Lead</th><th className="px-5 py-3">Empresa</th><th className="px-5 py-3">Score</th><th className="px-5 py-3">Estágio</th><th className="px-5 py-3">Valor</th></tr></thead>
              <tbody className="divide-y divide-gray-100 font-medium">
                {leads.length === 0 ? (
                  <tr><td colSpan={6} className="px-5 py-10 text-center text-gray-400">Nenhum lead encontrado no agente Vendas+.</td></tr>
                ) : leads.map((l, i) => (
                  <tr key={l.id} className="hover:bg-gray-50/50 transition-colors">
                    <td className="px-5 py-4 font-extrabold text-gray-400">#{i+1}</td>
                    <td className="px-5 py-4 font-bold text-gray-900">{l.name}</td>
                    <td className="px-5 py-4 text-gray-500">{l.company || '—'}</td>
                    <td className="px-5 py-4">
                      <div className="flex items-center gap-2">
                        <div className="w-16 h-2 bg-gray-100 rounded-full"><div className="h-full rounded-full" style={{ width: `${l.score}%`, backgroundColor: l.score > 75 ? '#c6f432' : l.score > 50 ? '#fbbf24' : '#f87171' }}></div></div>
                        <span className="font-extrabold">{l.score}</span>
                      </div>
                    </td>
                    <td className="px-5 py-4"><span className="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">{l.stage}</span></td>
                    <td className="px-5 py-4 font-bold">R$ {Number(l.amount || 0).toLocaleString('pt-BR')}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    /* ── Relatórios Automáticos ── */
    const ReportsTab = ({ primaryColor }) => (
      <div className="space-y-6 animate-in fade-in duration-500">
        <p className="text-sm text-gray-500 font-medium">Relatórios gerados automaticamente por cliente, período e agente.</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {[
            { t: 'Relatório Mensal — Clientes Ativos', type: 'Cliente', period: 'Maio/25', s: 'Agendado', desc: 'Performance de todos os agentes por cliente, conversas, ROI.', sc: 'bg-blue-100 text-blue-700' },
            { t: 'Performance Geral dos Agentes', type: 'Interno', period: 'Maio/25', s: 'Agendado', desc: 'Uptime, resolução, escalações, custo e satisfação por agente.', sc: 'bg-blue-100 text-blue-700' },
            { t: 'Revenue Dashboard — Q2/25', type: 'Interno', period: 'Abr-Jun/25', s: 'Agendado', desc: 'MRR, ARR, Churn, NRR, LTV, CAC consolidados do trimestre.', sc: 'bg-blue-100 text-blue-700' },
            { t: 'NPS & CSAT — Mensal', type: 'Interno', period: 'Maio/25', s: 'Agendado', desc: 'Satisfação por agente, NPS por cliente, escalações e feedbacks.', sc: 'bg-blue-100 text-blue-700' },
          ].map((r, i) => (
            <div key={i} className="bg-white/80 border border-gray-200 rounded-2xl p-5 hover:border-gray-300 hover:shadow-sm transition-all shadow-sm">
              <div className="flex items-start justify-between mb-3">
                <div className="flex-1">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">{r.type}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${r.sc}`}>{r.s}</span>
                  </div>
                  <h4 className="font-bold text-gray-900">{r.t}</h4>
                </div>
                <span className="text-xs text-gray-400 font-medium shrink-0 ml-2">{r.period}</span>
              </div>
              <p className="text-sm text-gray-500 mb-4">{r.desc}</p>
              <div className="flex gap-2">
                <button className="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 transition-all">Visualizar</button>
                <button className="text-xs font-bold px-3 py-1.5 rounded-lg text-black transition-all" style={{ backgroundColor: primaryColor }}>Exportar PDF</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );

    /* ── Agent Tab Components ── */
    const AgentTabShell = ({ title, subtitle, sections, primaryColor }) => {
      const [vals, setVals] = useState(() => Object.fromEntries(sections.map(s=>[s.key,''])));
      const setV = (k,v) => setVals(prev=>({...prev,[k]:v}));
      const toast = useToast();
      const save = () => { localStorage.setItem(`pixt_agent_${title}`, JSON.stringify(vals)); toast('Salvo com sucesso','success'); };
      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="flex items-center justify-between">
            <div><h2 className="text-xl font-black text-gray-900">{title}</h2><p className="text-sm text-gray-400 mt-0.5">{subtitle}</p></div>
            <button onClick={save} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-black hover:opacity-90 transition-all" style={{backgroundColor:primaryColor}}>
              <Save size={15}/> Salvar
            </button>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {sections.map(s=>(
              <div key={s.key} className="bg-white/80 border border-gray-200 rounded-2xl p-5 shadow-sm">
                <label className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">{s.label}</label>
                <p className="text-[11px] text-gray-400 mb-3">{s.hint}</p>
                <textarea value={vals[s.key]} onChange={e=>setV(s.key,e.target.value)} rows={6}
                  placeholder={s.placeholder}
                  className="w-full text-sm border border-gray-100 rounded-xl px-3 py-2.5 outline-none focus:border-gray-300 bg-gray-50/50 resize-none leading-relaxed"/>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const AgentPlanTab = ({ agent, primaryColor }) => (
      <AgentTabShell primaryColor={primaryColor} title="Planejamento" subtitle="Defina o plano estratégico do agente para o cliente"
        sections={[
          { key:'objetivo', label:'Objetivo', hint:'Qual o objetivo principal deste agente para o cliente?', placeholder:'Ex: Qualificar leads inbound via WhatsApp e converter em reuniões agendadas...' },
          { key:'personas', label:'Personas-alvo', hint:'Para quem esse agente está configurado para atender?', placeholder:'Ex: Decisores de PMEs do setor de saúde, faixa de receita R$500k+...' },
          { key:'kpis', label:'KPIs e Metas', hint:'Quais métricas definem sucesso?', placeholder:'Ex: Taxa de conversão >25%, tempo de resposta <2min, CSAT >4,5...' },
          { key:'cronograma', label:'Cronograma', hint:'Fases de implementação e marcos importantes', placeholder:'Ex: Semana 1: onboarding, Semana 2: treinamento, Mês 1: go-live...' },
        ]}/>
    );

    const AgentPlaybookTab = ({ agent, primaryColor }) => (
      <AgentTabShell primaryColor={primaryColor} title="Playbook" subtitle="Scripts, abordagens e fluxos de conversação do agente"
        sections={[
          { key:'abordagem', label:'Abordagem Inicial', hint:'Como o agente deve se apresentar e iniciar a conversa?', placeholder:'Ex: Olá! Sou o assistente virtual da [Empresa]. Como posso ajudá-lo hoje?...' },
          { key:'objecoes', label:'Objeções Comuns', hint:'Principais objeções e como o agente deve respondê-las', placeholder:'Ex: "É caro" → Apresentar ROI e comparativo... "Não tenho tempo" → Oferecer agendamento...' },
          { key:'fechamento', label:'Técnicas de Fechamento', hint:'Como o agente deve conduzir ao próximo passo?', placeholder:'Ex: Oferecer trial, agendar demonstração, redirecionar para vendedor humano...' },
          { key:'followup', label:'Follow-up', hint:'Como e quando o agente deve retomar contatos sem resposta?', placeholder:'Ex: D+1: mensagem leve, D+3: proposta de valor, D+7: última tentativa + despedida...' },
        ]}/>
    );

    const AgentDocsTab = ({ agent, primaryColor }) => {
      const [active, setActive] = useState(null);
      const docs = [
        { id:'manual', label:'Manual do Agente', icon:FileText, desc:'Guia completo de operação, capacidades e limitações do agente', color:'#3b82f6' },
        { id:'integracoes', label:'Integrações', icon:Workflow, desc:'APIs conectadas, webhooks, CRM e ferramentas vinculadas ao agente', color:'#8b5cf6' },
        { id:'troubleshoot', label:'Troubleshooting', icon:AlertTriangle, desc:'Problemas frequentes e soluções — erros, comportamentos inesperados', color:'#f59e0b' },
        { id:'faq', label:'FAQ', icon:MessageSquare, desc:'Perguntas frequentes dos clientes sobre o agente e seus processos', color:'#22c55e' },
        { id:'changelog', label:'Changelog', icon:History, desc:'Histórico de versões, atualizações e mudanças de comportamento', color:'#14b8a6' },
        { id:'limitacoes', label:'Limitações', icon:AlertCircle, desc:'O que o agente não faz — escopo claro para gerenciar expectativas', color:'#ef4444' },
      ];
      const toast = useToast();
      const [texts, setTexts] = useState(() => {
        try { return JSON.parse(localStorage.getItem(`pixt_agent_docs_${agent}`) || '{}'); } catch { return {}; }
      });
      const save = () => { localStorage.setItem(`pixt_agent_docs_${agent}`, JSON.stringify(texts)); toast('Salvo','success'); };
      return (
        <div className="space-y-6 animate-in fade-in duration-500">
          <div className="flex items-center justify-between">
            <div><h2 className="text-xl font-black">Documentações</h2><p className="text-sm text-gray-400 mt-0.5">Documentação completa do agente para o cliente</p></div>
            {active && <button onClick={save} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-black" style={{backgroundColor:primaryColor}}><Save size={15}/> Salvar</button>}
          </div>
          {!active ? (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
              {docs.map(d=>(
                <button key={d.id} onClick={()=>setActive(d.id)} className="bg-white/80 border border-gray-200 rounded-2xl p-5 shadow-sm hover:border-gray-300 hover:shadow-md transition-all text-left group">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-3" style={{backgroundColor:d.color+'22'}}>
                    <d.icon size={20} style={{color:d.color}}/>
                  </div>
                  <p className="font-bold text-gray-900 text-sm mb-1">{d.label}</p>
                  <p className="text-[11px] text-gray-400 leading-relaxed">{d.desc}</p>
                </button>
              ))}
            </div>
          ) : (
            <div className="bg-white/80 border border-gray-200 rounded-2xl p-6 shadow-sm">
              <div className="flex items-center gap-3 mb-4">
                <button onClick={()=>setActive(null)} className="text-gray-400 hover:text-gray-700"><ChevronDown className="rotate-90" size={18}/></button>
                <h3 className="font-bold text-gray-900">{docs.find(d=>d.id===active)?.label}</h3>
              </div>
              <textarea value={texts[active]||''} onChange={e=>setTexts(t=>({...t,[active]:e.target.value}))} rows={18}
                placeholder="Digite ou cole a documentação aqui..."
                className="w-full text-sm border border-gray-100 rounded-xl px-4 py-3 outline-none focus:border-gray-300 bg-gray-50/50 resize-none leading-relaxed font-mono"/>
            </div>
          )}
        </div>
      );
    };

    /* =========================================================
       AGENT STRATEGY TAB — uses shared MindMapCanvas
       ========================================================= */
    const AgentStrategyTab = ({ agent, primaryColor }) => {
      const agentName = typeof agent === 'string' ? agent : agent?.name || 'Estratégia';
      const agentSlug = typeof agent === 'string' ? agent : agent?.slug || 'default';
      return (
        <MindMapCanvas
          storageKey={`pixt_mindmap_v2_${agentSlug}`}
          primaryColor={primaryColor}
          initialTitle={agentName}
          height="calc(100vh - 200px)"
          showHeader={true}
        />
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<ToastProvider><App /></ToastProvider>);
  </script>
</body>
</html>
